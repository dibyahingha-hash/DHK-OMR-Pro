<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DHK OMR Pro - Answer Key Configuration</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans select-none">

  <!-- HEADER -->
  <header class="bg-slate-900 border-b border-slate-800 p-3 sticky top-0 z-30 shadow-lg">
    <div class="flex items-center justify-between max-w-lg mx-auto">
      <div class="flex items-center gap-2">
        <a href="index.html" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300">
          <i data-lucide="arrow-left" class="w-4 h-4"></i>
        </a>
        <div>
          <h1 class="text-xs font-black uppercase tracking-wider text-white">Answer Key Configuration</h1>
          <div id="keyStatusBadge" class="text-[11px] font-medium text-amber-400">
            Editing Keys (0 Set)
          </div>
        </div>
      </div>

      <button id="lockKeyBtn" onclick="toggleKeyLock()" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold flex items-center gap-1 border border-slate-700">
        <i data-lucide="lock" class="w-3.5 h-3.5" id="lockIcon"></i>
        <span id="lockBtnText">Lock Key</span>
      </button>
    </div>

    <!-- CONTROLS STRIP -->
    <div class="grid grid-cols-2 gap-2 mt-2 max-w-lg mx-auto text-xs">
      <div>
        <label class="block text-slate-400 font-semibold mb-1 text-[10px] uppercase">Active Class</label>
        <select id="selectedClass" onchange="onClassChange(this.value)" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-white font-bold">
          <option value="III">Class III</option>
          <option value="IV">Class IV</option>
          <option value="V">Class V</option>
          <option value="VI">Class VI</option>
          <option value="VII">Class VII</option>
          <option value="VIII">Class VIII</option>
          <option value="IX">Class IX</option>
          <option value="X">Class X</option>
          <option value="XI">Class XI</option>
          <option value="XII">Class XII</option>
        </select>
      </div>

      <div>
        <label class="block text-slate-400 font-semibold mb-1 text-[10px] uppercase">Format / Question Count</label>
        <select id="totalQuestions" onchange="onQuestionCountChange(this.value)" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-cyan-400 font-bold">
          <option value="58">58 Questions (Gunotsav 43-Rail)</option>
          <option value="100">100 Questions (Universal 34-Rail)</option>
          <option value="75">75 Questions (Custom/Secondary)</option>
        </select>
      </div>
    </div>
  </header>

  <!-- KEY QUESTIONS LIST -->
  <main class="flex-1 max-w-lg mx-auto w-full p-3.5 space-y-2 pb-24">
    <div id="questionsContainer" class="space-y-1.5">
      <!-- Dynamically generated rows Q01 to Q58 or Q100 -->
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="bg-slate-900 border-t border-slate-800 p-3 sticky bottom-0 z-30 shadow-2xl">
    <div class="max-w-lg mx-auto flex items-center justify-between gap-2.5">
      <button onclick="resetCurrentKey()" class="px-4 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-rose-400 text-xs font-bold border border-slate-700">
        Reset Key
      </button>
      <button onclick="saveAndProceed()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white font-bold py-3 rounded-xl shadow-lg transition text-xs flex items-center justify-center gap-1.5">
        <i data-lucide="scan-line" class="w-4 h-4"></i>
        <span>Save & Proceed to Scanner</span>
      </button>
    </div>
  </footer>

  <script>
    let currentClass = 'III';
    let questionCount = 58;
    let answerKey = {};
    let isLocked = false;

    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      loadKeyForClass(currentClass);
    });

    function loadKeyForClass(cls) {
      currentClass = cls;
      const stored = localStorage.getItem(`dhk_key_${cls}`);
      answerKey = stored ? JSON.parse(stored) : {};

      const storedCount = Object.keys(answerKey).length;
      if (storedCount > 58) {
        questionCount = 100;
        document.getElementById('totalQuestions').value = "100";
      } else {
        questionCount = parseInt(document.getElementById('totalQuestions').value);
      }

      renderQuestions();
      updateStatusBadge();
    }

    function onClassChange(val) {
      currentClass = val;
      loadKeyForClass(val);
    }

    function onQuestionCountChange(val) {
      questionCount = parseInt(val);
      renderQuestions();
      updateStatusBadge();
    }

    function renderQuestions() {
      const container = document.getElementById('questionsContainer');
      container.innerHTML = '';

      for (let i = 1; i <= questionCount; i++) {
        const qNum = String(i).padStart(questionCount > 99 ? 3 : 2, '0');
        const selected = answerKey[i] || null;

        const row = document.createElement('div');
        row.className = "flex items-center justify-between p-2.5 rounded-xl bg-slate-900 border border-slate-800";
        row.innerHTML = `
          <span class="text-xs font-mono font-bold text-slate-300">Q${qNum}</span>
          <div class="flex gap-2">
            ${['A', 'B', 'C', 'D'].map(opt => `
              <button onclick="setOption(${i}, '${opt}')" class="w-8 h-8 rounded-full font-bold text-xs transition ${                 selected === opt                   ? 'bg-indigo-600 text-white shadow-lg ring-2 ring-indigo-400'                   : 'bg-slate-950 text-slate-400 border border-slate-800 hover:border-slate-600'               }">${opt}</button>
            `).join('')}
          </div>
        `;
        container.appendChild(row);
      }
    }

    function setOption(q, opt) {
      if (answerKey[q] === opt) {
        delete answerKey[q];
      } else {
        answerKey[q] = opt;
      }
      renderQuestions();
      updateStatusBadge();
      saveKey();
    }

    function updateStatusBadge() {
      const count = Object.keys(answerKey).length;
      const badge = document.getElementById('keyStatusBadge');
      if (count === 0) {
        badge.innerText = `Editing Class ${currentClass} (0 Keys Set)`;
        badge.className = "text-[11px] font-medium text-amber-400";
      } else {
        badge.innerText = `Class ${currentClass} (${count}/${questionCount} Keys Set)`;
        badge.className = "text-[11px] font-medium text-emerald-400";
      }
    }

    function saveKey() {
      localStorage.setItem(`dhk_key_${currentClass}`, JSON.stringify(answerKey));
      localStorage.setItem('dhk_master_key', JSON.stringify(answerKey));
    }

    function toggleKeyLock() {
      isLocked = !isLocked;
      const icon = document.getElementById('lockIcon');
      const text = document.getElementById('lockBtnText');
      if (isLocked) {
        text.innerText = "Unlock Key";
        icon.setAttribute('data-lucide', 'unlock');
      } else {
        text.innerText = "Lock Key";
        icon.setAttribute('data-lucide', 'lock');
      }
      lucide.createIcons();
    }

    function resetCurrentKey() {
      if (confirm(`Reset all answer keys for Class ${currentClass}?`)) {
        answerKey = {};
        saveKey();
        renderQuestions();
        updateStatusBadge();
      }
    }

    function saveAndProceed() {
      saveKey();
      localStorage.setItem('dhk_locked_class', currentClass);
      const isUniversal = questionCount > 58;
      window.location.href = `scan-mcq.html?format=${isUniversal ? 'universal' : 'gunotsav'}`;
    }
  </script>
</body>
</html>
