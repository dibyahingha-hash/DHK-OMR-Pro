<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DHK OMR PRO • Universal 100 Sheet</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #333; display: flex; flex-direction: column; align-items: center; padding: 10px; font-family: Arial, sans-serif; }
    .toolbar { width: 100%; max-width: 210mm; background: #fff; padding: 10px 16px; margin-bottom: 10px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
    .sheet-page { width: 210mm; height: 290mm; max-height: 290mm; background: #fff; overflow: hidden; page-break-after: avoid !important; page-break-inside: avoid !important; }
    svg { width: 100%; height: 100%; display: block; }
    @media print {
      html, body { width: 210mm; height: 297mm; margin: 0 !important; padding: 0 !important; background: none !important; overflow: hidden !important; }
      .toolbar { display: none !important; }
      .sheet-page { width: 210mm !important; height: 290mm !important; max-height: 290mm !important; margin: 0 auto !important; box-shadow: none !important; overflow: hidden !important; page-break-after: avoid !important; page-break-inside: avoid !important; }
      @page { size: A4 portrait; margin: 3mm 0 0 0; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <div>
      <strong style="font-size: 14px;">DHK OMR PRO</strong>
      <span style="font-size: 11px; color: #555; margin-left: 6px;">Universal 100-Q Matrix (Single A4)</span>
    </div>
    <button onclick="window.print()" style="padding: 7px 16px; font-weight: bold; background: #000; color: #fff; border: none; border-radius: 4px; cursor: pointer;">
      Print Sheet (A4)
    </button>
  </div>

  <div class="sheet-page">
    <svg viewBox="0 0 1000 1350" xmlns="http://www.w3.org/2000/svg">
      <rect x="25" y="20" width="950" height="1310" fill="none" stroke="#000" stroke-width="2" />
      <rect x="25" y="20" width="36" height="36" fill="#000" />
      <rect x="939" y="20" width="36" height="36" fill="#000" />
      <rect x="25" y="1294" width="36" height="36" fill="#000" />
      <rect x="939" y="1294" width="36" height="36" fill="#000" />

      <text x="70" y="52" font-size="18" font-weight="900">EVALUATION OMR</text>
      <rect x="805" y="36" width="132" height="20" fill="none" stroke="#000" stroke-width="1.3" />
      <text x="871" y="50" text-anchor="middle" font-size="10" font-weight="bold">100 QUESTIONS</text>
      
      <line x1="70" y1="62" x2="937" y2="62" stroke="#000" stroke-width="1.2" />
      <text x="503" y="73" text-anchor="middle" font-size="7.8" font-weight="bold">
        DO NOT FOLD OR TEAR OMR SHEET • USE BLACK/BLUE BALL PEN ONLY • DARKEN COMPLETELY
      </text>
      <line x1="70" y1="80" x2="937" y2="80" stroke="#000" stroke-width="1.2" />

      <rect x="40" y="96" width="22" height="8" fill="#000" />
      <text x="70" y="93" font-size="8" font-weight="bold">STUDENT NAME (CAPITAL LETTERS):</text>
      <g id="nameCells"></g>

      <text x="520" y="93" font-size="8" font-weight="bold">CLASS:</text>
      <rect x="520" y="97" width="180" height="19" fill="none" stroke="#000" stroke-width="1.2" />

      <text x="720" y="93" font-size="8" font-weight="bold">ROLL NO:</text>
      <rect x="720" y="97" width="217" height="19" fill="none" stroke="#000" stroke-width="1.2" />

      <g id="timingRail"></g>
      <g id="questionGrid"></g>

      <line x1="70" y1="1285" x2="937" y2="1285" stroke="#000" stroke-width="1.2" />
      <text x="70" y="1302" font-size="8" font-weight="bold">DHK OMR PRO ENGINE</text>
      <text x="503" y="1302" text-anchor="middle" font-size="8" font-weight="bold">Signature of Invigilator</text>
      <text x="937" y="1302" text-anchor="end" font-size="8" font-weight="bold">Signature of Head Master / Evaluator</text>
    </svg>
  </div>

  <script>
    (function initLayout() {
      const nameGroup = document.getElementById('nameCells');
      const railGroup = document.getElementById('timingRail');
      const gridGroup = document.getElementById('questionGrid');

      for (let b = 0; b < 18; b++) {
        const r = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        r.setAttribute("x", 70 + (b * 23.5));
        r.setAttribute("y", "97");
        r.setAttribute("width", "23.5");
        r.setAttribute("height", "19");
        r.setAttribute("fill", "none");
        r.setAttribute("stroke", "#000");
        r.setAttribute("stroke-width", "1.2");
        nameGroup.appendChild(r);
      }

      const colX = [70, 365, 660];
      const colW = 277;
      const startY = 126;
      const blockH = 148;
      const blockGap = 15;
      const rowPitch = 24.8;
      const rowPad = 17;
      const bubbleStartX = 155;
      const optGapX = 26;

      const boxMap = [
        [1, 5],   [21, 25], [41, 45],
        [6, 10],  [26, 30], [46, 50],
        [11, 15], [31, 35], [51, 55],
        [16, 20], [36, 40], [56, 60],
        [61, 65], [66, 70], [71, 75],
        [76, 80], [81, 85], [86, 90],
        [91, 95], [96, 100]
      ];

      for (let t = 0; t < 7; t++) {
        const blockY = startY + (t * (blockH + blockGap));

        for (let d = 0; d < 5; d++) {
          const dashY = blockY + rowPad + (d * rowPitch);
          const dash = document.createElementNS("http://www.w3.org/2000/svg", "rect");
          dash.setAttribute("x", "40");
          dash.setAttribute("y", dashY - 4);
          dash.setAttribute("width", "22");
          dash.setAttribute("height", "8");
          dash.setAttribute("fill", "#000");
          railGroup.appendChild(dash);
        }

        for (let c = 0; c < 3; c++) {
          const idx = (t * 3) + c;
          if (idx >= boxMap.length) continue;

          const bx = colX[c];
          const [qStart, qEnd] = boxMap[idx];

          const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
          rect.setAttribute("x", bx);
          rect.setAttribute("y", blockY);
          rect.setAttribute("width", colW);
          rect.setAttribute("height", blockH);
          rect.setAttribute("fill", "none");
          rect.setAttribute("stroke", "#000");
          rect.setAttribute("stroke-width", "1.3");
          rect.setAttribute("rx", "2");
          gridGroup.appendChild(rect);

          for (let q = qStart; q <= qEnd; q++) {
            const offset = q - qStart;
            const qY = blockY + rowPad + (offset * rowPitch);

            const txt = document.createElementNS("http://www.w3.org/2000/svg", "text");
            txt.setAttribute("x", bx + 12);
            txt.setAttribute("y", qY + 3.5);
            txt.setAttribute("font-size", "9.5");
            txt.setAttribute("font-weight", "bold");
            txt.textContent = q;
            gridGroup.appendChild(txt);

            ['A', 'B', 'C', 'D'].forEach((opt, oIdx) => {
              const cx = bx + bubbleStartX + (oIdx * optGapX);
              const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
              circle.setAttribute("cx", cx);
              circle.setAttribute("cy", qY);
              circle.setAttribute("r", "8");
              circle.setAttribute("fill", "#fff");
              circle.setAttribute("stroke", "#000");
              circle.setAttribute("stroke-width", "1.2");
              gridGroup.appendChild(circle);

              const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
              label.setAttribute("x", cx);
              label.setAttribute("y", qY + 2.8);
              label.setAttribute("text-anchor", "middle");
              label.setAttribute("font-size", "7.5");
              label.setAttribute("font-weight", "bold");
              label.textContent = opt;
              gridGroup.appendChild(label);
            });
          }
        }
      }
    })();
  </script>
</body>
</html>
