<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DHK OMR Pro - Answer Keys & Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @media print {
      body * { visibility: hidden !important; }
      #printableArea, #printableArea * { visibility: visible !important; }
      #printableArea {
        position: absolute !important;
        left: 0 !important;
        top: 0 !important;
        width: 100% !important;
        height: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        display: block !important;
        background: #fff !important;
      }
      @page {
        size: A4 portrait;
        margin: 0;
      }
    }
    * {
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans select-none">

  <!-- TOP HEADER -->
  <header class="bg-slate-900 border-b border-slate-800 p-3 sticky top-0 z-30 shadow-lg">
    <div class="flex items-center justify-between max-w-lg mx-auto">
      <div class="flex items-center gap-2">
        <a href="index.html" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300">
          <i data-lucide="arrow-left" class="w-4 h-4"></i>
        </a>
        <div>
          <h1 class="text-xs font-black uppercase tracking-wider text-white">Answer Key & Sheets</h1>
          <div id="keyStatusBadge" class="text-[11px] font-medium text-amber-400">Class III (0 Keys Set)</div>
        </div>
      </div>

      <button onclick="printCalibratedSheet()" class="px-2.5 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold flex items-center gap-1 shadow">
        <i data-lucide="printer" class="w-3.5 h-3.5"></i>
        <span>Print Sheet</span>
      </button>
    </div>

    <!-- CONTROLS STRIP -->
    <div class="grid grid-cols-2 gap-2 mt-2 max-w-lg mx-auto text-xs">
      <div>
        <label class="block text-slate-400 font-semibold mb-1 text-[10px] uppercase">Active Class</label>
        <select id="selectedClass" onchange="onClassChange(this.value)" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-white font-bold">
          <option value="III">Class III</option>
          <option value="IV">Class IV</option>
          <option value="V">Class V</option>
          <option value="VI">Class VI</option>
          <option value="VII">Class VII</option>
          <option value="VIII">Class VIII</option>
          <option value="IX">Class IX</option>
          <option value="X">Class X</option>
          <option value="XI">Class XI</option>
          <option value="XII">Class XII</option>
        </select>
      </div>

      <div>
        <label class="block text-slate-400 font-semibold mb-1 text-[10px] uppercase">Total Questions Needed</label>
        <input type="number" id="customQCount" min="1" max="100" value="58" onchange="onCustomCountChange(this.value)" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-cyan-400 font-bold font-mono focus:outline-none focus:border-cyan-400" />
      </div>
    </div>
  </header>

  <!-- KEY QUESTIONS LIST -->
  <main class="flex-1 max-w-lg mx-auto w-full p-3.5 space-y-2 pb-24">
    <div id="questionsContainer" class="space-y-1.5"></div>
  </main>

  <!-- FOOTER -->
  <footer class="bg-slate-900 border-t border-slate-800 p-3 sticky bottom-0 z-30 shadow-2xl">
    <div class="max-w-lg mx-auto flex items-center justify-between gap-2.5">
      <button onclick="resetCurrentKey()" class="px-4 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-rose-400 text-xs font-bold border border-slate-700">
        Reset Key
      </button>
      <button onclick="saveAndProceed()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white font-bold py-3 rounded-xl text-xs flex items-center justify-center gap-1.5 transition">
        <i data-lucide="scan-line" class="w-4 h-4"></i>
        <span>Save & Go to Scanner</span>
      </button>
    </div>
  </footer>

  <!-- EXACT SCANNER-ALIGNED PRINT CONTAINER (1000 x 1414 Coordinate Space) -->
  <div id="printableArea" class="hidden text-black font-sans">
    <svg id="omrSvg" viewBox="0 0 1000 1414" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" style="background:#fff;">
      <!-- Outer Target Border -->
      <rect x="25" y="25" width="950" height="1364" fill="none" stroke="#000" stroke-width="3" />

      <!-- 4 High-Precision Solid Black Fiducials -->
      <rect x="25" y="25" width="45" height="45" fill="#000" />
      <rect x="930" y="25" width="45" height="45" fill="#000" />
      <rect x="25" y="1344" width="45" height="45" fill="#000" />
      <rect x="930" y="1344" width="45" height="45" fill="#000" />

      <!-- Sheet Header -->
      <text x="500" y="100" text-anchor="middle" font-size="24" font-weight="900" font-family="Arial" letter-spacing="1">DHK PRECISION OMR ANSWER SHEET</text>
      <text x="500" y="130" text-anchor="middle" font-size="13" font-weight="bold" font-family="Arial" fill="#444">Universal 34-Timing Rail Engine • Standard Vision Grid</text>

      <!-- Exact Name OCR Box (x=7% to 51%, y=16.5% to 20%) -->
      <rect x="70" y="233" width="440" height="49" fill="none" stroke="#000" stroke-width="2" />
      <text x="80" y="222" font-size="11" font-weight="bold" font-family="Arial">CANDIDATE NAME (IN CAPITAL LETTERS)</text>

      <!-- Student Metadata Side-Boxes -->
      <rect x="530" y="233" width="200" height="49" fill="none" stroke="#000" stroke-width="1.5" />
      <text x="540" y="222" font-size="11" font-weight="bold" font-family="Arial">CLASS / SEC</text>

      <rect x="750" y="233" width="180" height="49" fill="none" stroke="#000" stroke-width="1.5" />
      <text x="760" y="222" font-size="11" font-weight="bold" font-family="Arial">ROLL / ID NO</text>

      <!-- Left 34 Timing Dashes (x=1.5% to 8% of width => x=30 to 70) -->
      <g id="svgLeftRail"></g>

      <!-- Right Timing Rail (Symmetry Anchor) -->
      <g id="svgRightRail"></g>

      <!-- Exact 3-Column Bubble Matrix -->
      <g id="svgGrid"></g>

      <!-- Footer Instructions -->
      <line x1="70" y1="1310" x2="930" y2="1310" stroke="#000" stroke-width="1.5" />
      <text x="70" y="1335" font-size="12" font-weight="bold" font-family="Arial">• Use Blue or Black Ballpoint Pen only</text>
      <text x="450" y="1335" font-size="12" font-weight="bold" font-family="Arial">• Darken bubbles completely: [ ● ]</text>
      <text x="930" y="1335" text-anchor="end" font-size="12" font-weight="bold" font-family="Arial">DHK 34-RAIL VISION SYSTEM</text>
    </svg>
  </div>

  <script>
    let currentClass = 'III';
    let questionCount = 58;
    let answerKey = {};

    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      loadKeyForClass(currentClass);
    });

    function loadKeyForClass(cls) {
      currentClass = cls;
      const stored = localStorage.getItem(`dhk_key_${cls}`) || localStorage.getItem('dhk_master_key');
      answerKey = {};
      if (stored) {
        try {
          const parsed = JSON.parse(stored);
          answerKey = parsed[cls] ? parsed[cls] : parsed;
        } catch (e) {
          answerKey = {};
        }
      }

      const storedQCount = localStorage.getItem(`dhk_qcount_${cls}`);
      if (storedQCount) {
        questionCount = parseInt(storedQCount);
      } else {
        const keysArr = Object.keys(answerKey).map(Number);
        questionCount = keysArr.length > 0 ? Math.max(...keysArr) : (cls === 'III' ? 58 : 50);
      }

      document.getElementById('customQCount').value = questionCount;
      renderQuestions();
      updateStatusBadge();
    }

    function onClassChange(val) {
      currentClass = val;
      loadKeyForClass(val);
    }

    function onCustomCountChange(val) {
      let num = parseInt(val) || 1;
      if (num < 1) num = 1;
      if (num > 100) num = 100;
      questionCount = num;
      document.getElementById('customQCount').value = num;
      localStorage.setItem(`dhk_qcount_${currentClass}`, num);
      renderQuestions();
      updateStatusBadge();
    }

    function renderQuestions() {
      const container = document.getElementById('questionsContainer');
      container.innerHTML = '';

      for (let i = 1; i <= questionCount; i++) {
        const qNum = String(i).padStart(questionCount > 99 ? 3 : 2, '0');
        const selected = answerKey[i] || null;

        const row = document.createElement('div');
        row.className = "flex items-center justify-between p-2.5 rounded-xl bg-slate-900 border border-slate-800";
        row.innerHTML = `
          <span class="text-xs font-mono font-bold text-slate-300">Q${qNum}</span>
          <div class="flex gap-2">
            ${['A', 'B', 'C', 'D'].map(opt => `
              <button onclick="setOption(${i}, '${opt}')" class="w-8 h-8 rounded-full font-bold text-xs transition ${                 selected === opt ? 'bg-indigo-600 text-white shadow-lg ring-2 ring-indigo-400' : 'bg-slate-950 text-slate-400 border border-slate-800 hover:border-slate-700'               }">${opt}</button>
            `).join('')}
          </div>
        `;
        container.appendChild(row);
      }
    }

    function setOption(q, opt) {
      answerKey[q] = (answerKey[q] === opt) ? null : opt;
      if (!answerKey[q]) delete answerKey[q];
      renderQuestions();
      updateStatusBadge();
      saveState();
    }

    function updateStatusBadge() {
      const count = Object.keys(answerKey).length;
      document.getElementById('keyStatusBadge').innerText = `Class ${currentClass} (${count}/${questionCount} Keys Set)`;
    }

    function saveState() {
      localStorage.setItem(`dhk_key_${currentClass}`, JSON.stringify(answerKey));
      localStorage.setItem(`dhk_qcount_${currentClass}`, questionCount);
      localStorage.setItem('dhk_master_key', JSON.stringify(answerKey));
    }

    function resetCurrentKey() {
      if (confirm(`Reset answer key for Class ${currentClass}?`)) {
        answerKey = {};
        localStorage.removeItem(`dhk_key_${currentClass}`);
        renderQuestions();
        updateStatusBadge();
      }
    }

    function saveAndProceed() {
      saveState();
      localStorage.setItem('dhk_locked_class', currentClass);
      localStorage.setItem('dhk_active_total_q', questionCount);
      window.location.href = `scan.html`;
    }

    // DRAW EXACT SCANNER-ALIGNED SHEET
    function printCalibratedSheet() {
      const H = 1414;
      const W = 1000;

      // 1. EXACT Y-COORDINATES MATCHING scan.html FALLBACK & TIMING RAIL:
      // In scan.html: step = (h * 0.69) / 34, start = h * 0.21
      const startY = H * 0.21;          // 296.94px
      const totalGridHeight = H * 0.69;  // 975.66px
      const stepY = totalGridHeight / 34; // 28.69px per question row

      const leftRailSvg = document.getElementById('svgLeftRail');
      const rightRailSvg = document.getElementById('svgRightRail');
      const gridSvg = document.getElementById('svgGrid');
      leftRailSvg.innerHTML = '';
      rightRailSvg.innerHTML = '';
      gridSvg.innerHTML = '';

      // Draw the 34 solid black timing dashes along both margins
      for (let r = 0; r < 34; r++) {
        const cy = startY + (r * stepY);
        const dashH = 10;
        const dashW = 35;

        // Left rail (inside x=30 to x=65, precisely inside scanner's 0.015-0.08 window)
        const dLeft = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        dLeft.setAttribute("x", "30");
        dLeft.setAttribute("y", cy - (dashH / 2));
        dLeft.setAttribute("width", dashW);
        dLeft.setAttribute("height", dashH);
        dLeft.setAttribute("fill", "#000");
        leftRailSvg.appendChild(dLeft);

        // Right rail
        const dRight = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        dRight.setAttribute("x", "935");
        dRight.setAttribute("y", cy - (dashH / 2));
        dRight.setAttribute("width", dashW);
        dRight.setAttribute("height", dashH);
        dRight.setAttribute("fill", "#000");
        rightRailSvg.appendChild(dRight);
      }

      // 2. EXACT COLUMN & OPTION BUBBLES MATCHING scan.html:
      // colBaseX = [0.12, 0.41, 0.70] => W * 0.12 = 120, W * 0.41 = 410, W * 0.70 = 700
      // optionGap = 0.045 => W * 0.045 = 45px between A, B, C, D
      const colBaseX = [120, 410, 700];
      const gapX = 45;
      const opts = ['A', 'B', 'C', 'D'];
      let qNum = 1;

      for (let c = 0; c < 3; c++) {
        for (let r = 0; r < 34; r++) {
          if (qNum > questionCount) break;

          const cy = startY + (r * stepY);
          const baseX = colBaseX[c];

          // Question Number
          const txt = document.createElementNS("http://www.w3.org/2000/svg", "text");
          txt.setAttribute("x", baseX - 12);
          txt.setAttribute("y", cy + 4);
          txt.setAttribute("text-anchor", "end");
          txt.setAttribute("font-size", "11");
          txt.setAttribute("font-family", "monospace");
          txt.setAttribute("font-weight", "bold");
          txt.textContent = String(qNum).padStart(2, '0');
          gridSvg.appendChild(txt);

          // 4 Bubbles (A, B, C, D)
          opts.forEach((opt, idx) => {
            const bx = baseX + (idx * gapX);

            const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            circle.setAttribute("cx", bx);
            circle.setAttribute("cy", cy);
            circle.setAttribute("r", "10");
            circle.setAttribute("fill", "#fff");
            circle.setAttribute("stroke", "#000");
            circle.setAttribute("stroke-width", "1.8");
            gridSvg.appendChild(circle);

            const optTxt = document.createElementNS("http://www.w3.org/2000/svg", "text");
            optTxt.setAttribute("x", bx);
            optTxt.setAttribute("y", cy + 3.5);
            optTxt.setAttribute("text-anchor", "middle");
            optTxt.setAttribute("font-size", "9");
            optTxt.setAttribute("font-family", "Arial");
            optTxt.setAttribute("font-weight", "bold");
            optTxt.textContent = opt;
            gridSvg.appendChild(optTxt);
          });

          qNum++;
        }
      }

      window.print();
    }
  </script>
</body>
</html>
