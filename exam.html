<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DHK OMR Pro - Answer Keys & Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @media print {
      body * { visibility: hidden !important; }
      #printableArea, #printableArea * { visibility: visible !important; }
      #printableArea {
        position: absolute !important;
        left: 0 !important;
        top: 0 !important;
        width: 100% !important;
        height: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        display: block !important;
        background: #fff !important;
      }
      @page {
        size: A4 portrait;
        margin: 0;
      }
    }
    * {
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans select-none">

  <!-- TOP HEADER -->
  <header class="bg-slate-900 border-b border-slate-800 p-3 sticky top-0 z-30 shadow-lg">
    <div class="flex items-center justify-between max-w-lg mx-auto">
      <div class="flex items-center gap-2">
        <a href="index.html" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300">
          <i data-lucide="arrow-left" class="w-4 h-4"></i>
        </a>
        <div>
          <h1 class="text-xs font-black uppercase tracking-wider text-white">Answer Key & Sheets</h1>
          <div id="keyStatusBadge" class="text-[11px] font-medium text-amber-400">Universal Mode (0 Keys Set)</div>
        </div>
      </div>

      <!-- PRINT UNIVERSAL SHEET (NO CLASS HARDCODED) -->
      <button onclick="printCalibratedSheet()" class="px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold flex items-center gap-1.5 shadow">
        <i data-lucide="printer" class="w-3.5 h-3.5"></i>
        <span>Print Sheet</span>
      </button>
    </div>

    <!-- CONTROLS STRIP -->
    <div class="grid grid-cols-2 gap-2 mt-2 max-w-lg mx-auto text-xs">
      <div>
        <label class="block text-slate-400 font-semibold mb-1 text-[10px] uppercase">Target Class</label>
        <select id="selectedClass" onchange="onClassChange(this.value)" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-white font-bold">
          <option value="UNIVERSAL" selected>Universal (No Class)</option>
          <option value="Ka-Shreni">Class Ka</option>
          <option value="I">Class I</option>
          <option value="II">Class II</option>
          <option value="III">Class III</option>
          <option value="IV">Class IV</option>
          <option value="V">Class V</option>
          <option value="VI">Class VI</option>
          <option value="VII">Class VII</option>
          <option value="VIII">Class VIII</option>
          <option value="IX">Class IX</option>
          <option value="X">Class X</option>
          <option value="XI">Class XI</option>
          <option value="XII">Class XII</option>
        </select>
      </div>

      <div>
        <label class="block text-slate-400 font-semibold mb-1 text-[10px] uppercase">Questions Needed</label>
        <input type="number" id="customQCount" min="1" max="100" value="100" onchange="onCustomCountChange(this.value)" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-cyan-400 font-bold font-mono focus:outline-none focus:border-cyan-400" />
      </div>
    </div>

    <!-- SCAN KEY DIRECTLY VIA CAMERA OR TAP -->
    <div class="mt-2.5 max-w-lg mx-auto">
      <button onclick="scanKeyWithCamera()" class="w-full py-2 rounded-xl bg-amber-600 hover:bg-amber-500 text-white font-bold text-xs flex items-center justify-center gap-1.5 shadow transition">
        <i data-lucide="camera" class="w-4 h-4"></i>
        <span>Scan Key With Camera (Optical Reader)</span>
      </button>
    </div>
  </header>

  <!-- KEY QUESTIONS LIST (FOR MANUAL TAP INPUT) -->
  <main class="flex-1 max-w-lg mx-auto w-full p-3.5 space-y-2 pb-24">
    <div id="questionsContainer" class="space-y-1.5"></div>
  </main>

  <!-- FOOTER -->
  <footer class="bg-slate-900 border-t border-slate-800 p-3 sticky bottom-0 z-30 shadow-2xl">
    <div class="max-w-lg mx-auto flex items-center justify-between gap-2.5">
      <button onclick="resetCurrentKey()" class="px-4 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-rose-400 text-xs font-bold border border-slate-700">
        Reset
      </button>
      <button onclick="saveAndProceed()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white font-bold py-3 rounded-xl text-xs flex items-center justify-center gap-1.5 transition">
        <i data-lucide="scan-line" class="w-4 h-4"></i>
        <span>Save Key & Start Evaluating</span>
      </button>
    </div>
  </footer>

  <!-- SCANNER-ALIGNED PRINT CONTAINER (100% UNIVERSAL: ZERO HARDCODED CLASS) -->
  <div id="printableArea" class="hidden text-black font-sans">
    <svg id="omrSvg" viewBox="0 0 1000 1414" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" style="background:#fff;">
      <rect x="25" y="25" width="950" height="1364" fill="none" stroke="#000" stroke-width="3" />

      <!-- 4 Solid Black Fiducials -->
      <rect x="25" y="25" width="45" height="45" fill="#000" />
      <rect x="930" y="25" width="45" height="45" fill="#000" />
      <rect x="25" y="1344" width="45" height="45" fill="#000" />
      <rect x="930" y="1344" width="45" height="45" fill="#000" />

      <!-- Universal Header -->
      <text x="500" y="95" text-anchor="middle" font-size="24" font-weight="900" font-family="Arial" letter-spacing="1">DHK PRECISION OMR ANSWER SHEET</text>
      <text x="500" y="125" text-anchor="middle" font-size="13" font-weight="bold" font-family="Arial" fill="#333">Standard Evaluation Grid • 34-Rail Calibration System</text>

      <!-- Blank Student Info Strip (NO HARDCODED CLASS) -->
      <rect x="70" y="225" width="450" height="52" fill="none" stroke="#000" stroke-width="2" />
      <text x="80" y="215" font-size="11" font-weight="bold" font-family="Arial">CANDIDATE NAME</text>

      <rect x="540" y="225" width="190" height="52" fill="none" stroke="#000" stroke-width="1.5" />
      <text x="550" y="215" font-size="11" font-weight="bold" font-family="Arial">CLASS / SEC</text>

      <rect x="750" y="225" width="180" height="52" fill="none" stroke="#000" stroke-width="1.5" />
      <text x="760" y="215" font-size="11" font-weight="bold" font-family="Arial">ROLL / ID NO</text>

      <!-- Left & Right 34-Rail Timing Dashes -->
      <g id="svgLeftRail"></g>
      <g id="svgRightRail"></g>

      <!-- Bubble Grid -->
      <g id="svgGrid"></g>

      <!-- Footer Rules -->
      <line x1="70" y1="1310" x2="930" y2="1310" stroke="#000" stroke-width="1.5" />
      <text x="70" y="1335" font-size="12" font-weight="bold" font-family="Arial">• Use Blue or Black Ballpoint Pen only</text>
      <text x="450" y="1335" font-size="12" font-weight="bold" font-family="Arial">• Fill circles completely: [ ● ]</text>
      <text x="930" y="1335" text-anchor="end" font-size="12" font-weight="bold" font-family="Arial">DHK 34-RAIL VISION SYSTEM</text>
    </svg>
  </div>

  <script>
    let currentTarget = 'UNIVERSAL';
    let questionCount = 100;
    let answerKey = {};

    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      loadKey(currentTarget);
    });

    function loadKey(target) {
      currentTarget = target;
      const keyId = target === 'UNIVERSAL' ? 'dhk_master_key' : `dhk_key_${target}`;
      const stored = localStorage.getItem(keyId);
      answerKey = {};

      if (stored) {
        try {
          const parsed = JSON.parse(stored);
          answerKey = parsed[target] ? parsed[target] : parsed;
        } catch (e) {
          answerKey = {};
        }
      }

      const countId = target === 'UNIVERSAL' ? 'dhk_active_total_q' : `dhk_qcount_${target}`;
      const storedCount = localStorage.getItem(countId);
      if (storedCount) {
        questionCount = parseInt(storedCount);
      } else {
        const keysArr = Object.keys(answerKey).map(Number);
        questionCount = keysArr.length > 0 ? Math.max(...keysArr) : 100;
      }

      document.getElementById('customQCount').value = questionCount;
      renderQuestions();
      updateStatusBadge();
    }

    function onClassChange(val) {
      loadKey(val);
    }

    function onCustomCountChange(val) {
      let num = parseInt(val) || 1;
      if (num < 1) num = 1;
      if (num > 100) num = 100;
      questionCount = num;
      document.getElementById('customQCount').value = num;

      const countId = currentTarget === 'UNIVERSAL' ? 'dhk_active_total_q' : `dhk_qcount_${currentTarget}`;
      localStorage.setItem(countId, num);

      renderQuestions();
      updateStatusBadge();
    }

    function renderQuestions() {
      const container = document.getElementById('questionsContainer');
      container.innerHTML = '';

      for (let i = 1; i <= questionCount; i++) {
        const qNum = String(i).padStart(3, '0');
        const selected = answerKey[i] || null;

        const row = document.createElement('div');
        row.className = "flex items-center justify-between p-2.5 rounded-xl bg-slate-900 border border-slate-800";
        row.innerHTML = `
          <span class="text-xs font-mono font-bold text-slate-300">Q${qNum}</span>
          <div class="flex gap-2">
            ${['A', 'B', 'C', 'D'].map(opt => `
              <button onclick="setOption(${i}, '${opt}')" class="w-8 h-8 rounded-full font-bold text-xs transition ${                 selected === opt ? 'bg-indigo-600 text-white shadow-lg ring-2 ring-indigo-400' : 'bg-slate-950 text-slate-400 border border-slate-800 hover:border-slate-700'               }">${opt}</button>
            `).join('')}
          </div>
        `;
        container.appendChild(row);
      }
    }

    function setOption(q, opt) {
      answerKey[q] = (answerKey[q] === opt) ? null : opt;
      if (!answerKey[q]) delete answerKey[q];
      renderQuestions();
      updateStatusBadge();
      saveState();
    }

    function updateStatusBadge() {
      const count = Object.keys(answerKey).length;
      const label = currentTarget === 'UNIVERSAL' ? 'Universal Key' : `Class ${currentTarget}`;
      document.getElementById('keyStatusBadge').innerText = `${label} (${count}/${questionCount} Keys Set)`;
    }

    function saveState() {
      const keyId = currentTarget === 'UNIVERSAL' ? 'dhk_master_key' : `dhk_key_${currentTarget}`;
      localStorage.setItem(keyId, JSON.stringify(answerKey));
      localStorage.setItem('dhk_master_key', JSON.stringify(answerKey));
      localStorage.setItem('dhk_active_total_q', questionCount);
    }

    function resetCurrentKey() {
      if (confirm(`Reset answer key?`)) {
        answerKey = {};
        const keyId = currentTarget === 'UNIVERSAL' ? 'dhk_master_key' : `dhk_key_${currentTarget}`;
        localStorage.removeItem(keyId);
        renderQuestions();
        updateStatusBadge();
      }
    }

    // Direct Camera Scan Trigger for Key
    function scanKeyWithCamera() {
      saveState();
      window.location.href = `scan.html?mode=master_key`;
    }

    function saveAndProceed() {
      saveState();
      if (currentTarget !== 'UNIVERSAL') {
        localStorage.setItem('dhk_locked_class', currentTarget);
      }
      window.location.href = `scan.html`;
    }

    // PRINT UNIVERSAL SHEET (ZERO HARDCODED CLASS)
    function printCalibratedSheet() {
      const H = 1414;
      const startY = H * 0.21;
      const totalGridHeight = H * 0.69;
      const stepY = totalGridHeight / 34;

      const leftRailSvg = document.getElementById('svgLeftRail');
      const rightRailSvg = document.getElementById('svgRightRail');
      const gridSvg = document.getElementById('svgGrid');
      leftRailSvg.innerHTML = '';
      rightRailSvg.innerHTML = '';
      gridSvg.innerHTML = '';

      for (let r = 0; r < 34; r++) {
        const cy = startY + (r * stepY);
        const dashH = 10;
        const dashW = 35;

        const dLeft = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        dLeft.setAttribute("x", "30");
        dLeft.setAttribute("y", cy - (dashH / 2));
        dLeft.setAttribute("width", dashW);
        dLeft.setAttribute("height", dashH);
        dLeft.setAttribute("fill", "#000");
        leftRailSvg.appendChild(dLeft);

        const dRight = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        dRight.setAttribute("x", "935");
        dRight.setAttribute("y", cy - (dashH / 2));
        dRight.setAttribute("width", dashW);
        dRight.setAttribute("height", dashH);
        dRight.setAttribute("fill", "#000");
        rightRailSvg.appendChild(dRight);
      }

      const colBaseX = [120, 410, 700];
      const gapX = 45;
      const opts = ['A', 'B', 'C', 'D'];
      let qNum = 1;

      for (let c = 0; c < 3; c++) {
        for (let r = 0; r < 34; r++) {
          if (qNum > questionCount) break;

          const cy = startY + (r * stepY);
          const baseX = colBaseX[c];

          const txt = document.createElementNS("http://www.w3.org/2000/svg", "text");
          txt.setAttribute("x", baseX - 12);
          txt.setAttribute("y", cy + 4);
          txt.setAttribute("text-anchor", "end");
          txt.setAttribute("font-size", "11");
          txt.setAttribute("font-family", "monospace");
          txt.setAttribute("font-weight", "bold");
          txt.textContent = String(qNum).padStart(2, '0');
          gridSvg.appendChild(txt);

          opts.forEach((opt, idx) => {
            const bx = baseX + (idx * gapX);

            const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            circle.setAttribute("cx", bx);
            circle.setAttribute("cy", cy);
            circle.setAttribute("r", "10");
            circle.setAttribute("fill", "#fff");
            circle.setAttribute("stroke", "#000");
            circle.setAttribute("stroke-width", "1.8");
            gridSvg.appendChild(circle);

            const optTxt = document.createElementNS("http://www.w3.org/2000/svg", "text");
            optTxt.setAttribute("x", bx);
            optTxt.setAttribute("y", cy + 3.5);
            optTxt.setAttribute("text-anchor", "middle");
            optTxt.setAttribute("font-size", "9");
            optTxt.setAttribute("font-family", "Arial");
            optTxt.setAttribute("font-weight", "bold");
            optTxt.textContent = opt;
            gridSvg.appendChild(optTxt);
          });

          qNum++;
        }
      }

      window.print();
    }
  </script>
</body>
</html>
