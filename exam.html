<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DHK OMR Pro - Answer Key Manager</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans select-none">

  <!-- TOP HEADER -->
  <header class="bg-slate-900 border-b border-slate-800 p-3 shadow-md z-20 sticky top-0">
    <div class="flex items-center justify-between max-w-2xl mx-auto">
      <div class="flex items-center gap-2">
        <a href="index.html" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition">
          <i data-lucide="arrow-left" class="w-5 h-5"></i>
        </a>
        <div>
          <h1 class="text-sm font-bold text-white tracking-wide uppercase">Answer Key Configuration</h1>
          <div id="keyStatusBadge" class="text-xs text-amber-400 font-medium">Select a class to edit</div>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button id="lockKeyBtn" onclick="toggleKeyLock()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-800 border border-slate-700 hover:bg-slate-700 text-xs font-bold text-slate-200 transition">
          <i data-lucide="lock" id="lockKeyIcon" class="w-4 h-4"></i>
          <span id="lockKeyText">Lock Key</span>
        </button>
      </div>
    </div>

    <!-- CLASS & QUESTION COUNT STRIP -->
    <div class="grid grid-cols-2 gap-2 mt-3 max-w-2xl mx-auto pt-2 border-t border-slate-800 text-xs">
      <div>
        <label class="block text-slate-400 font-semibold mb-1 uppercase text-[10px]">Active Class</label>
        <select id="examClass" onchange="switchExamClass(this.value)" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-white font-bold focus:outline-none focus:border-indigo-500">
          <option value="">-- Choose Class --</option>
          <option value="I">Class I</option>
          <option value="II">Class II</option>
          <option value="III">Class III</option>
          <option value="IV">Class IV</option>
          <option value="V">Class V</option>
          <option value="IX">Class IX</option>
          <option value="X">Class X</option>
        </select>
      </div>

      <div>
        <label class="block text-slate-400 font-semibold mb-1 uppercase text-[10px]">Total Questions</label>
        <select id="examTotalQ" onchange="changeQuestionCount(this.value)" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-white font-bold focus:outline-none focus:border-indigo-500">
          <option value="58">58 Questions (Gunotsav Primary)</option>
          <option value="75">75 Questions</option>
          <option value="100">100 Questions (Universal DHK)</option>
          <option value="50">50 Questions</option>
          <option value="30">30 Questions</option>
        </select>
      </div>
    </div>
  </header>

  <!-- ANSWER KEY GRID -->
  <main class="flex-1 max-w-2xl mx-auto w-full p-4 overflow-y-auto">
    <div id="gridContainer" class="grid grid-cols-1 sm:grid-cols-2 gap-2.5 pb-20">
      <!-- Generated via JS -->
    </div>
  </main>

  <!-- BOTTOM ACTION BAR -->
  <footer class="bg-slate-900 border-t border-slate-800 p-3 sticky bottom-0 z-20 shadow-xl">
    <div class="max-w-2xl mx-auto flex items-center justify-between gap-3">
      <button onclick="clearCurrentKey()" id="clearKeyBtn" class="px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-rose-900/40 text-rose-400 border border-slate-700 text-xs font-bold transition">
        Reset Key
      </button>
      <a href="scan.html" class="flex-1 flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white font-bold py-2.5 rounded-xl transition text-sm">
        <i data-lucide="scan-line" class="w-4 h-4"></i>
        <span>Proceed to Scanner</span>
      </a>
    </div>
  </footer>

  <script>
    let activeClass = "";
    let activeKey = {};
    let isKeyLocked = false;

    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      const lastClass = localStorage.getItem('dhk_locked_class') || "III";
      document.getElementById('examClass').value = lastClass;
      switchExamClass(lastClass);
    });

    function switchExamClass(className) {
      if (!className) {
        document.getElementById('gridContainer').innerHTML = `
          <div class="col-span-full py-12 text-center text-slate-500 text-sm">
            Please choose a class from above to configure its answer key.
          </div>`;
        document.getElementById('keyStatusBadge').innerText = "Select a class to edit";
        return;
      }

      activeClass = className;
      localStorage.setItem('dhk_locked_class', activeClass);

      // Load class-specific key from local storage
      const stored = localStorage.getItem(`dhk_key_${activeClass}`);
      if (stored) {
        try {
          activeKey = JSON.parse(stored);
        } catch(e) {
          activeKey = {};
        }
      } else {
        activeKey = {};
      }

      // Check if locked
      isKeyLocked = localStorage.getItem(`dhk_key_locked_${activeClass}`) === 'true';

      const totalQ = Object.keys(activeKey).length > 58 ? Object.keys(activeKey).length : 58;
      document.getElementById('examTotalQ').value = totalQ;

      renderGrid(totalQ);
      applyLockUI();
    }

    function changeQuestionCount(count) {
      renderGrid(parseInt(count, 10));
      saveCurrentKey();
    }

    function renderGrid(total) {
      const container = document.getElementById('gridContainer');
      container.innerHTML = "";

      for (let q = 1; q <= total; q++) {
        const selected = activeKey[q] || "";
        const row = document.createElement('div');
        row.className = "flex items-center justify-between bg-slate-900 border border-slate-800 p-2 rounded-xl key-row";
        row.id = `q_row_${q}`;

        let optionsHtml = ['A', 'B', 'C', 'D'].map(opt => `
          <button type="button" 
                  onclick="selectOption(${q}, '${opt}')" 
                  data-q="${q}" data-opt="${opt}"
                  class="bubble-btn w-8 h-8 rounded-full border text-xs font-bold transition flex items-center justify-center ${selected === opt ? 'bg-indigo-600 border-indigo-400 text-white shadow-md' : 'bg-slate-950 border-slate-700 text-slate-300 hover:border-slate-500'}">
            ${opt}
          </button>
        `).join('');

        row.innerHTML = `
          <span class="text-xs font-mono font-bold text-slate-400 w-10">Q${q < 10 ? '0' + q : q}</span>
          <div class="flex items-center gap-2">
            ${optionsHtml}
          </div>
        `;
        container.appendChild(row);
      }
    }

    function selectOption(q, opt) {
      if (isKeyLocked) return;

      if (activeKey[q] === opt) {
        delete activeKey[q];
      } else {
        activeKey[q] = opt;
      }

      updateRowUI(q);
      saveCurrentKey();
    }

    function updateRowUI(q) {
      const row = document.getElementById(`q_row_${q}`);
      if (!row) return;

      const selected = activeKey[q] || "";
      row.querySelectorAll('.bubble-btn').forEach(btn => {
        const opt = btn.getAttribute('data-opt');
        if (opt === selected) {
          btn.className = "bubble-btn w-8 h-8 rounded-full border text-xs font-bold transition flex items-center justify-center bg-indigo-600 border-indigo-400 text-white shadow-md";
        } else {
          btn.className = "bubble-btn w-8 h-8 rounded-full border text-xs font-bold transition flex items-center justify-center bg-slate-950 border-slate-700 text-slate-300 hover:border-slate-500";
        }
      });
    }

    function saveCurrentKey() {
      if (!activeClass) return;
      localStorage.setItem(`dhk_key_${activeClass}`, JSON.stringify(activeKey));
      localStorage.setItem('dhk_master_key', JSON.stringify(activeKey)); // legacy fallback
      updateStatusBadge();
    }

    function toggleKeyLock() {
      if (!activeClass) {
        alert("Select a class first.");
        return;
      }
      isKeyLocked = !isKeyLocked;
      localStorage.setItem(`dhk_key_locked_${activeClass}`, isKeyLocked ? 'true' : 'false');
      applyLockUI();
    }

    function applyLockUI() {
      const lockBtnText = document.getElementById('lockKeyText');
      const lockIcon = document.getElementById('lockKeyIcon');
      const clearBtn = document.getElementById('clearKeyBtn');
      const totalQSelect = document.getElementById('examTotalQ');

      // Physical locking of DOM elements
      document.querySelectorAll('.bubble-btn').forEach(btn => {
        btn.disabled = isKeyLocked;
        btn.style.pointerEvents = isKeyLocked ? 'none' : 'auto';
      });
      totalQSelect.disabled = isKeyLocked;
      clearBtn.disabled = isKeyLocked;
      clearBtn.style.opacity = isKeyLocked ? '0.4' : '1';

      if (isKeyLocked) {
        lockBtnText.innerText = "Unlock Key";
        lockIcon.setAttribute('data-lucide', 'unlock');
      } else {
        lockBtnText.innerText = "Lock Key";
        lockIcon.setAttribute('data-lucide', 'lock');
      }
      lucide.createIcons();
      updateStatusBadge();
    }

    function updateStatusBadge() {
      const badge = document.getElementById('keyStatusBadge');
      const count = Object.keys(activeKey).length;
      if (!activeClass) {
        badge.innerText = "Select a class to edit";
        badge.className = "text-xs text-amber-400 font-medium";
        return;
      }

      if (isKeyLocked) {
        badge.innerHTML = `<span class="text-emerald-400 font-bold">🔒 Class ${activeClass} Locked (${count} Keys Set)</span>`;
      } else {
        badge.innerHTML = `<span class="text-amber-400 font-medium">✏️ Editing Class ${activeClass} (${count} Keys Set)</span>`;
      }
    }

    function clearCurrentKey() {
      if (isKeyLocked) return;
      if (confirm(`Clear all answers for Class ${activeClass}?`)) {
        activeKey = {};
        saveCurrentKey();
        const total = parseInt(document.getElementById('examTotalQ').value, 10);
        renderGrid(total);
      }
    }
  </script>
</body>
</html>
