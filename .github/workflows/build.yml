name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build DHK OMR Pro APK
    runs-on: ubuntu-22.04

    steps:

      # --------------------------------------------------
      # 1. Checkout source code
      # --------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Set up Python
      # --------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"


      # --------------------------------------------------
      # 3. Set up Java
      # --------------------------------------------------
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"


      # --------------------------------------------------
      # 4. Install Linux dependencies
      # --------------------------------------------------
      - name: Install System Packages
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            ccache


      # --------------------------------------------------
      # 5. Upgrade Python build tools
      # --------------------------------------------------
      - name: Install Build Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel

          python -m pip install \
            "buildozer==1.5.0" \
            "cython<3.0"


      # --------------------------------------------------
      # 6. Display versions
      # --------------------------------------------------
      - name: Check Build Environment
        run: |
          echo "===== Python ====="
          python --version

          echo "===== Pip ====="
          python -m pip --version

          echo "===== Java ====="
          java -version

          echo "===== Buildozer ====="
          buildozer --version

          echo "===== Cython ====="
          cython --version


      # --------------------------------------------------
      # 7. Clean old Buildozer files
      # --------------------------------------------------
      - name: Clean Previous Build
        run: |
          rm -rf .buildozer
          rm -rf bin


      # --------------------------------------------------
      # 8. Build Android APK
      # --------------------------------------------------
      - name: Build APK
        run: |
          buildozer -v android debug 2>&1 | tee build.log


      # --------------------------------------------------
      # 9. Show useful error information if build fails
      # --------------------------------------------------
      - name: Show Build Error
        if: failure()
        run: |
          echo ""
          echo "=================================================="
          echo "BUILD FAILED"
          echo "=================================================="

          echo ""
          echo "========== ERROR / FAILURE LINES =========="
          grep -i -E \
            "error|failed|exception|traceback|fatal|command failed|opencv|numpy" \
            build.log | tail -200 || true

          echo ""
          echo "========== LAST 250 LOG LINES =========="
          tail -250 build.log


      # --------------------------------------------------
      # 10. Upload complete build log
      # --------------------------------------------------
      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name:
