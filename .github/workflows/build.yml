name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build DHK OMR Pro APK
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"


      - name: Install System Packages
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            ccache


      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel
          python -m pip install "buildozer==1.5.0" "cython<3.0"


      - name: Check Environment
        run: |
          echo "Python:"
          python --version

          echo "Java:"
          java -version

          echo "Buildozer:"
          buildozer --version

          echo "Cython:"
          cython --version


      - name: Clean Previous Build
        run: |
          rm -rf .buildozer
          rm -rf bin
          touch build.log


      - name: Build APK
        id: build_apk
        continue-on-error: true
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log


      - name: Show Build Error
        if: steps.build_apk.outcome == 'failure'
        run: |
          echo ""
          echo "=============================================="
          echo "BUILD FAILED"
          echo "=============================================="

          echo ""
          echo "========== IMPORTANT ERRORS =========="

          grep -i -E \
            "error|failed|exception|traceback|fatal|command failed|opencv|numpy" \
            build.log | tail -200 || true

          echo ""
          echo "========== LAST 250 LINES =========="

          tail -250 build.log


      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DHK-OMR-Pro-Build-Log
          path: ./build.log
          if-no-files-found: warn


      - name: Check APK
        if: steps.build_apk.outcome == 'success'
        run: |
          echo "APK files:"
          ls -lah bin/


      - name: Upload APK
        if: steps.build_apk.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: DHK-OMR-Pro-APK
          path: ./bin/*.apk
          if-no-files-found: error


      - name: Fail Workflow If Build Failed
        if: steps.build_apk.outcome == 'failure'
        run: |
          echo "Buildozer failed."
          exit 1
