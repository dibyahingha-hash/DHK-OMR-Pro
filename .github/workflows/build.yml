name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip autoconf automake libtool libtool-bin \
            pkg-config zlib1g-dev libncurses-dev libtinfo6 \
            cmake libffi-dev libssl-dev build-essential ccache

      - name: Install Buildozer and Packaging Tools
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade "Cython<3.0" buildozer virtualenv

      - name: Build APK with Buildozer
        env:
          ACLOCAL_PATH: /usr/share/aclocal
        run: |
          yes | buildozer -v android debug

      - name: Upload Output APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DHK-OMR-Pro-Debug-APK
          path: bin/*.apk
          retention-days: 7
