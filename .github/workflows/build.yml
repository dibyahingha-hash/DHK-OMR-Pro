name: Build Android APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # --------------------------------------------------
      # 1. Checkout source code
      # --------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4


      # --------------------------------------------------
      # 2. Set up host Python
      # --------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      # --------------------------------------------------
      # 3. Set up Java
      # --------------------------------------------------
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"


      # --------------------------------------------------
      # 4. Install system dependencies
      # --------------------------------------------------
      - name: Install System Packages
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            ccache


      # --------------------------------------------------
      # 5. Install Buildozer and Cython
      # --------------------------------------------------
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            "buildozer==1.5.0" \
            "cython<3.0"


      # --------------------------------------------------
      # 6. Check environment
      # --------------------------------------------------
      - name: Check Environment
        run: |
          echo "=============================="
          echo "PYTHON"
          echo "=============================="
          python --version

          echo ""
          echo "=============================="
          echo "JAVA"
          echo "=============================="
          java -version

          echo ""
          echo "=============================="
          echo "BUILDOZER"
          echo "=============================="
          buildozer --version

          echo ""
          echo "=============================="
          echo "CYTHON"
          echo "=============================="
          cython --version

          echo ""
          echo "=============================="
          echo "BUILDOZER SPEC"
          echo "=============================="
          cat buildozer.spec


      # --------------------------------------------------
      # 7. Clean previous build files
      # --------------------------------------------------
      - name: Clean Build
        run: |
          rm -rf .buildozer
          rm -rf bin

          echo "Old build files removed."


      # --------------------------------------------------
      # 8. Build APK
      # --------------------------------------------------
      - name: Build APK
        run: |
          set -o pipefail

          echo "=============================================="
          echo "STARTING BUILDOZER BUILD"
          echo "=============================================="

          buildozer -v android debug 2>&1 | tee build.log

          BUILD_EXIT=${PIPESTATUS[0]}

          echo ""
          echo "=============================================="
          echo "BUILD EXIT CODE: $BUILD_EXIT"
          echo "=============================================="


          echo ""
          echo "=============================================="
          echo "IMPORTANT BUILD INFORMATION"
          echo "=============================================="

          grep -n -E \
            "requirements=|python3|cpython-|numpy|opencv|ANDROIDAPI|ANDROIDNDK|ANDROIDMINAPI" \
            build.log | tail -100 || true


          echo ""
          echo "=============================================="
          echo "ERRORS / FAILURES"
          echo "=============================================="

          grep -n -i -E \
            "error|failed|exception|traceback|fatal|command failed" \
            build.log | tail -100 || true


          echo ""
          echo "=============================================="
          echo "LAST 300 LINES"
          echo "=============================================="

          tail -300 build.log


          exit $BUILD_EXIT


      # --------------------------------------------------
      # 9. Upload build log even if build fails
      # --------------------------------------------------
      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DHK-OMR-Pro-Build-Log
          path: build.log
          if-no-files-found: warn


      # --------------------------------------------------
      # 10. Upload APK if build succeeds
      # --------------------------------------------------
      - name: Upload APK
        if: success()
       
