name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Disk Space on Runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk/27* || true
          sudo rm -rf /usr/local/lib/android/sdk/ndk/29* || true
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo docker system prune --all --force || true
          df -h

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Build Headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip autoconf automake libtool libtool-bin \
            pkg-config zlib1g-dev libncurses-dev libtinfo6 \
            cmake libffi-dev libssl-dev build-essential ccache \
            libjpeg-dev libpng-dev

      - name: Install Buildozer and Toolchain
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade "Cython<3.0" buildozer virtualenv

      - name: Build APK with Buildozer
        env:
          ACLOCAL_PATH: /usr/share/aclocal
          ANDROID_NDK_HOME: ""
          ANDROID_NDK_LATEST_HOME: ""
          PIP_NO_BINARY: ""
        run: |
          unset PIP_NO_BINARY || true
          export PIP_NO_BINARY=""
          rm -rf ~/.buildozer/android/platform/build-* || true
          yes | buildozer -v android debug

      - name: Upload Output APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DHK-OMR-Pro-Debug-APK
          path: bin/*.apk
          retention-days: 7
