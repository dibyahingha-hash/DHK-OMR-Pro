<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DHK OMR Pro • Roster</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --bg: #121721; --card: #1e2635; --header: #1a2230;
      --blue: #296bb2; --green: #2e8556; --red: #c53030;
      --text: #f0f4f8; --sub: #a0aec0; --border: #2d3748;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 30px; }

    /* Top Navigation Bar */
    header { background: var(--header); padding: 12px 14px; border-bottom: 1px solid var(--border); }
    .app-name { font-size: 16px; font-weight: bold; margin-bottom: 10px; display: flex; justify-content: space-between; }
    .nav-links { display: flex; gap: 6px; overflow-x: auto; }
    .nav-btn {
      flex: 1; text-align: center; padding: 8px 10px; border-radius: 6px;
      font-size: 12px; font-weight: bold; text-decoration: none;
      background: var(--card); color: var(--sub); border: 1px solid var(--border); white-space: nowrap;
    }
    .nav-btn.active { background: var(--blue); color: #fff; border-color: var(--blue); }

    /* Main Container */
    .container { padding: 14px; max-width: 600px; margin: 0 auto; }
    .btn {
      width: 100%; padding: 12px; border-radius: 8px; border: none;
      font-weight: bold; font-size: 14px; color: #fff; cursor: pointer; margin-bottom: 8px;
    }
    .btn-green { background: var(--green); }
    .btn-red { background: var(--red); }

    /* Filters */
    .filter-bar { display: flex; overflow-x: auto; gap: 6px; margin: 12px 0; padding-bottom: 4px; }
    .filter-chip {
      background: var(--card); border: 1px solid var(--border); color: var(--sub);
      padding: 6px 14px; border-radius: 20px; font-size: 12px; white-space: nowrap; cursor: pointer;
    }
    .filter-chip.active { background: var(--blue); color: #fff; border-color: var(--blue); }

    /* Student Cards */
    .student-card {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px; background: var(--card); border-radius: 8px; margin-bottom: 8px;
      border: 1px solid var(--border);
    }
    .student-info h4 { font-size: 14px; margin-bottom: 3px; }
    .student-info p { font-size: 11px; color: var(--sub); }
    .student-actions { display: flex; align-items: center; gap: 8px; }
    .badge { font-size: 11px; font-weight: bold; padding: 3px 8px; border-radius: 4px; }
    .badge-pending { background: #4a5568; color: #cbd5e0; }
    .badge-done { background: #276749; color: #9ae6b4; }
    .btn-del {
      background: transparent; border: 1px solid var(--border); color: #fc8181;
      width: 28px; height: 28px; border-radius: 4px; font-weight: bold; cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div class="app-name">
      <span>DHK OMR Pro</span>
      <span style="font-size: 12px; color: #68d391;">Roster Page</span>
    </div>
    <div class="nav-links">
      <a href="index.html" class="nav-btn active">👥 Roster</a>
      <a href="exam.html" class="nav-btn">📝 Exam & Key</a>
      <a href="scan.html" class="nav-btn">📷 Scanner</a>
      <a href="grade.html" class="nav-btn">🏆 Grade Card</a>
    </div>
  </header>

  <div class="container">
    <input type="file" id="fileInput" accept=".xlsx,.xls" style="display: none;" onchange="handleFileUpload(event)">
    
    <div style="display: flex; gap: 8px;">
      <button class="btn btn-green" onclick="document.getElementById('fileInput').click()">Upload Shiksha Setu (.xlsx)</button>
      <button class="btn btn-red" style="width: 130px;" onclick="confirmDeleteRoster()">Clear List</button>
    </div>

    <div class="filter-bar" id="filterBar">
      <div class="filter-chip active" onclick="setFilter('All')">All Classes</div>
    </div>

    <div style="font-size: 12px; color: var(--sub); margin-bottom: 10px;" id="rosterSummary">Total: 0 Students</div>
    <div id="studentContainer"></div>
  </div>

  <script>
    let students = JSON.parse(localStorage.getItem('dhk_students') || '[]');
    let currentFilter = 'All';

    function handleFileUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        try {
          const data = new Uint8Array(evt.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const worksheet = workbook.Sheets[workbook.SheetNames[0]];
          const rawSheetData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
          
          let headerIdx = 0;
          for (let i = 0; i < Math.min(10, rawSheetData.length); i++) {
            const rowStr = (rawSheetData[i] || []).join(' ').toLowerCase();
            if (rowStr.includes('uniqueid') || (rowStr.includes('student') && rowStr.includes('name'))) {
              headerIdx = i;
              break;
            }
          }

          const rows = XLSX.utils.sheet_to_json(worksheet, { range: headerIdx, defval: '' });
          function findField(row, targets) {
            const keys = Object.keys(row);
            for (let t of targets) {
              const cleanTarget = t.toLowerCase().replace(/[^a-z0-9]/g, '');
              const foundKey = keys.find(k => k.toLowerCase().replace(/[^a-z0-9]/g, '') === cleanTarget);
              if (foundKey && String(row[foundKey]).trim() !== '') return String(row[foundKey]).trim();
            }
            return '';
          }

          const parsedStudents = [];
          rows.forEach((row, idx) => {
            const name = findField(row, ['Student Name', 'student_name', 'StudentName', 'Name']);
            const classAndSec = findField(row, ['Class & Section', 'Class', 'student_class', 'Grade']) || 'Class-V';
            const uid = findField(row, ['Student UniqueId', 'Student ID', 'student_id', 'UID']) || String(100000 + idx);

            if (name && name.toLowerCase() !== 'student name') {
              let classLvl = classAndSec;
              let sec = 'A';
              if (classAndSec.includes('Section')) {
                const parts = classAndSec.split(/Section/i);
                classLvl = parts[0].trim();
                sec = parts[1].trim() || 'A';
              }
              parsedStudents.push({
                unique_id: uid, name: name, class_level: classLvl, section: sec,
                evaluated: false, score: 0, mcq_marks: 0, subj_marks: 0
              });
            }
          });

          students = parsedStudents;
          localStorage.setItem('dhk_students', JSON.stringify(students));
          currentFilter = 'All';
          updateClassFilters();
          renderRoster();
          alert(`Successfully loaded ${students.length} students across all classes!`);
        } catch (err) {
          alert("Error: " + err.message);
        } finally {
          e.target.value = '';
        }
      };
      reader.readAsArrayBuffer(file);
    }

    function updateClassFilters() {
      const classes = [...new Set(students.map(s => s.class_level))].sort();
      const bar = document.getElementById('filterBar');
      bar.innerHTML = `<div class="filter-chip ${currentFilter === 'All' ? 'active' : ''}" onclick="setFilter('All')">All Classes</div>`;
      classes.forEach(c => {
        bar.innerHTML += `<div class="filter-chip ${currentFilter === c ? 'active' : ''}" onclick="setFilter('${c}')">${c}</div>`;
      });
    }

    function setFilter(cls) {
      currentFilter = cls;
      updateClassFilters();
      renderRoster();
    }

    function renderRoster() {
      const list = document.getElementById('studentContainer');
      const filtered = currentFilter === 'All' ? students : students.filter(s => s.class_level === currentFilter);
      document.getElementById('rosterSummary').innerText = `Total: ${filtered.length} Students`;
      list.innerHTML = '';

      if (filtered.length === 0) {
        list.innerHTML = `<div style="text-align: center; color: var(--sub); margin-top: 30px; font-size: 13px;">No students found.<br>Upload a Shiksha Setu file to begin.</div>`;
        return;
      }

      filtered.forEach(s => {
        list.innerHTML += `
          <div class="student-card">
            <div class="student-info">
              <h4>${s.name}</h4>
              <p>${s.class_level} (Sec ${s.section}) | UID: ${s.unique_id}</p>
            </div>
            <div class="student-actions">
              <span class="badge ${s.evaluated ? 'badge-done' : 'badge-pending'}">
                ${s.evaluated ? s.score + '%' : 'Pending'}
              </span>
              <button class="btn-del" title="Delete Student" onclick="deleteStudent('${s.unique_id}')">✕</button>
            </div>
          </div>
        `;
      });
    }

    function deleteStudent(uid) {
      const target = students.find(s => s.unique_id === uid);
      if (target && confirm(`Remove "${target.name}"?`)) {
        students = students.filter(s => s.unique_id !== uid);
        localStorage.setItem('dhk_students', JSON.stringify(students));
        updateClassFilters();
        renderRoster();
      }
    }

    function confirmDeleteRoster() {
      if (students.length === 0) return alert('List is empty.');
      const msg = currentFilter === 'All' ? 'Delete all students from roster?' : `Delete all students in ${currentFilter}?`;
      if (confirm(msg)) {
        students = currentFilter === 'All' ? [] : students.filter(s => s.class_level !== currentFilter);
        localStorage.setItem('dhk_students', JSON.stringify(students));
        updateClassFilters();
        renderRoster();
      }
    }

    updateClassFilters();
    renderRoster();
  </script>
</body>
</html>
