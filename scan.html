<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DHK OMR Pro - Precision Scanner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .scan-guide {
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.6);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans select-none overflow-hidden">

  <!-- TOP HEADER / CONTROL STRIP -->
  <header class="bg-slate-900 border-b border-slate-800 p-2.5 z-20 shadow-lg">
    <div class="flex items-center justify-between gap-2 max-w-lg mx-auto">
      <div class="flex items-center gap-2">
        <a href="index.html" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300">
          <i data-lucide="arrow-left" class="w-4 h-4"></i>
        </a>
        <div>
          <h1 class="text-xs font-bold text-white tracking-wider uppercase">DHK OMR Precision</h1>
          <div id="sessionStatus" class="text-[11px] text-amber-400 font-medium flex items-center gap-1">
            <i data-lucide="unlock" class="w-3 h-3"></i> <span>Class Not Locked</span>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-1.5">
        <button id="lockToggleBtn" onclick="toggleLock()" class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold flex items-center gap-1 border border-slate-700">
          <i data-lucide="lock" class="w-3.5 h-3.5" id="lockIcon"></i>
          <span id="lockBtnText">Lock</span>
        </button>
        <button id="torchBtn" onclick="toggleTorch()" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700">
          <i data-lucide="zap-off" id="torchIcon" class="w-4 h-4"></i>
        </button>
        <label class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 cursor-pointer">
          <i data-lucide="image" class="w-4 h-4"></i>
          <input type="file" id="fileUpload" accept="image/*" class="hidden" onchange="handleFileUpload(event)" />
        </label>
      </div>
    </div>

    <!-- DUAL CONTROLS STRIP (PHYSICALLY DISABLED WHEN LOCKED) -->
    <div class="grid grid-cols-2 gap-2 mt-2 max-w-lg mx-auto pt-2 border-t border-slate-800 text-xs">
      <div>
        <label class="block text-slate-400 font-semibold mb-1 text-[10px] uppercase">Format</label>
        <select id="sheetFormat" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-1.5 text-white focus:outline-none disabled:opacity-50 disabled:bg-slate-900">
          <option value="gunotsav">Gunotsav (43 Dashes)</option>
          <option value="universal">Universal DHK (34 Dashes)</option>
        </select>
      </div>
      <div>
        <label class="block text-slate-400 font-semibold mb-1 text-[10px] uppercase">Target Class</label>
        <select id="lockedClass" onchange="onClassSelected(this.value)" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-1.5 text-white focus:outline-none disabled:opacity-50 disabled:bg-slate-900 font-bold">
          <option value="">-- Choose Class --</option>
          <option value="I">Class I</option>
          <option value="II">Class II</option>
          <option value="III">Class III</option>
          <option value="IV">Class IV</option>
          <option value="V">Class V</option>
          <option value="IX">Class IX</option>
          <option value="X">Class X</option>
        </select>
      </div>
    </div>
  </header>

  <!-- 90% ATTENDANCE COMPLETION ALERT -->
  <div id="attendanceAlert" class="hidden bg-emerald-600 text-white text-xs px-3 py-1.5 flex items-center justify-between z-20">
    <div class="flex items-center gap-1.5 font-medium">
      <i data-lucide="check-circle" class="w-4 h-4"></i>
      <span id="attendanceMsg">90% Done! 1 student left.</span>
    </div>
    <button onclick="toggleUnscannedList()" class="underline font-bold text-emerald-100 text-[11px]">View Missing</button>
  </div>

  <!-- VIEWFINDER CANVAS & CAMERA -->
  <main class="relative flex-1 bg-black flex items-center justify-center overflow-hidden">
    <video id="videoFeed" playsinline autoplay muted class="absolute inset-0 w-full h-full object-cover"></video>
    <canvas id="procCanvas" class="hidden"></canvas>

    <!-- Clean, Non-Intrusive Viewfinder Guide -->
    <div class="relative z-10 w-[86%] h-[82%] border-2 border-indigo-500/70 rounded-xl scan-guide pointer-events-none flex flex-col justify-between p-3">
      <div class="flex justify-between items-center text-[10px] font-mono text-indigo-300 bg-slate-950/70 px-2 py-1 rounded">
        <span>LEFT TIMING RAIL ──►</span>
        <span id="activeModeLabel" class="text-amber-300 font-bold">GUNOTSAV 43-DASH</span>
      </div>
      <div class="w-full border-b border-dashed border-red-500/70 text-right pr-1">
        <span class="text-[9px] text-red-300 bg-slate-950/70 px-1.5 py-0.5 rounded">PIECE #17: NAME ROW</span>
      </div>
      <div class="text-[10px] text-center text-slate-300 bg-slate-950/70 py-1 rounded">
        Align Left Timing Dashes to the Red Marker Line
      </div>
    </div>
  </main>

  <!-- CAPTURE ACTION -->
  <footer class="bg-slate-900 border-t border-slate-800 p-3.5 z-20">
    <div class="max-w-lg mx-auto flex justify-center">
      <button onclick="triggerScan()" id="scanActionBtn" class="w-full flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-500 active:scale-98 text-white font-bold py-3 rounded-xl shadow-lg transition">
        <i data-lucide="scan-line" class="w-5 h-5"></i>
        <span>Scan Sheet</span>
      </button>
    </div>
  </footer>

  <!-- CLEAN VERIFICATION MODAL -->
  <div id="evalModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-3">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-2xl p-4 shadow-2xl space-y-3.5">
      <div class="flex justify-between items-center border-b border-slate-800 pb-2.5">
        <div>
          <span class="text-[10px] uppercase font-bold tracking-wider text-slate-400">Evaluation Result</span>
          <div id="modalClassBadge" class="text-xs font-bold text-indigo-400">Class III</div>
        </div>
        <div id="scoreBadge" class="bg-emerald-600 text-white font-mono px-3 py-1 rounded-lg text-sm font-black">
          Score: --/--
        </div>
      </div>

      <!-- Student Picker -->
      <div>
        <label class="block text-slate-400 text-[10px] uppercase font-semibold mb-1">Identified Student</label>
        <select id="resStudentSelect" class="w-full bg-slate-950 border border-slate-700 rounded-lg p-2 text-white font-bold text-sm focus:outline-none focus:border-indigo-500">
          <!-- Populated dynamically -->
        </select>
      </div>

      <!-- Metric Badges -->
      <div class="grid grid-cols-3 gap-2 bg-slate-950 p-2.5 rounded-xl text-center text-xs font-mono border border-slate-800/80">
        <div>
          <span class="text-slate-500 text-[10px] uppercase block">Attempted</span>
          <span id="resAttempted" class="text-emerald-400 font-bold text-sm">0</span>
        </div>
        <div>
          <span class="text-slate-500 text-[10px] uppercase block">Blank</span>
          <span id="resBlank" class="text-amber-400 font-bold text-sm">0</span>
        </div>
        <div>
          <span class="text-slate-500 text-[10px] uppercase block">Multi</span>
          <span id="resMulti" class="text-rose-400 font-bold text-sm">0</span>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex gap-2 pt-1">
        <button onclick="saveAndNext()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-bold py-2.5 rounded-xl transition text-sm">
          Save Result
        </button>
        <button onclick="closeModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 active:scale-95 text-slate-300 font-bold py-2.5 rounded-xl transition text-sm">
          Retake
        </button>
      </div>
    </div>
  </div>

  <!-- UNSCANNED STUDENTS DRAWER -->
  <div id="unscannedDrawer" class="hidden fixed inset-0 z-50 bg-black/80 flex items-end justify-center">
    <div class="bg-slate-900 border-t border-slate-800 w-full max-w-lg rounded-t-2xl p-4 space-y-3 max-h-[75vh] flex flex-col">
      <div class="flex justify-between items-center border-b border-slate-800 pb-2">
        <h3 class="font-bold text-white text-xs uppercase tracking-wider">Missing Students in Class</h3>
        <button onclick="toggleUnscannedList()" class="p-1 text-slate-400 hover:text-white"><i data-lucide="x" class="w-4 h-4"></i></button>
      </div>
      <div id="unscannedContainer" class="flex-1 overflow-y-auto space-y-1.5 text-xs"></div>
    </div>
  </div>

  <script>
    let videoStream = null;
    let videoTrack = null;
    let torchActive = false;
    let isUiLocked = false;
    let masterKey = {};
    let classRoster = [];
    let scannedRecords = [];
    let currentEvaluation = null;

    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      initCamera();
      loadStoredData();
    });

    // 1. Camera & Persistent Flashlight
    async function initCamera() {
      try {
        videoStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }
        });
        const video = document.getElementById('videoFeed');
        video.srcObject = videoStream;
        videoTrack = videoStream.getVideoTracks()[0];
      } catch (err) {
        alert("Camera initialization failed: " + err.message);
      }
    }

    async function toggleTorch() {
      if (!videoTrack) return;
      const caps = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
      if (!caps.torch) {
        alert("Torch is not supported on this device/camera.");
        return;
      }
      try {
        torchActive = !torchActive;
        await videoTrack.applyConstraints({ advanced: [{ torch: torchActive }] });
        const icon = document.getElementById('torchIcon');
        const btn = document.getElementById('torchBtn');
        if (torchActive) {
          icon.setAttribute('data-lucide', 'zap');
          btn.classList.add('bg-amber-500', 'text-slate-950', 'border-amber-400');
        } else {
          icon.setAttribute('data-lucide', 'zap-off');
          btn.classList.remove('bg-amber-500', 'text-slate-950', 'border-amber-400');
        }
        lucide.createIcons();
      } catch (e) {
        console.error("Torch error:", e);
      }
    }

    // 2. Storage & Strict UI Locking
    function loadStoredData() {
      const roster = localStorage.getItem('dhk_roster');
      if (roster) classRoster = JSON.parse(roster);

      const key = localStorage.getItem('dhk_master_key');
      if (key) masterKey = JSON.parse(key);

      const scores = localStorage.getItem('dhk_scanned_scores');
      if (scores) scannedRecords = JSON.parse(scores);

      const lockedClass = localStorage.getItem('dhk_locked_class');
      if (lockedClass) {
        document.getElementById('lockedClass').value = lockedClass;
        setLockState(true);
      }
    }

    function onClassSelected(val) {
      if (!val) return;
      localStorage.setItem('dhk_locked_class', val);
      setLockState(true);
    }

    function toggleLock() {
      const curClass = document.getElementById('lockedClass').value;
      if (!curClass && !isUiLocked) {
        alert("Please pick a Class to lock first.");
        return;
      }
      setLockState(!isUiLocked);
    }

    function setLockState(locked) {
      isUiLocked = locked;
      const selClass = document.getElementById('lockedClass');
      const selFormat = document.getElementById('sheetFormat');
      const lockBtnText = document.getElementById('lockBtnText');
      const lockIcon = document.getElementById('lockIcon');
      const statusBadge = document.getElementById('sessionStatus');

      selClass.disabled = locked;
      selFormat.disabled = locked;

      if (locked) {
        lockBtnText.innerText = "Unlock";
        lockIcon.setAttribute('data-lucide', 'unlock');
        statusBadge.innerHTML = `<i data-lucide="lock" class="w-3 h-3 text-emerald-400"></i> <span class="text-emerald-400">Class ${selClass.value} [Locked]</span>`;
      } else {
        lockBtnText.innerText = "Lock";
        lockIcon.setAttribute('data-lucide', 'lock');
        statusBadge.innerHTML = `<i data-lucide="unlock" class="w-3 h-3 text-amber-400"></i> <span class="text-amber-400">Class Not Locked</span>`;
      }
      lucide.createIcons();
      updateAttendanceAlert();
    }

    function updateAttendanceAlert() {
      const targetClass = document.getElementById('lockedClass').value;
      if (!targetClass) return;

      const targetStudents = classRoster.filter(s => s.class === targetClass);
      if (targetStudents.length === 0) return;

      const scannedInClass = scannedRecords.filter(r => r.class === targetClass);
      const ratio = scannedInClass.length / targetStudents.length;

      const alertBar = document.getElementById('attendanceAlert');
      if (ratio >= 0.90 && scannedInClass.length < targetStudents.length) {
        const remaining = targetStudents.length - scannedInClass.length;
        document.getElementById('attendanceMsg').innerText = `${Math.round(ratio * 100)}% Complete! ${remaining} student(s) left.`;
        alertBar.classList.remove('hidden');
      } else {
        alertBar.classList.add('hidden');
      }
    }

    // 3. Robust Left-Margin Dash Sweep
    function locateTimingDashes(ctx, width, height) {
      const startX = Math.floor(width * 0.015);
      const endX = Math.floor(width * 0.08);
      const imgData = ctx.getImageData(startX, 0, endX - startX, height);
      const d = imgData.data;
      const rowDarkness = new Array(height).fill(0);

      for (let y = 0; y < height; y++) {
        let darkCount = 0;
        for (let x = 0; x < (endX - startX); x++) {
          const idx = (y * (endX - startX) + x) * 4;
          const gray = 0.299 * d[idx] + 0.587 * d[idx + 1] + 0.114 * d[idx + 2];
          if (gray < 90) darkCount++;
        }
        rowDarkness[y] = darkCount;
      }

      const dashes = [];
      let inDash = false;
      let startY = 0;
      const minThreshold = (endX - startX) * 0.35;

      for (let y = 0; y < height; y++) {
        if (rowDarkness[y] > minThreshold && !inDash) {
          inDash = true;
          startY = y;
        } else if (rowDarkness[y] <= minThreshold && inDash) {
          inDash = false;
          const dashH = y - startY;
          if (dashH > 3 && dashH < (height * 0.04)) {
            dashes.push({ center: Math.floor((startY + y) / 2), height: dashH });
          }
        }
      }
      return dashes;
    }

    // 4. Scanning & File Upload Pipeline
    async function triggerScan() {
      const locked = document.getElementById('lockedClass').value;
      if (!locked) {
        alert("Please select and lock the target Class first.");
        return;
      }

      const video = document.getElementById('videoFeed');
      const canvas = document.getElementById('procCanvas');
      canvas.width = video.videoWidth || 1280;
      canvas.height = video.videoHeight || 720;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      await processSheet(canvas);
    }

    async function handleFileUpload(evt) {
      const file = evt.target.files[0];
      if (!file) return;
      const img = new Image();
      img.onload = async () => {
        const canvas = document.getElementById('procCanvas');
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        await processSheet(canvas);
      };
      img.src = URL.createObjectURL(file);
    }

    async function processSheet(canvas) {
      const btn = document.getElementById('scanActionBtn');
      btn.disabled = true;
      btn.classList.add('opacity-50');

      const ctx = canvas.getContext('2d');
      const w = canvas.width;
      const h = canvas.height;
      const dashes = locateTimingDashes(ctx, w, h);
      const mode = document.getElementById('sheetFormat').value;

      try {
        if (mode === 'gunotsav') {
          await evaluateGunotsav(ctx, w, h, dashes);
        } else {
          await evaluateUniversal(ctx, w, h, dashes);
        }
      } catch (e) {
        console.error("Evaluation failure:", e);
        alert("Scan read failed. Please adjust alignment and retake.");
      } finally {
        btn.disabled = false;
        btn.classList.remove('opacity-50');
      }
    }

    // 5. Gunotsav Engine: Piece #17 & Pieces #24-43
    async function evaluateGunotsav(ctx, w, h, dashes) {
      let nameBoxY, nameBoxH;

      // Lock vertically strictly to Piece #17
      if (dashes && dashes.length >= 17) {
        nameBoxY = dashes[16].center - Math.floor(dashes[16].height * 1.1);
        nameBoxH = Math.floor(dashes[16].height * 2.2);
      } else {
        nameBoxY = Math.floor(h * 0.33);
        nameBoxH = Math.floor(h * 0.035);
      }

      // Crop exclusively the name value box (X = 35% to 78%) - avoids "STUDENT NAME :-" text
      const nameBoxX = Math.floor(w * 0.35);
      const nameBoxW = Math.floor(w * 0.43);

      const nameCanvas = document.createElement('canvas');
      nameCanvas.width = nameBoxW;
      nameCanvas.height = nameBoxH;
      const nCtx = nameCanvas.getContext('2d');
      nCtx.drawImage(ctx.canvas, nameBoxX, nameBoxY, nameBoxW, nameBoxH, 0, 0, nameBoxW, nameBoxH);

      // Contrast Binarization
      const nData = nCtx.getImageData(0, 0, nameBoxW, nameBoxH);
      const d = nData.data;
      for (let i = 0; i < d.length; i += 4) {
        const v = (d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114) > 130 ? 255 : 0;
        d[i] = d[i + 1] = d[i + 2] = v;
      }
      nCtx.putImageData(nData, 0, 0);

      let recognizedName = "";
      try {
        const ocrRes = await Tesseract.recognize(nameCanvas, 'eng', {
          tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ '
        });
        recognizedName = ocrRes.data.text.trim().replace(/[^A-Z\s]/g, "");
      } catch (e) {
        console.warn("Name OCR error:", e);
      }

      // MCQ Evaluation: Dashes #24 to #43
      const answers = {};
      const colStarts = [0.09, 0.32, 0.54, 0.76];
      const bubbleSpacing = 0.035;

      const rowYList = [];
      if (dashes && dashes.length >= 43) {
        for (let i = 23; i < dashes.length; i++) rowYList.push(dashes[i].center);
      } else {
        const step = (h * 0.395) / 20;
        for (let i = 0; i < 20; i++) rowYList.push((h * 0.525) + (i * step));
      }

      const maxQ = Object.keys(masterKey).length > 0 ? Object.keys(masterKey).length : 58;

      let qIndex = 1;
      for (let c = 0; c < 4 && qIndex <= maxQ; c++) {
        for (let r = 0; r < rowYList.length && qIndex <= maxQ; r++) {
          const cy = rowYList[r];
          const densities = [];

          // Measure all 4 options
          ['A', 'B', 'C', 'D'].forEach((opt, idx) => {
            const cx = (w * colStarts[c]) + (idx * w * bubbleSpacing);
            densities.push({ opt, density: sampleBubbleDensity(ctx, cx, cy, 6) });
          });

          // Sort by darkness
          densities.sort((a, b) => b.density - a.density);
          const darkest = densities[0];
          const runnerUp = densities[1];
          const baseline = (densities[1].density + densities[2].density + densities[3].density) / 3;

          // Relative Dynamic Contrast Scoring
          if (darkest.density > 0.35 && (darkest.density - baseline) > 0.20) {
            if (runnerUp.density > 0.35 && (darkest.density - runnerUp.density) < 0.12) {
              answers[qIndex] = 'MULTI';
            } else {
              answers[qIndex] = darkest.opt;
            }
          } else {
            answers[qIndex] = 'BLANK';
          }
          qIndex++;
        }
      }

      compileResults(recognizedName, answers, maxQ);
    }

    // 6. Universal Engine: Header Box & Pieces #1-34
    async function evaluateUniversal(ctx, w, h, dashes) {
      const nameCropY = Math.floor(h * 0.165);
      const nameCropH = Math.floor(h * 0.035);

      const nameCanvas = document.createElement('canvas');
      nameCanvas.width = Math.floor(w * 0.44);
      nameCanvas.height = nameCropH;
      const nCtx = nameCanvas.getContext('2d');
      nCtx.drawImage(ctx.canvas, Math.floor(w * 0.07), nameCropY, nameCanvas.width, nameCropH, 0, 0, nameCanvas.width, nameCropH);

      const nData = nCtx.getImageData(0, 0, nameCanvas.width, nameCropH);
      const d = nData.data;
      for (let i = 0; i < d.length; i += 4) {
        const v = (d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114) > 130 ? 255 : 0;
        d[i] = d[i + 1] = d[i + 2] = v;
      }
      nCtx.putImageData(nData, 0, 0);

      let recognizedName = "";
      try {
        const ocrRes = await Tesseract.recognize(nameCanvas, 'eng', {
          tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ '
        });
        recognizedName = ocrRes.data.text.trim().replace(/[^A-Z\s]/g, "");
      } catch (e) {
        console.warn("OCR error:", e);
      }

      const answers = {};
      const colStarts = [0.12, 0.41, 0.70];
      const bubbleSpacing = 0.045;

      const rowYList = [];
      if (dashes && dashes.length >= 34) {
        for (let i = 0; i < 34; i++) rowYList.push(dashes[i].center);
      } else {
        const step = (h * 0.69) / 34;
        for (let i = 0; i < 34; i++) rowYList.push((h * 0.21) + (i * step));
      }

      const maxQ = Object.keys(masterKey).length > 0 ? Object.keys(masterKey).length : 100;

      let qIndex = 1;
      for (let c = 0; c < 3 && qIndex <= maxQ; c++) {
        for (let r = 0; r < rowYList.length && qIndex <= maxQ; r++) {
          const cy = rowYList[r];
          const densities = [];

          ['A', 'B', 'C', 'D'].forEach((opt, idx) => {
            const cx = (w * colStarts[c]) + (idx * w * bubbleSpacing);
            densities.push({ opt, density: sampleBubbleDensity(ctx, cx, cy, 6) });
          });

          densities.sort((a, b) => b.density - a.density);
          const darkest = densities[0];
          const runnerUp = densities[1];
          const baseline = (densities[1].density + densities[2].density + densities[3].density) / 3;

          if (darkest.density > 0.35 && (darkest.density - baseline) > 0.20) {
            if (runnerUp.density > 0.35 && (darkest.density - runnerUp.density) < 0.12) {
              answers[qIndex] = 'MULTI';
            } else {
              answers[qIndex] = darkest.opt;
            }
          } else {
            answers[qIndex] = 'BLANK';
          }
          qIndex++;
        }
      }

      compileResults(recognizedName, answers, maxQ);
    }

    // 7. Safe Density Sampler
    function sampleBubbleDensity(ctx, cx, cy, radius) {
      try {
        const imgData = ctx.getImageData(Math.floor(cx - radius), Math.floor(cy - radius), radius * 2, radius * 2);
        const data = imgData.data;
        let darkPixels = 0;
        let total = 0;

        for (let i = 0; i < data.length; i += 4) {
          const gray = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
          if (gray < 110) darkPixels++;
          total++;
        }
        return total > 0 ? (darkPixels / total) : 0;
      } catch (e) {
        return 0;
      }
    }

    // 8. Result Compilation & Clean UI Drawer
    function compileResults(rawName, answers, totalQuestions) {
      const locked = document.getElementById('lockedClass').value;
      const targetStudents = classRoster.filter(s => s.class === locked);

      let matchedStudent = null;
      let highestSim = 0;

      if (rawName && rawName.length > 2) {
        targetStudents.forEach(s => {
          const sim = stringSimilarity(rawName.toUpperCase(), s.name.toUpperCase());
          if (sim > highestSim) {
            highestSim = sim;
            matchedStudent = s;
          }
        });
      }

      if (highestSim < 0.40) matchedStudent = null;

      let score = 0;
      let attempted = 0;
      let blank = 0;
      let multi = 0;

      for (let q = 1; q <= totalQuestions; q++) {
        const mark = answers[q];
        if (mark === 'BLANK') blank++;
        else if (mark === 'MULTI') multi++;
        else attempted++;

        if (masterKey[q] && masterKey[q] === mark) {
          score++;
        }
      }

      // Populate Clean Dropdown with Sorted Roster
      const selectBox = document.getElementById('resStudentSelect');
      selectBox.innerHTML = '';

      if (!matchedStudent) {
        const defOpt = document.createElement('option');
        defOpt.value = "";
        defOpt.innerText = `⚠️ OCR: "${rawName || 'Unclear'}" - Tap to Pick`;
        selectBox.appendChild(defOpt);
      }

      targetStudents
        .slice()
        .sort((a, b) => a.name.localeCompare(b.name))
        .forEach(s => {
          const opt = document.createElement('option');
          opt.value = s.name;
          opt.innerText = `${s.name} ${s.roll ? '(Roll: ' + s.roll + ')' : ''}`;
          if (matchedStudent && matchedStudent.name === s.name) opt.selected = true;
          selectBox.appendChild(opt);
        });

      currentEvaluation = {
        class: locked,
        score: score,
        total: totalQuestions,
        answers: answers
      };

      document.getElementById('modalClassBadge').innerText = `Class ${locked}`;
      document.getElementById('scoreBadge').innerText = `Score: ${score}/${totalQuestions}`;
      document.getElementById('resAttempted').innerText = attempted;
      document.getElementById('resBlank').innerText = blank;
      document.getElementById('resMulti').innerText = multi;

      document.getElementById('evalModal').classList.remove('hidden');
      if (navigator.vibrate) navigator.vibrate([60, 40, 60]);
    }

    function stringSimilarity(s1, s2) {
      let longer = s1;
      let shorter = s2;
      if (s1.length < s2.length) { longer = s2; shorter = s1; }
      const longerLength = longer.length;
      if (longerLength === 0) return 1.0;
      return (longerLength - editDistance(longer, shorter)) / parseFloat(longerLength);
    }

    function editDistance(s1, s2) {
      s1 = s1.toLowerCase();
      s2 = s2.toLowerCase();
      const costs = [];
      for (let i = 0; i <= s1.length; i++) {
        let lastVal = i;
        for (let j = 0; j <= s2.length; j++) {
          if (i === 0) costs[j] = j;
          else {
            if (j > 0) {
              let newVal = costs[j - 1];
              if (s1.charAt(i - 1) !== s2.charAt(j - 1))
                newVal = Math.min(Math.min(newVal, lastVal), costs[j]) + 1;
              costs[j - 1] = lastVal;
              lastVal = newVal;
            }
          }
        }
        if (i > 0) costs[s2.length] = lastVal;
      }
      return costs[s2.length];
    }

    function saveAndNext() {
      const selectBox = document.getElementById('resStudentSelect');
      const selectedName = selectBox.value;

      if (!selectedName) {
        alert("Please select the student name from the list.");
        return;
      }

      const locked = document.getElementById('lockedClass').value;
      const targetStudent = classRoster.find(s => s.class === locked && s.name === selectedName);

      currentEvaluation.name = selectedName;
      currentEvaluation.roll = targetStudent && targetStudent.roll ? targetStudent.roll : "";

      const existingIdx = scannedRecords.findIndex(r => r.class === locked && r.name === selectedName);
      if (existingIdx !== -1) {
        if (!confirm(`"${selectedName}" has already been scanned. Overwrite existing score?`)) {
          return;
        }
        scannedRecords[existingIdx] = currentEvaluation;
      } else {
        scannedRecords.push(currentEvaluation);
      }

      localStorage.setItem('dhk_scanned_scores', JSON.stringify(scannedRecords));
      closeModal();
      updateAttendanceAlert();
    }

    function closeModal() {
      document.getElementById('evalModal').classList.add('hidden');
      currentEvaluation = null;
    }

    function toggleUnscannedList() {
      const drawer = document.getElementById('unscannedDrawer');
      const container = document.getElementById('unscannedContainer');
      const locked = document.getElementById('lockedClass').value;

      if (drawer.classList.contains('hidden')) {
        const targetStudents = classRoster.filter(s => s.class === locked);
        const scannedNames = new Set(scannedRecords.filter(r => r.class === locked).map(r => r.name));
        const unscanned = targetStudents.filter(s => !scannedNames.has(s.name));

        container.innerHTML = unscanned.map(s => `
          <div class="flex justify-between items-center p-2 rounded-lg bg-slate-950 border border-slate-800">
            <span class="font-bold text-white">${s.name}</span>
            <span class="text-slate-400">${s.roll ? 'Roll: ' + s.roll : ''}</span>
          </div>
        `).join('');

        drawer.classList.remove('hidden');
      } else {
        drawer.classList.add('hidden');
      }
    }
  </script>
