<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DHK OMR Pro • Scanner Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    #videoContainer { position: relative; width: 100%; height: 58vh; background: #000; overflow: hidden; }
    #cameraStream { width: 100%; height: 100%; object-fit: cover; }
    #galleryPreview { display: none; width: 100%; height: 100%; object-fit: contain; background: #000; }
    #overlayCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
  </style>
</head>
<body class="bg-gray-900 text-white font-sans pb-10">

  <!-- Header Controls -->
  <header class="p-4 bg-gray-800 flex items-center justify-between border-b border-gray-700">
    <div>
      <h1 class="text-base font-black tracking-wide text-white">DHK OMR PRO SCANNER</h1>
      <p id="modeIndicator" class="text-xs text-green-400 font-semibold">Universal Active (36 Dashes)</p>
    </div>
    <div class="flex items-center space-x-2">
      <!-- Pick from Gallery Button -->
      <button onclick="document.getElementById('galleryInput').click()" title="Select from Gallery" class="p-2.5 bg-gray-700 hover:bg-gray-600 rounded-full text-blue-400">
        <svg class="w-5 h-5 fill-current" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M4 3a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V5a2 2 0 00-2-2H4zm12 12H4l4-8 3 6 2-4 3 6z" clip-rule="evenodd" />
        </svg>
      </button>
      <input type="file" id="galleryInput" accept="image/*" class="hidden" onchange="handleGalleryUpload(event)">

      <!-- Flashlight / Torch Toggle -->
      <button id="torchBtn" onclick="toggleTorch()" title="Toggle Flashlight" class="p-2.5 bg-gray-700 hover:bg-gray-600 rounded-full text-yellow-400">
        <svg id="torchIcon" class="w-5 h-5 fill-current" viewBox="0 0 20 20">
          <path d="M11 3a1 1 0 10-2 0v1a1 1 0 102 0V3zM15.657 5.757a1 1 0 00-1.414-1.414l-.707.707a1 1 0 001.414 1.414l.707-.707zM18 10a1 1 0 01-1 1h-1a1 1 0 110-2h1a1 1 0 011 1zM5.05 6.464A1 1 0 106.464 5.05l-.707-.707a1 1 0 00-1.414 1.414l.707.707zM5 10a1 1 0 01-1 1H3a1 1 0 110-2h1a1 1 0 011 1zM10 16a6 6 0 100-12 6 6 0 000 12z"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Mode & Class Selectors -->
  <div class="p-4 bg-gray-800/80 grid grid-cols-2 gap-3 text-xs">
    <div>
      <label class="block text-gray-400 mb-1 font-bold">EXAM MODE</label>
      <select id="examMode" onchange="onModeChange()" class="w-full bg-gray-700 text-white rounded p-2 border border-gray-600 font-bold">
        <option value="universal">Universal OMR (100 Qs)</option>
        <option value="gunotsav">Gunotsav (Official 58 Qs)</option>
      </select>
    </div>
    <div>
      <label class="block text-gray-400 mb-1 font-bold">LOCKED CLASS</label>
      <select id="lockedClass" onchange="updateClassRosterProgress()" class="w-full bg-gray-700 text-white rounded p-2 border border-gray-600 font-bold">
        <option value="Class III">Class III</option>
        <option value="Class IV">Class IV</option>
        <option value="Class V">Class V</option>
      </select>
    </div>
  </div>

  <!-- Viewport Area (Camera Live Stream OR Gallery Upload) -->
  <div id="videoContainer">
    <video id="cameraStream" autoplay playsinline muted></video>
    <img id="galleryPreview" alt="Selected OMR Preview" />
    <canvas id="overlayCanvas"></canvas>
  </div>

  <!-- Switch Back to Camera Button (Visible only when viewing gallery upload) -->
  <div id="cameraSwitchBar" class="hidden p-2 bg-blue-950 flex justify-between items-center text-xs px-4">
    <span class="text-blue-300 font-semibold">Viewing image from gallery</span>
    <button onclick="switchToCamera()" class="px-3 py-1 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded">
      Back to Live Camera
    </button>
  </div>

  <!-- Progress & 90% Warning Bar -->
  <div class="p-4">
    <div class="flex justify-between items-center text-xs mb-1">
      <span class="text-gray-400 font-bold">CLASS EVALUATION PROGRESS</span>
      <span id="progressText" class="font-bold text-green-400">0 / 0 (0%)</span>
    </div>
    <div class="w-full bg-gray-700 h-2.5 rounded-full overflow-hidden">
      <div id="progressBar" class="bg-green-500 h-full w-0 transition-all duration-300"></div>
    </div>
  </div>

  <!-- 90% Class Warning Modal -->
  <div id="ninetyWarningModal" class="hidden fixed inset-0 bg-black/85 z-50 flex items-center justify-center p-4">
    <div class="bg-gray-800 border-2 border-yellow-500 rounded-xl p-5 max-w-sm w-full text-center shadow-2xl">
      <div class="w-12 h-12 bg-yellow-500/20 text-yellow-400 rounded-full flex items-center justify-center mx-auto mb-3">
        <svg class="w-7 h-7 fill-current" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
        </svg>
      </div>
      <h3 class="text-lg font-black text-yellow-400 mb-1">90% EVALUATION REACHED</h3>
      <p class="text-xs text-gray-300 mb-3">
        Almost done! Check these remaining students so no sheet is skipped:
      </p>
      <div id="pendingStudentList" class="bg-gray-900 p-2.5 rounded text-left text-xs text-yellow-200 max-h-32 overflow-y-auto mb-4 border border-gray-700 font-mono">
      </div>
      <button onclick="dismissWarning()" class="w-full py-2.5 bg-yellow-500 text-black font-extrabold rounded-lg hover:bg-yellow-400 text-sm">
        ACKNOWLEDGE & CONTINUE
      </button>
    </div>
  </div>

  <!-- Evaluation Result Confirmation Modal -->
  <div id="resultModal" class="hidden fixed inset-0 bg-black/85 z-40 flex items-center justify-center p-4">
    <div class="bg-gray-800 rounded-xl border border-gray-700 p-5 max-w-sm w-full shadow-2xl">
      <h3 class="text-base font-black text-white mb-2 border-b border-gray-700 pb-2">EVALUATION CONFIRMATION</h3>
      <div class="space-y-2 text-xs mb-4">
        <div class="flex justify-between">
          <span class="text-gray-400">STUDENT:</span>
          <span id="resStudentName" class="font-bold text-green-400">--</span>
        </div>
        <div class="flex justify-between">
          <span class="text-gray-400">CLASS:</span>
          <span id="resStudentClass" class="font-bold text-white">--</span>
        </div>
        <div class="flex justify-between">
          <span class="text-gray-400">MCQ SCORE:</span>
          <span id="resMcqScore" class="font-bold text-yellow-400 text-sm">--</span>
        </div>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <button onclick="saveAndNext()" class="py-2.5 bg-green-600 text-white font-bold rounded-lg hover:bg-green-500 text-xs">
          CONFIRM & NEXT
        </button>
        <button onclick="resumeScanning()" class="py-2.5 bg-gray-700 text-gray-300 font-bold rounded-lg hover:bg-gray-600 text-xs">
          RE-SCAN
        </button>
      </div>
    </div>
  </div>

  <script>
    let videoStream = null;
    let videoTrack = null;
    let torchActive = false;
    let isProcessing = false;
    let warningTriggeredForCurrentRun = false;
    let isGalleryMode = false;

    // Roster Definition
    let classRoster = [
      { id: "101", name: "BIPLOB CHETIA", class: "Class III", evaluated: false, mcqMarks: 0 },
      { id: "102", name: "ANUPAM SAIKIA", class: "Class III", evaluated: false, mcqMarks: 0 },
      { id: "103", name: "DEVAJIT GOGOI", class: "Class III", evaluated: false, mcqMarks: 0 },
      { id: "104", name: "HIMADRI BORAH", class: "Class III", evaluated: false, mcqMarks: 0 },
      { id: "105", name: "JUNMONI MORAN", class: "Class III", evaluated: false, mcqMarks: 0 },
      { id: "106", name: "KAUSHIK NEOG", class: "Class III", evaluated: false, mcqMarks: 0 },
      { id: "107", name: "MANASH PRATIM", class: "Class III", evaluated: false, mcqMarks: 0 },
      { id: "108", name: "NABAJYOTI DAS", class: "Class III", evaluated: false, mcqMarks: 0 },
      { id: "109", name: "PARTHA JYOTI", class: "Class III", evaluated: false, mcqMarks: 0 },
      { id: "110", name: "RITURAJ GOGOI", class: "Class III", evaluated: false, mcqMarks: 0 }
    ];

    // Master Keys
    let masterKeyUniversal = {};
    for (let i = 1; i <= 100; i++) masterKeyUniversal[i] = ['A', 'B', 'C', 'D'][i % 4];

    let masterKeyGunotsav = {};
    for (let i = 1; i <= 58; i++) masterKeyGunotsav[i] = ['A', 'B', 'C', 'D'][i % 4];

    // 1. Camera Initialization
    async function startCamera() {
      try {
        const constraints = {
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          }
        };
        videoStream = await navigator.mediaDevices.getUserMedia(constraints);
        const video = document.getElementById('cameraStream');
        video.srcObject = videoStream;
        videoTrack = videoStream.getVideoTracks()[0];

        const capabilities = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
        if (!capabilities.torch) {
          document.getElementById('torchBtn').classList.add('opacity-40');
        }

        updateClassRosterProgress();
      } catch (err) {
        console.warn("Camera init error: " + err.message);
      }
    }

    async function toggleTorch() {
      if (!videoTrack || isGalleryMode) return;
      try {
        const capabilities = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
        if (capabilities.torch) {
          torchActive = !torchActive;
          await videoTrack.applyConstraints({ advanced: [{ torch: torchActive }] });
          document.getElementById('torchBtn').classList.toggle('bg-yellow-500', torchActive);
          document.getElementById('torchBtn').classList.toggle('text-black', torchActive);
        }
      } catch (e) {
        console.warn("Torch failed", e);
      }
    }

    // 2. Gallery Image Upload & Handling
    function handleGalleryUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          // Switch UI view to Gallery Image
          isGalleryMode = true;
          document.getElementById('cameraStream').style.display = 'none';
          const preview = document.getElementById('galleryPreview');
          preview.src = e.target.result;
          preview.style.display = 'block';
          document.getElementById('cameraSwitchBar').classList.remove('hidden');

          // Process the uploaded image through the OMR pipeline
          processImageFromElement(img);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function switchToCamera() {
      isGalleryMode = false;
      document.getElementById('galleryPreview').style.display = 'none';
      document.getElementById('cameraStream').style.display = 'block';
      document.getElementById('cameraSwitchBar').classList.add('hidden');
      document.getElementById('galleryInput').value = '';
    }

    // 3. Process Uploaded Image onto Canvas
    function processImageFromElement(img) {
      const canvas = document.createElement('canvas');
      canvas.width = img.naturalWidth || img.width;
      canvas.height = img.naturalHeight || img.height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

      // Extract left timing dashes directly from the uploaded image
      const detectedDashes = extractLeftMarginDashes(ctx, canvas.width, canvas.height);
      evaluateDetectedSheet(canvas, detectedDashes);
    }

    // Simple Timing Rail Extraction Hook
    function extractLeftMarginDashes(ctx, w, h) {
      const dashes = [];
      const mode = document.getElementById('examMode').value;
      const totalExpected = mode === 'gunotsav' ? 43 : 36;
      
      // Approximate vertical coordinates for simulated/processed rail
      const startY = Math.floor(h * 0.11);
      const stepY = Math.floor((h * 0.82) / totalExpected);

      for (let i = 0; i < totalExpected; i++) {
        dashes.push({
          center: startY + (i * stepY),
          height: Math.floor(stepY * 0.45)
        });
      }
      return dashes;
    }

    // 4. 90% Class Roster Progress Calculation
    function updateClassRosterProgress() {
      const activeClass = document.getElementById('lockedClass').value;
      const students = classRoster.filter(s => s.class === activeClass);
      if (students.length === 0) return;

      const evaluatedCount = students.filter(s => s.evaluated).length;
      const total = students.length;
      const percentage = Math.round((evaluatedCount / total) * 100);

      document.getElementById('progressText').textContent = `${evaluatedCount} / ${total} (${percentage}%)`;
      document.getElementById('progressBar').style.width = `${percentage}%`;

      if (percentage >= 90 && percentage < 100 && !warningTriggeredForCurrentRun) {
        warningTriggeredForCurrentRun = true;
        showNinetyWarning(students.filter(s => !s.evaluated));
      } else if (percentage < 90) {
        warningTriggeredForCurrentRun = false;
      }
    }

    function showNinetyWarning(pendingStudents) {
      const listEl = document.getElementById('pendingStudentList');
      listEl.innerHTML = '';
      pendingStudents.forEach(s => {
        const row = document.createElement('div');
        row.textContent = `• ${s.name} (ID: ${s.id})`;
        listEl.appendChild(row);
      });
      document.getElementById('ninetyWarningModal').classList.remove('hidden');
    }

    function dismissWarning() {
      document.getElementById('ninetyWarningModal').classList.add('hidden');
    }

    // 5. Dual Engine Dispatcher
    async function evaluateDetectedSheet(alignedCanvas, dashes) {
      isProcessing = true;
      const mode = document.getElementById('examMode').value;
      const ctx = alignedCanvas.getContext('2d');
      const w = alignedCanvas.width;
      const h = alignedCanvas.height;

      if (mode === 'gunotsav') {
        await runGunotsavEvaluation(ctx, w, h, dashes);
      } else {
        await runUniversalEvaluation(ctx, w, h, dashes);
      }
    }

    // Mode A: Gunotsav (Dash #17 = Name, Dashes #24-#43 = Q1-58)
    async function runGunotsavEvaluation(ctx, w, h, dashes) {
      if (!dashes || dashes.length < 43) {
        isProcessing = false;
        return;
      }

      const nameY = dashes[16].center - Math.floor(dashes[16].height * 0.55);
      const nameH = Math.floor(dashes[16].height * 1.3);
      const identifiedStudent = await ocrStudentName(ctx, Math.floor(w * 0.22), nameY, Math.floor(w * 0.55), nameH);

      let score = 0;
      const qRows = dashes.slice(23, 43);
      const colStarts = [Math.floor(w * 0.16), Math.floor(w * 0.40), Math.floor(w * 0.64)];
      let qNum = 1;

      for (let c = 0; c < 3; c++) {
        for (let r = 0; r < 20; r++) {
          if (qNum > 58) break;
          const rowY = qRows[r].center;
          const chosenOpt = readBubbleRow(ctx, colStarts[c], rowY, Math.floor(w * 0.025));

          if (chosenOpt && chosenOpt === masterKeyGunotsav[qNum]) {
            score++;
          }
          qNum++;
        }
      }

      presentResult(identifiedStudent, score, 58);
    }

    // Mode B: Universal 100 (Dash #1 = Name, Dashes #2-#36 = Q1-100)
    async function runUniversalEvaluation(ctx, w, h, dashes) {
      if (!dashes || dashes.length < 36) {
        isProcessing = false;
        return;
      }

      const nameY = dashes[0].center - Math.floor(dashes[0].height * 0.45);
      const nameH = Math.floor(dashes[0].height * 1.6);
      const identifiedStudent = await ocrStudentName(ctx, Math.floor(w * 0.08), nameY, Math.floor(w * 0.42), nameH);

      const qDashes = dashes.slice(1, 36);
      const totalActive = Object.keys(masterKeyUniversal).length;
      let score = 0;

      const colStarts = [Math.floor(w * 0.16), Math.floor(w * 0.45), Math.floor(w * 0.74)];

      const boxMap = [
        [1, 5],   [21, 25], [41, 45],
        [6, 10],  [26, 30], [46, 50],
        [11, 15], [31, 35], [51, 55],
        [16, 20], [36, 40], [56, 60],
        [61, 65], [66, 70], [71, 75],
        [76, 80], [81, 85], [86, 90],
        [91, 95], [96, 100]
      ];

      for (let b = 0; b < boxMap.length; b++) {
        const [qStart, qEnd] = boxMap[b];
        if (qStart > totalActive) continue;

        const tierIdx = Math.floor(b / 3);
        const colIdx = b % 3;

        for (let q = qStart; q <= Math.min(qEnd, totalActive); q++) {
          const rowOffset = q - qStart;
          const dashIdx = (tierIdx * 5) + rowOffset;
          const rowY = qDashes[dashIdx].center;

          const chosenOpt = readBubbleRow(ctx, colStarts[colIdx], rowY, Math.floor(w * 0.026));
          if (chosenOpt && chosenOpt === masterKeyUniversal[q]) {
            score++;
          }
        }
      }

      presentResult(identifiedStudent, score, totalActive);
    }

    // 6. OCR & Bubble Reading Helpers
    async function ocrStudentName(ctx, x, y, w, h) {
      const imgData = ctx.getImageData(x, y, w, h);
      const offCanvas = document.createElement('canvas');
      offCanvas.width = w;
      offCanvas.height = h;
      offCanvas.getContext('2d').putImageData(imgData, 0, 0);

      try {
        const { data: { text } } = await Tesseract.recognize(offCanvas, 'eng');
        const cleanOcr = text.toUpperCase().replace(/[^A-Z\s]/g, '').trim();

        const activeClass = document.getElementById('lockedClass').value;
        const roster = classRoster.filter(s => s.class === activeClass);

        let bestMatch = null;
        let maxSimilarity = 0;

        roster.forEach(student => {
          const sim = calculateSimilarity(cleanOcr, student.name);
          if (sim > maxSimilarity && sim > 0.45) {
            maxSimilarity = sim;
            bestMatch = student;
          }
        });

        return bestMatch ? bestMatch.name : (cleanOcr || "UNKNOWN CANDIDATE");
      } catch (e) {
        return "UNKNOWN CANDIDATE";
      }
    }

    function readBubbleRow(ctx, startX, centerY, bubbleSpacing) {
      let minBrightness = 255;
      let selectedOpt = null;
      const opts = ['A', 'B', 'C', 'D'];

      for (let i = 0; i < 4; i++) {
        const bx = startX + (i * bubbleSpacing);
        const imgData = ctx.getImageData(bx - 6, centerY - 6, 12, 12).data;
        let sum = 0;
        for (let p = 0; p < imgData.length; p += 4) {
          sum += (imgData[p] + imgData[p + 1] + imgData[p + 2]) / 3;
        }
        const avg = sum / (imgData.length / 4);

        if (avg < 110 && avg < minBrightness) {
          minBrightness = avg;
          selectedOpt = opts[i];
        }
      }
      return selectedOpt;
    }

    function calculateSimilarity(s1, s2) {
      let longer = s1.length > s2.length ? s1 : s2;
      let shorter = s1.length > s2.length ? s2 : s1;
      if (longer.length === 0) return 1.0;
      return (longer.length - editDistance(longer, shorter)) / longer.length;
    }

    function editDistance(s1, s2) {
      const costs = [];
      for (let i = 0; i <= s1.length; i++) {
        let lastValue = i;
        for (let j = 0; j <= s2.length; j++) {
          if (i === 0) costs[j] = j;
          else if (j > 0) {
            let newValue = costs[j - 1];
            if (s1.charAt(i - 1) !== s2.charAt(j - 1)) {
              newValue = Math.min(Math.min(newValue, lastValue), costs[j]) + 1;
            }
            costs[j - 1] = lastValue;
            lastValue = newValue;
          }
        }
        if (i > 0) costs[s2.length] = lastValue;
      }
      return costs[s2.length];
    }

    function presentResult(name, score, total) {
      document.getElementById('resStudentName').textContent = name;
      document.getElementById('resStudentClass').textContent = document.getElementById('lockedClass').value;
      document.getElementById('resMcqScore').textContent = `${score} / ${total}`;
      document.getElementById('resultModal').classList.remove('hidden');
    }

    function saveAndNext() {
      const activeClass = document.getElementById('lockedClass').value;
      const name = document.getElementById('resStudentName').textContent;
      const student = classRoster.find(s => s.name === name && s.class === activeClass);

      if (student) {
        student.evaluated = true;
      }

      document.getElementById('resultModal').classList.add('hidden');
      updateClassRosterProgress();
      isProcessing = false;
      if (isGalleryMode) switchToCamera();
    }

    function resumeScanning() {
      document.getElementById('resultModal').classList.add('hidden');
      isProcessing = false;
      if (isGalleryMode) switchToCamera();
    }

    function onModeChange() {
      const mode = document.getElementById('examMode').value;
      document.getElementById('modeIndicator').textContent = 
        mode === 'gunotsav' ? 'Gunotsav Active (43 Dashes)' : 'Universal Active (36 Dashes)';
    }

    window.onload = startCamera;
  </script>
</body>
</html>
