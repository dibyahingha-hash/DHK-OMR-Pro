<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DHK OMR Pro • Robust Scanner</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.4/dist/tesseract.min.js"></script>
  <style>
    :root {
      --bg: #121721; --card: #1e2635; --header: #1a2230;
      --blue: #296bb2; --green: #2e8556; --orange: #d9731a; --red: #c53030; --gold: #ecc94b;
      --text: #f0f4f8; --sub: #a0aec0; --border: #2d3748;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 40px; }

    header { background: var(--header); padding: 12px 14px; border-bottom: 1px solid var(--border); }
    .app-name { font-size: 16px; font-weight: bold; margin-bottom: 10px; display: flex; justify-content: space-between; }
    .nav-links { display: flex; gap: 6px; overflow-x: auto; }
    .nav-btn {
      flex: 1; text-align: center; padding: 8px 10px; border-radius: 6px;
      font-size: 12px; font-weight: bold; text-decoration: none;
      background: var(--card); color: var(--sub); border: 1px solid var(--border); white-space: nowrap;
    }
    .nav-btn.active { background: var(--blue); color: #fff; border-color: var(--blue); }

    .container { padding: 14px; max-width: 650px; margin: 0 auto; }
    .card { background: var(--card); border-radius: 8px; padding: 14px; margin-bottom: 14px; border: 1px solid var(--border); }
    .card h3 { font-size: 15px; margin-bottom: 8px; color: var(--gold); }

    .btn {
      width: 100%; padding: 12px; border-radius: 8px; border: none;
      font-weight: bold; font-size: 14px; color: #fff; cursor: pointer; margin-bottom: 8px; text-align: center;
    }
    .btn-green { background: var(--green); }
    .btn-blue { background: var(--blue); }
    .btn-gray { background: #4a5568; }

    .form-group { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .form-group label { font-size: 13px; color: var(--sub); }
    .form-group select, .form-group input {
      width: 220px; padding: 8px 10px; background: #1a2230;
      border: 1px solid var(--border); border-radius: 6px; color: #fff; font-size: 13px;
    }

    .viewfinder-wrapper {
      position: relative; width: 100%; height: 380px; border-radius: 8px; overflow: hidden;
      background: #000; margin-bottom: 12px; border: 2px solid var(--border);
    }
    #cameraStream { width: 100%; height: 100%; object-fit: cover; display: block; }

    .target-overlay {
      position: absolute; top: 2%; left: 3%; width: 94%; height: 96%;
      border: 2px dashed rgba(255, 255, 255, 0.35); border-radius: 6px; pointer-events: none;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.55);
    }
    .corner-bracket { position: absolute; width: 24px; height: 24px; border: 3.5px solid var(--gold); }
    .cb-tl { top: -2px; left: -2px; border-right: none; border-bottom: none; }
    .cb-tr { top: -2px; right: -2px; border-left: none; border-bottom: none; }
    .cb-bl { bottom: -2px; left: -2px; border-right: none; border-top: none; }
    .cb-br { bottom: -2px; right: -2px; border-left: none; border-top: none; }

    /* Progress Overlay */
    .scan-progress-box {
      display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.92); z-index: 10;
      flex-direction: column; align-items: center; justify-content: center; padding: 20px;
    }
    .progress-bar-rail {
      width: 80%; height: 14px; background: #1a2230; border-radius: 10px;
      overflow: hidden; border: 1px solid var(--border); margin: 12px 0 8px 0;
    }
    .progress-bar-fill {
      width: 0%; height: 100%; background: linear-gradient(90deg, #38bdf8, #22c55e);
      transition: width 0.25s ease-out;
    }
    .progress-label { font-size: 13px; font-weight: bold; color: #fff; }
    .progress-sub { font-size: 11px; color: var(--sub); margin-top: 4px; }

    /* Modal Overlay */
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.9); z-index: 1000; padding: 14px;
      align-items: center; justify-content: center;
    }
    .modal-box {
      background: var(--card); border: 1px solid var(--border); border-radius: 8px;
      padding: 16px; width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto;
    }
    .verify-box {
      background: #16202e; border: 1px solid var(--gold); border-radius: 6px;
      padding: 10px; margin-bottom: 12px;
    }
    .score-input {
      width: 70px; padding: 5px; background: var(--bg); border: 1px solid var(--border);
      border-radius: 4px; color: #fff; font-weight: bold; text-align: center; font-size: 14px;
    }
  </style>
</head>
<body>

  <header>
    <div class="app-name">
      <span>DHK OMR Pro</span>
      <span style="font-size: 12px; color: #ed8936;">Scanner</span>
    </div>
    <div class="nav-links">
      <a href="index.html" class="nav-btn">👥 Roster</a>
      <a href="exam.html" class="nav-btn">📝 Exam & Key</a>
      <a href="scan.html" class="nav-btn active">📷 Scanner</a>
      <a href="grade.html" class="nav-btn">🏆 Grade Card</a>
    </div>
  </header>

  <div class="container">
    <div class="card">
      <h3>Assessment Evaluation Setup</h3>
      
      <div class="form-group">
        <label>Exam / Sheet Type:</label>
        <select id="examTrackSelect" onchange="syncClassDropdown()">
          <option value="gunotsav_upper" selected>Gunotsav Sheet (58 Questions)</option>
          <option value="universal_100">Universal Sheet (1 to 100 Questions)</option>
        </select>
      </div>

      <div class="form-group">
        <label>Subject / Assessment Type:</label>
        <div style="display: flex; flex-direction: column; gap: 6px; width: 220px;">
          <select id="subjectPresetSelect" onchange="onSubjectChange()" style="width: 100%;">
            <option value="Gunotsav" selected>Gunotsav (Composite)</option>
            <option value="Language I (Assamese)">Language I (Assamese)</option>
            <option value="Language II (English)">Language II (English)</option>
            <option value="Mathematics">Mathematics</option>
            <option value="Environmental Studies (EVS)">Environmental Studies (EVS)</option>
            <option value="General Science">General Science</option>
            <option value="Social Studies">Social Studies</option>
            <option value="__custom__">✏️ Other (Type Manually)...</option>
          </select>
          <input type="text" id="customSubjectInput" placeholder="Type Subject..." style="display: none; width: 100%;" oninput="onCustomSubjectInput()">
        </div>
      </div>

      <div class="form-group">
        <label>Default / Fallback Class:</label>
        <select id="scanClassSelect"></select>
      </div>

      <div style="font-size: 12px; color: var(--sub); margin-bottom: 10px;" id="scannerConfigNote">
        Active Key: <b>58 Questions</b> | Marks/Q: <b>1</b>
      </div>

      <div class="viewfinder-wrapper">
        <video id="cameraStream" playsinline autoplay muted></video>
        
        <div class="target-overlay">
          <div class="corner-bracket cb-tl"></div>
          <div class="corner-bracket cb-tr"></div>
          <div class="corner-bracket cb-bl"></div>
          <div class="corner-bracket cb-br"></div>
        </div>

        <div class="scan-progress-box" id="scanProgressBox">
          <div class="progress-label" id="progressStatusText">Stabilizing Paper...</div>
          <div class="progress-bar-rail">
            <div class="progress-bar-fill" id="progressBarFill"></div>
          </div>
          <div class="progress-sub" id="progressPercentageText">0% Complete</div>
        </div>
      </div>

      <button class="btn btn-blue" id="btnCapture" onclick="startControlledScan()">📸 Scan Sheet (Slow & Steady)</button>
      <button class="btn btn-green" id="btnToggleCam" onclick="toggleCameraStream()">Start / Restart Camera</button>
      <button class="btn btn-gray" onclick="document.getElementById('galleryInput').click()">Select Photo from Gallery</button>
      <input type="file" id="galleryInput" accept="image/*" style="display: none;" onchange="processGalleryImage(event)">
    </div>

    <canvas id="procCanvas" style="display: none;"></canvas>
    <canvas id="cropCanvas" style="display: none;"></canvas>
  </div>

  <!-- VERIFICATION MODAL -->
  <div class="modal-overlay" id="studentVerifyModal">
    <div class="modal-box">
      <h3 style="font-size: 15px; margin-bottom: 8px; color: var(--gold);">Verify Sheet Details & Score</h3>

      <div class="verify-box">
        <p style="font-size: 11px; color: #a0aec0; margin-bottom: 2px;">Header Detection:</p>
        <div id="rawOcrText" style="color: #ecc94b; font-size: 13px; line-height: 1.4;">Reading...</div>
      </div>

      <div style="margin-bottom: 10px;">
        <label style="font-size: 12px; color: #a0aec0; display: block; margin-bottom: 3px;">Class (Editable):</label>
        <select id="modalClassOverrideSelect" onchange="onModalClassChanged()" style="width: 100%; padding: 8px; background: var(--header); color: #fff; border: 1px solid var(--border); border-radius: 6px; font-weight: bold;"></select>
      </div>

      <div style="margin-bottom: 12px;">
        <label style="font-size: 12px; color: #a0aec0; display: block; margin-bottom: 3px;">Student Roster Match:</label>
        <select id="studentConfirmSelect" style="width: 100%; padding: 10px; background: var(--header); color: #fff; border: 1px solid var(--border); border-radius: 6px; font-weight: bold;"></select>
      </div>

      <div style="background: var(--header); padding: 12px; border-radius: 6px; margin-bottom: 14px;">
        <div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px; margin-bottom: 8px;">
          <span>Detected MCQ Score:</span>
          <div>
            <input type="number" id="modalMcqScoreInput" class="score-input">
            <span id="modalMaxMcqText">/ 58</span>
          </div>
        </div>

        <div style="font-size: 11px; color: #a0aec0;" id="modalBreakdownNote">
          Correct: 0 | Incorrect: 0
        </div>
      </div>

      <button class="btn btn-green" onclick="confirmAndSaveRecord()">Confirm & Save Result</button>
      <button class="btn btn-gray" onclick="closeModal()">Retake Scan</button>
    </div>
  </div>

  <script>
    let students = [];
    try { students = JSON.parse(localStorage.getItem('dhk_students') || '[]'); } catch(e) { students = []; }
    let masterKey = {};
    try {
      const savedMaster = JSON.parse(localStorage.getItem('dhk_master_key') || '{}');
      masterKey = savedMaster.keys || savedMaster;
    } catch(e) { masterKey = {}; }

    let totalQuestions = parseInt(localStorage.getItem('dhk_total_questions') || '58');
    let marksPerQ = parseFloat(localStorage.getItem('dhk_marks_per_q') || '1');

    let videoStream = null;
    let isProcessing = false;
    let activeEvaluation = null;

    const CLASSES = ['Ka-Shreni', 'Class-I', 'Class-II', 'Class-III', 'Class-IV', 'Class-V', 'Class-VI', 'Class-VII', 'Class-VIII', 'Class-IX', 'Class-X', 'Class-XI', 'Class-XII'];

    function onSubjectChange() {
      const preset = document.getElementById('subjectPresetSelect').value;
      const customField = document.getElementById('customSubjectInput');
      if (preset === '__custom__') {
        customField.style.display = 'block';
        customField.focus();
      } else {
        customField.style.display = 'none';
        localStorage.setItem('dhk_active_subject', preset);
      }
    }

    function onCustomSubjectInput() {
      const val = document.getElementById('customSubjectInput').value.trim();
      localStorage.setItem('dhk_active_subject', val || 'General');
    }

    function getActiveSubject() {
      const preset = document.getElementById('subjectPresetSelect').value;
      if (preset === '__custom__') {
        return document.getElementById('customSubjectInput').value.trim() || 'General';
      }
      return preset;
    }

    function getEffectiveQuestionCount() {
      const activeKeys = Object.keys(masterKey).map(Number).filter(q => masterKey[q]);
      return activeKeys.length > 0 ? Math.max(...activeKeys) : totalQuestions;
    }

    function syncClassDropdown() {
      const mode = document.getElementById('examTrackSelect').value;
      const classSelect = document.getElementById('scanClassSelect');
      const note = document.getElementById('scannerConfigNote');

      classSelect.innerHTML = '';
      const enrolled = [...new Set(students.map(s => s.class_level || s.class))].filter(Boolean);
      let list = enrolled.length > 0 ? enrolled : CLASSES;

      list.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c; opt.textContent = c;
        classSelect.appendChild(opt);
      });

      const effectiveTotal = getEffectiveQuestionCount();
      note.innerHTML = `Active Questions: <b>${effectiveTotal}</b> | Marks/Q: <b>${marksPerQ}</b>`;
    }

    async function startCamera() {
      const video = document.getElementById('cameraStream');
      const btn = document.getElementById('btnToggleCam');
      if (videoStream) videoStream.getTracks().forEach(t => t.stop());

      try {
        videoStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } }
        });
        video.srcObject = videoStream;
        await video.play();
        btn.innerText = "Stop Camera";
        btn.className = "btn btn-red";
      } catch (e) {
        alert("Camera access denied or unavailable.");
      }
    }

    function toggleCameraStream() {
      if (videoStream) {
        videoStream.getTracks().forEach(t => t.stop());
        videoStream = null;
        document.getElementById('btnToggleCam').innerText = "Start Camera";
        document.getElementById('btnToggleCam').className = "btn btn-green";
      } else {
        startCamera();
      }
    }

    function setScanProgress(pct, label, sub) {
      document.getElementById('progressBarFill').style.width = pct + '%';
      document.getElementById('progressPercentageText').innerText = pct + '% Complete';
      if (label) document.getElementById('progressStatusText').innerText = label;
      if (sub) document.querySelector('.progress-sub').innerText = sub;
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function startControlledScan() {
      if (isProcessing) return;

      const activeKeys = Object.keys(masterKey).filter(k => masterKey[k]);
      if (activeKeys.length === 0) {
        if (!confirm("⚠️ No Master Answer Key found! Do you want to continue evaluating anyway?")) {
          return;
        }
      }

      const video = document.getElementById('cameraStream');
      if (!video || !video.videoWidth) {
        alert("Please start camera or select a photo from gallery.");
        return;
      }

      isProcessing = true;
      const pBox = document.getElementById('scanProgressBox');
      pBox.style.display = 'flex';

      setScanProgress(15, "Locking Focus & Stabilizing...", "Hold steady over paper");
      await sleep(500);

      setScanProgress(35, "Capturing High-Res Frame...", "Normalizing perspective & lighting");
      const canvas = document.getElementById('procCanvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(video, 0, 0);
      await sleep(300);

      await runImageAnalysis(canvas);
      pBox.style.display = 'none';
      isProcessing = false;
    }

    function processGalleryImage(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        const img = new Image();
        img.onload = async function() {
          const canvas = document.getElementById('procCanvas');
          canvas.width = img.width;
          canvas.height = img.height;
          const ctx = canvas.getContext('2d', { willReadFrequently: true });
          ctx.drawImage(img, 0, 0);

          const pBox = document.getElementById('scanProgressBox');
          pBox.style.display = 'flex';
          isProcessing = true;
          await runImageAnalysis(canvas);
          pBox.style.display = 'none';
          isProcessing = false;
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
      e.target.value = '';
    }

    function getSimilarity(s1, s2) {
      s1 = (s1 || '').toUpperCase().trim();
      s2 = (s2 || '').toUpperCase().trim();
      if (s1 === s2) return 1.0;
      if (!s1 || !s2) return 0.0;
      const track = Array(s2.length + 1).fill(null).map(() => Array(s1.length + 1).fill(null));
      for (let i = 0; i <= s1.length; i++) track[0][i] = i;
      for (let j = 0; j <= s2.length; j++) track[j][0] = j;
      for (let j = 1; j <= s2.length; j++) {
        for (let i = 1; i <= s1.length; i++) {
          const cost = s1[i - 1] === s2[j - 1] ? 0 : 1;
          track[j][i] = Math.min(track[j][i - 1] + 1, track[j - 1][i] + 1, track[j - 1][i - 1] + cost);
        }
      }
      return (Math.max(s1.length, s2.length) - track[s2.length][s1.length]) / Math.max(s1.length, s2.length);
    }

    function parseDetectedClass(rawText) {
      const t = (rawText || '').toUpperCase();
      if (t.includes('CLASS-XII') || t.includes('CLASS XII') || t.includes('XII')) return 'Class-XII';
      if (t.includes('CLASS-XI') || t.includes('CLASS XI') || t.includes('XI'))  return 'Class-XI';
      if (t.includes('CLASS-VIII') || t.includes('CLASS VIII') || t.includes('VIII')) return 'Class-VIII';
      if (t.includes('CLASS-VII') || t.includes('CLASS VII') || t.includes('VII'))  return 'Class-VII';
      if (t.includes('CLASS-VI') || t.includes('CLASS VI') || t.includes('VI'))   return 'Class-VI';
      if (t.includes('CLASS-IV') || t.includes('CLASS IV') || t.includes('IV'))   return 'Class-IV';
      if (t.includes('CLASS-IX') || t.includes('CLASS IX') || t.includes('IX'))   return 'Class-IX';
      if (t.includes('CLASS-X') || t.includes('CLASS X') || t.includes('X'))    return 'Class-X';
      if (t.includes('CLASS-III') || t.includes('CLASS III') || t.includes('III') || t.includes('THRE')) return 'Class-III';
      if (t.includes('CLASS-II') || t.includes('CLASS II') || t.includes('II'))   return 'Class-II';
      if (t.includes('CLASS-I') || t.includes('CLASS I')) return 'Class-I';
      if (t.includes('KA')) return 'Ka-Shreni';
      return null;
    }

    function evaluateBubbles(ctx, w, h) {
      const responses = {};
      const isUniversal = document.getElementById('examTrackSelect').value === 'universal_100';

      const gridLeft = w * 0.075;
      const gridRight = w * 0.720;
      const colWidth = (gridRight - gridLeft) / 3;

      const blockTops = isUniversal
        ? [h * 0.190, h * 0.380, h * 0.570, h * 0.760]
        : [h * 0.495, h * 0.602, h * 0.708, h * 0.814];

      const blockHeight = isUniversal ? (h * 0.160) : (h * 0.082);
      const rowStep = blockHeight / 5;

      const effectiveTotal = getEffectiveQuestionCount();
      const rowsPerCol = Math.ceil(effectiveTotal / 3);

      function getQuestionPosition(q) {
        let col = 0, rowInCol = 0;
        if (isUniversal) {
          col = Math.floor((q - 1) / rowsPerCol);
          rowInCol = (q - 1) % rowsPerCol;
        } else {
          if (q <= 20) { col = 0; rowInCol = q - 1; }
          else if (q <= 40) { col = 1; rowInCol = q - 21; }
          else if (q <= 60) { col = 2; rowInCol = q - 41; }
        }

        const blockIdx = Math.floor(rowInCol / 5);
        const rowInBlock = rowInCol % 5;
        const y = (blockTops[blockIdx] || blockTops[0]) + (rowInBlock * rowStep) + (rowStep * 0.5);
        return { col, y };
      }

      const options = ['A', 'B', 'C', 'D'];

      for (let q = 1; q <= effectiveTotal; q++) {
        const { col, y } = getQuestionPosition(q);
        const colStartX = gridLeft + (col * colWidth);

        let darkestOpt = null;
        let minBrightness = 255;
        let readings = [];

        options.forEach((opt, idx) => {
          const xCenter = colStartX + (colWidth * 0.28) + (idx * (colWidth * 0.178));
          const p = ctx.getImageData(Math.round(xCenter - 3), Math.round(y - 3), 7, 7).data;
          let sum = 0;
          for (let i = 0; i < p.length; i += 4) {
            sum += (p[i] * 0.299 + p[i+1] * 0.587 + p[i+2] * 0.114);
          }
          const avg = sum / (p.length / 4);
          readings.push({ opt, avg });

          if (avg < minBrightness) {
            minBrightness = avg;
            darkestOpt = opt;
          }
        });

        readings.sort((a, b) => a.avg - b.avg);
        if (readings[1].avg - readings[0].avg > 25) {
          responses[q] = darkestOpt;
        } else {
          responses[q] = null;
        }
      }

      return responses;
    }

    async function runImageAnalysis(canvas) {
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      const w = canvas.width;
      const h = canvas.height;

      setScanProgress(55, "Scanning Header...", "Extracting Class & Name");
      const crop = document.getElementById('cropCanvas');
      const cropCtx = crop.getContext('2d', { willReadFrequently: true });

      // Crop upper header where Class and Student Name boxes reside
      crop.width = w;
      crop.height = Math.round(h * 0.26);
      cropCtx.drawImage(canvas, 0, 0, w, crop.height, 0, 0, w, crop.height);

      let ocrText = "";
      try {
        if (window.Tesseract) {
          const res = await Tesseract.recognize(crop, 'eng');
          ocrText = res.data.text || "";
        }
      } catch (err) {
        console.warn("OCR non-critical fallback", err);
      }

      setScanProgress(80, "Evaluating Answers...", "Differential bubble measurement");
      await sleep(200);

      const responses = evaluateBubbles(ctx, w, h);
      const effectiveTotal = getEffectiveQuestionCount();

      let correct = 0, incorrect = 0;
      for (let q = 1; q <= effectiveTotal; q++) {
        const studentAns = responses[q];
        const correctAns = masterKey[q];
        if (correctAns) {
          if (studentAns === correctAns) correct++;
          else if (studentAns) incorrect++;
        }
      }

      const calculatedScore = correct * marksPerQ;
      const maxPossibleScore = effectiveTotal * marksPerQ;

      // Extract detected class or fallback to selected UI class
      const parsedCls = parseDetectedClass(ocrText);
      const fallbackCls = document.getElementById('scanClassSelect').value;
      const finalClass = parsedCls || fallbackCls;

      activeEvaluation = {
        score: calculatedScore,
        maxScore: maxPossibleScore,
        correct: correct,
        incorrect: incorrect,
        detectedClass: finalClass,
        rawOcr: ocrText,
        responses: responses
      };

      setScanProgress(100, "Done!", "Opening verification dialog");
      await sleep(200);

      openVerificationModal();
    }

    function openVerificationModal() {
      const modal = document.getElementById('studentVerifyModal');
      const rawBox = document.getElementById('rawOcrText');
      const classSelect = document.getElementById('modalClassOverrideSelect');
      const scoreInput = document.getElementById('modalMcqScoreInput');
      const maxText = document.getElementById('modalMaxMcqText');
      const breakdown = document.getElementById('modalBreakdownNote');

      rawBox.innerText = activeEvaluation.rawOcr.trim() ? activeEvaluation.rawOcr.trim().slice(0, 150) : "Header clear / auto-aligned";

      // Setup Class dropdown
      classSelect.innerHTML = '';
      const enrolled = [...new Set(students.map(s => s.class_level || s.class))].filter(Boolean);
      let list = enrolled.length > 0 ? enrolled : CLASSES;
      list.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c; opt.textContent = c;
        if (c === activeEvaluation.detectedClass) opt.selected = true;
        classSelect.appendChild(opt);
      });

      scoreInput.value = activeEvaluation.score;
      maxText.innerText = `/ ${activeEvaluation.maxScore}`;
      breakdown.innerText = `Correct: ${activeEvaluation.correct} | Incorrect: ${activeEvaluation.incorrect}`;

      populateRosterMatchDropdown(classSelect.value);
      modal.style.display = 'flex';
    }

    function onModalClassChanged() {
      const cls = document.getElementById('modalClassOverrideSelect').value;
      activeEvaluation.detectedClass = cls;
      populateRosterMatchDropdown(cls);
    }

    function populateRosterMatchDropdown(selectedClass) {
      const studentSelect = document.getElementById('studentConfirmSelect');
      studentSelect.innerHTML = '';

      const matchedStudents = students.filter(s => (s.class_level || s.class) === selectedClass);

      if (matchedStudents.length === 0) {
        const opt = document.createElement('option');
        opt.value = "UNKNOWN_STUDENT";
        opt.textContent = `Unlisted Student (${selectedClass})`;
        studentSelect.appendChild(opt);
        return;
      }

      // Rank students using fuzzy similarity to OCR text
      let bestMatch = matchedStudents[0];
      let maxSim = -1;

      matchedStudents.forEach(st => {
        const sim = getSimilarity(st.name, activeEvaluation.rawOcr);
        if (sim > maxSim) {
          maxSim = sim;
          bestMatch = st;
        }
      });

      matchedStudents.forEach(st => {
        const opt = document.createElement('option');
        const stId = st.id || st.student_id || st.name;
        opt.value = stId;
        opt.textContent = `${st.name} (Roll: ${st.roll_no || st.roll || '-'})`;
        if (st === bestMatch) opt.selected = true;
        studentSelect.appendChild(opt);
      });
    }

    function confirmAndSaveRecord() {
      const studentSelect = document.getElementById('studentConfirmSelect');
      const classSelect = document.getElementById('modalClassOverrideSelect');
      const scoreInput = document.getElementById('modalMcqScoreInput');

      const studentId = studentSelect.value;
      const studentName = studentSelect.options[studentSelect.selectedIndex].text.split(' (Roll:')[0];
      const selectedClass = classSelect.value;
      const finalScore = parseFloat(scoreInput.value) || 0;
      const activeSub = getActiveSubject();

      let records = [];
      try {
        records = JSON.parse(localStorage.getItem('dhk_evaluations') || localStorage.getItem('dhk_eval_records') || '[]');
      } catch(e) { records = []; }

      // Deduplicate: replace any existing record for this student and subject
      const existingIdx = records.findIndex(r => 
        ((r.student_id === studentId || r.studentId === studentId) && (r.subject || 'Gunotsav') === activeSub)
      );

      const recordPayload = {
        student_id: studentId,
        studentId: studentId,
        studentName: studentName,
        class: selectedClass,
        subject: activeSub,
        score: finalScore,
        max_score: activeEvaluation.maxScore,
        totalMarks: activeEvaluation.maxScore,
        skillMarks: 0,
        correct: activeEvaluation.correct,
        incorrect: activeEvaluation.incorrect,
        timestamp: new Date().toISOString()
      };

      if (existingIdx >= 0) {
        records[existingIdx] = recordPayload;
      } else {
        records.push(recordPayload);
      }

      localStorage.setItem('dhk_evaluations', JSON.stringify(records));
      localStorage.setItem('dhk_eval_records', JSON.stringify(records));

      alert(`✅ Evaluation Saved!\n${studentName} • ${selectedClass}\nSubject: ${activeSub}\nScore: ${finalScore} / ${activeEvaluation.maxScore}`);
      closeModal();
    }

    function closeModal() {
      document.getElementById('studentVerifyModal').style.display = 'none';
    }

    window.onload = function() {
      const savedSub = localStorage.getItem('dhk_active_subject') || 'Gunotsav';
      const sel = document.getElementById('subjectPresetSelect');
      if (['Gunotsav', 'Language I (Assamese)', 'Language II (English)', 'Mathematics', 'Environmental Studies (EVS)', 'General Science', 'Social Studies'].includes(savedSub)) {
        sel.value = savedSub;
      } else {
        sel.value = '__custom__';
        const customInput = document.getElementById('customSubjectInput');
        customInput.style.display = 'block';
        customInput.value = savedSub;
      }

      syncClassDropdown();
    };
  </script>

  <!-- Offline Service Worker Activation -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(console.error);
    }
  </script>
