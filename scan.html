<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DHK OMR Pro - Precision Scanner</title>
  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Tesseract.js for OCR -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .scan-guide {
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.65);
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans select-none">

  <!-- TOP HEADER / CONTROL BAR -->
  <header class="bg-slate-800 border-b border-slate-700 p-3 shadow-md z-20">
    <div class="flex items-center justify-between gap-2 max-w-xl mx-auto">
      <div class="flex items-center gap-2">
        <a href="index.html" class="p-2 rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-200 transition">
          <i data-lucide="arrow-left" class="w-5 h-5"></i>
        </a>
        <div>
          <h1 class="text-sm font-bold text-white tracking-wide">DHK OMR Scanner</h1>
          <div id="statsBadge" class="text-xs text-amber-400 font-medium">Class: Not Locked</div>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <!-- Torch Toggle Button -->
        <button id="torchBtn" onclick="toggleTorch()" class="p-2 rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-300 transition">
          <i data-lucide="zap-off" id="torchIcon" class="w-5 h-5"></i>
        </button>
        <!-- Gallery File Upload Fallback -->
        <label class="p-2 rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-300 transition cursor-pointer">
          <i data-lucide="image" class="w-5 h-5"></i>
          <input type="file" id="fileUpload" accept="image/*" class="hidden" onchange="handleFileUpload(event)" />
        </label>
      </div>
    </div>

    <!-- CONFIGURATION & CLASS LOCK STRIP -->
    <div class="grid grid-cols-2 gap-2 mt-2 max-w-xl mx-auto pt-2 border-t border-slate-700/60 text-xs">
      <div>
        <label class="block text-slate-400 font-semibold mb-1">Sheet Format</label>
        <select id="sheetFormat" class="w-full bg-slate-900 border border-slate-600 rounded p-1.5 text-white focus:outline-none focus:border-indigo-500 font-medium">
          <option value="gunotsav">Gunotsav (43 Dashes)</option>
          <option value="universal">Universal DHK (34 Dashes)</option>
        </select>
      </div>

      <div>
        <label class="block text-slate-400 font-semibold mb-1">Target Class</label>
        <select id="lockedClass" onchange="lockClass(this.value)" class="w-full bg-slate-900 border border-slate-600 rounded p-1.5 text-white focus:outline-none focus:border-indigo-500 font-medium">
          <option value="">-- Choose Class --</option>
          <option value="I">Class I</option>
          <option value="II">Class II</option>
          <option value="III">Class III</option>
          <option value="IV">Class IV</option>
          <option value="V">Class V</option>
          <option value="IX">Class IX</option>
          <option value="X">Class X</option>
        </select>
      </div>
    </div>
  </header>

  <!-- 90% SCAN PROGRESS ALERT BAR -->
  <div id="attendanceAlert" class="hidden bg-emerald-600/90 text-white text-xs px-4 py-1.5 flex items-center justify-between transition-all">
    <div class="flex items-center gap-2">
      <i data-lucide="check-circle" class="w-4 h-4"></i>
      <span id="attendanceMsg">90% Scanned! 2 students left.</span>
    </div>
    <button onclick="toggleUnscannedList()" class="underline font-bold text-emerald-100">Review</button>
  </div>

  <!-- VIEWFINDER & SCAN STAGE -->
  <main class="relative flex-1 bg-black flex items-center justify-center overflow-hidden">
    <!-- Real-time Video Stream -->
    <video id="videoFeed" playsinline autoplay muted class="absolute inset-0 w-full h-full object-cover"></video>

    <!-- Offscreen Processing Canvas -->
    <canvas id="procCanvas" class="hidden"></canvas>

    <!-- Viewfinder Alignment Overlay -->
    <div class="relative z-10 w-[88%] h-[82%] border-2 border-indigo-400/80 rounded-lg scan-guide pointer-events-none flex flex-col justify-between p-2">
      <div class="flex justify-between items-start">
        <div class="bg-black/60 px-2 py-0.5 rounded text-[10px] text-indigo-300 font-mono">LEFT RAIL ──►</div>
        <div class="bg-black/60 px-2 py-0.5 rounded text-[10px] text-amber-300 font-mono" id="modeIndicator">GUNOTSAV 43-PIECE</div>
      </div>
      <div class="border-b border-dashed border-red-500/60 w-full text-right pr-1">
        <span class="text-[9px] text-red-400 bg-black/60 px-1 rounded">STUDENT NAME ZONE (PIECE #17)</span>
      </div>
      <div class="text-[10px] text-center text-slate-300 bg-black/60 py-1 rounded">
        Align Left Timing Dashes Inside the Guide Box
      </div>
    </div>
  </main>

  <!-- CAPTURE ACTION STRIP -->
  <footer class="bg-slate-800 border-t border-slate-700 p-4 z-20">
    <div class="max-w-xl mx-auto flex items-center justify-around">
      <button onclick="triggerScan()" id="scanActionBtn" class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white font-bold px-8 py-3 rounded-full shadow-lg transition">
        <i data-lucide="scan-line" class="w-5 h-5"></i>
        <span>Scan Sheet</span>
      </button>
    </div>
  </footer>

  <!-- VERIFICATION MODAL POPUP -->
  <div id="evalModal" class="hidden fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 w-full max-w-md rounded-xl p-5 shadow-2xl space-y-4">
      <div class="flex justify-between items-center border-b border-slate-700 pb-2">
        <h3 class="font-bold text-white text-base">Evaluation Result</h3>
        <span id="scoreBadge" class="bg-indigo-600 text-white font-mono px-3 py-1 rounded text-sm font-bold">Score: --/--</span>
      </div>

      <div class="space-y-2 text-sm">
        <div>
          <span class="text-slate-400 text-xs block mb-1">Identified Student:</span>
          <select id="resStudentSelect" class="w-full bg-slate-900 border border-slate-600 rounded p-2 text-white font-semibold text-sm focus:outline-none focus:border-indigo-500">
            <!-- Dynamically populated -->
          </select>
        </div>
        <div class="grid grid-cols-3 gap-2 bg-slate-900 p-2 rounded text-center text-xs font-mono">
          <div><span class="text-slate-500 block">Attempted</span><span id="resAttempted" class="text-emerald-400 font-bold">0</span></div>
          <div><span class="text-slate-500 block">Blank</span><span id="resBlank" class="text-amber-400 font-bold">0</span></div>
          <div><span class="text-slate-500 block">Multi</span><span id="resMulti" class="text-rose-400 font-bold">0</span></div>
        </div>
      </div>

      <div class="flex gap-2 pt-2">
        <button onclick="saveAndNext()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-bold py-2.5 rounded-lg transition">Save Result</button>
        <button onclick="closeModal()" class="flex-1 bg-slate-700 hover:bg-slate-600 active:scale-95 text-slate-300 font-bold py-2.5 rounded-lg transition">Rescan</button>
      </div>
    </div>
  </div>

  <!-- UNSCANNED STUDENTS DRAWER -->
  <div id="unscannedDrawer" class="hidden fixed inset-0 z-50 bg-black/80 flex items-end justify-center">
    <div class="bg-slate-800 border-t border-slate-700 w-full max-w-lg rounded-t-2xl p-5 space-y-4 max-h-[75vh] flex flex-col">
      <div class="flex justify-between items-center border-b border-slate-700 pb-2">
        <h3 class="font-bold text-white text-sm">Unscanned Students</h3>
        <button onclick="toggleUnscannedList()" class="p-1 text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div id="unscannedContainer" class="flex-1 overflow-y-auto space-y-2 text-xs">
        <!-- Rendered dynamically -->
      </div>
    </div>
  </div>

  <script>
    // System State
    let videoStream = null;
    let videoTrack = null;
    let torchActive = false;
    let masterKey = {};
    let classRoster = [];
    let scannedRecords = [];
    let currentEvaluation = null;

    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      initCamera();
      loadSystemData();
    });

    // 1. Hardware Video & Persistent Torch Engine
    async function initCamera() {
      try {
        videoStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }
        });
        const video = document.getElementById('videoFeed');
        video.srcObject = videoStream;
        videoTrack = videoStream.getVideoTracks()[0];
      } catch (err) {
        alert("Camera access denied or unavailable: " + err.message);
      }
    }

    async function toggleTorch() {
      if (!videoTrack) return;
      const caps = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
      if (!caps.torch) {
        alert("Flashlight/Torch hardware not supported on this device/browser.");
        return;
      }
      try {
        torchActive = !torchActive;
        await videoTrack.applyConstraints({ advanced: [{ torch: torchActive }] });
        const icon = document.getElementById('torchIcon');
        if (torchActive) {
          icon.setAttribute('data-lucide', 'zap');
          document.getElementById('torchBtn').classList.add('bg-amber-500', 'text-slate-900');
        } else {
          icon.setAttribute('data-lucide', 'zap-off');
          document.getElementById('torchBtn').classList.remove('bg-amber-500', 'text-slate-900');
        }
        lucide.createIcons();
      } catch (e) {
        console.error("Torch error:", e);
      }
    }

    // 2. Data Initialization & Class Lock
    function loadSystemData() {
      const storedRoster = localStorage.getItem('dhk_roster');
      if (storedRoster) classRoster = JSON.parse(storedRoster);

      const storedKey = localStorage.getItem('dhk_master_key');
      if (storedKey) masterKey = JSON.parse(storedKey);

      const storedScores = localStorage.getItem('dhk_scanned_scores');
      if (storedScores) scannedRecords = JSON.parse(storedScores);

      const locked = localStorage.getItem('dhk_locked_class');
      if (locked) {
        document.getElementById('lockedClass').value = locked;
        lockClass(locked);
      }
    }

    function lockClass(val) {
      if (!val) return;
      localStorage.setItem('dhk_locked_class', val);
      document.getElementById('statsBadge').innerText = `Class ${val} [Locked]`;
      updateAttendanceAlert();
    }

    function updateAttendanceAlert() {
      const locked = document.getElementById('lockedClass').value;
      if (!locked) return;

      const targetStudents = classRoster.filter(s => s.class === locked);
      if (targetStudents.length === 0) return;

      const scannedInClass = scannedRecords.filter(r => r.class === locked);
      const ratio = scannedInClass.length / targetStudents.length;

      const alertBar = document.getElementById('attendanceAlert');
      if (ratio >= 0.90 && scannedInClass.length < targetStudents.length) {
        const remaining = targetStudents.length - scannedInClass.length;
        document.getElementById('attendanceMsg').innerText = `${Math.round(ratio * 100)}% Complete! Only ${remaining} student(s) left.`;
        alertBar.classList.remove('hidden');
      } else {
        alertBar.classList.add('hidden');
      }
    }

    // 3. Timing-Dash Extraction Engine
    function locateTimingDashes(ctx, width, height) {
      const startX = Math.floor(width * 0.01);
      const endX = Math.floor(width * 0.08);
      const imgData = ctx.getImageData(startX, 0, endX - startX, height);
      const data = imgData.data;
      const rowDarkness = new Array(height).fill(0);

      for (let y = 0; y < height; y++) {
        let count = 0;
        for (let x = 0; x < (endX - startX); x++) {
          const idx = (y * (endX - startX) + x) * 4;
          const gray = 0.299 * data[idx] + 0.587 * data[idx + 1] + 0.114 * data[idx + 2];
          if (gray < 85) count++;
        }
        rowDarkness[y] = count;
      }

      const dashes = [];
      let inDash = false;
      let startY = 0;
      const minThreshold = (endX - startX) * 0.30;

      for (let y = 0; y < height; y++) {
        if (rowDarkness[y] > minThreshold && !inDash) {
          inDash = true;
          startY = y;
        } else if (rowDarkness[y] <= minThreshold && inDash) {
          inDash = false;
          const dashHeight = y - startY;
          if (dashHeight > 3 && dashHeight < (height * 0.04)) {
            dashes.push({ center: Math.floor((startY + y) / 2), height: dashHeight });
          }
        }
      }
      return dashes;
    }

    // 4. Trigger & Upload Handling
    async function triggerScan() {
      const locked = document.getElementById('lockedClass').value;
      if (!locked) {
        alert("Please select and lock the Class first.");
        return;
      }

      const video = document.getElementById('videoFeed');
      const canvas = document.getElementById('procCanvas');
      canvas.width = video.videoWidth || 1280;
      canvas.height = video.videoHeight || 720;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      await processSheet(canvas);
    }

    async function handleFileUpload(evt) {
      const file = evt.target.files[0];
      if (!file) return;
      const img = new Image();
      img.onload = async () => {
        const canvas = document.getElementById('procCanvas');
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        await processSheet(canvas);
      };
      img.src = URL.createObjectURL(file);
    }

    async function processSheet(canvas) {
      const btn = document.getElementById('scanActionBtn');
      btn.disabled = true;
      btn.classList.add('opacity-50');

      const ctx = canvas.getContext('2d');
      const w = canvas.width;
      const h = canvas.height;
      const dashes = locateTimingDashes(ctx, w, h);

      const mode = document.getElementById('sheetFormat').value;

      try {
        if (mode === 'gunotsav') {
          await evaluateGunotsav(ctx, w, h, dashes);
        } else {
          await evaluateUniversal(ctx, w, h, dashes);
        }
      } catch (err) {
        console.error("Evaluation failure:", err);
        alert("Evaluation error. Please retake the photo.");
      } finally {
        btn.disabled = false;
        btn.classList.remove('opacity-50');
      }
    }

    // 5. Gunotsav Precision Engine (Locked to Piece #17)
    async function evaluateGunotsav(ctx, w, h, dashes) {
      let nameBoxY, nameBoxH;

      // Lock to Piece #17
      if (dashes && dashes.length >= 17) {
        nameBoxY = dashes[16].center - Math.floor(dashes[16].height * 1.2);
        nameBoxH = Math.floor(dashes[16].height * 2.4);
      } else {
        nameBoxY = Math.floor(h * 0.345);
        nameBoxH = Math.floor(h * 0.035);
      }

      // Crop strictly the value box (skips printed "STUDENT NAME :-" text)
      const nameBoxX = Math.floor(w * 0.35);
      const nameBoxW = Math.floor(w * 0.42);

      const nameCanvas = document.createElement('canvas');
      nameCanvas.width = nameBoxW;
      nameCanvas.height = nameBoxH;
      const nCtx = nameCanvas.getContext('2d');
      nCtx.drawImage(ctx.canvas, nameBoxX, nameBoxY, nameBoxW, nameBoxH, 0, 0, nameBoxW, nameBoxH);

      // Contrast binarization for clean OCR
      const nData = nCtx.getImageData(0, 0, nameBoxW, nameBoxH);
      const d = nData.data;
      for (let i = 0; i < d.length; i += 4) {
        const v = (d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114) > 130 ? 255 : 0;
        d[i] = d[i + 1] = d[i + 2] = v;
      }
      nCtx.putImageData(nData, 0, 0);

      // Targeted OCR strictly for uppercase alphabets
      let recognizedName = "";
      try {
        const ocrRes = await Tesseract.recognize(nameCanvas, 'eng', {
          tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ '
        });
        recognizedName = ocrRes.data.text.trim().replace(/[^A-Z\s]/g, "");
      } catch (e) {
        console.warn("OCR Error:", e);
      }

      // MCQ Evaluation: Dashes #24 to #43 (20 rows)
      const answers = {};
      const colStarts = [0.09, 0.32, 0.54, 0.76];
      const bubbleSpacing = 0.035;

      const rowYList = [];
      if (dashes && dashes.length >= 43) {
        for (let i = 23; i < dashes.length; i++) rowYList.push(dashes[i].center);
      } else {
        const step = (h * 0.395) / 20;
        for (let i = 0; i < 20; i++) rowYList.push((h * 0.525) + (i * step));
      }

      const maxQ = Object.keys(masterKey).length > 0 ? Object.keys(masterKey).length : 58;

      let qIndex = 1;
      for (let c = 0; c < 4 && qIndex <= maxQ; c++) {
        for (let r = 0; r < rowYList.length && qIndex <= maxQ; r++) {
          const cy = rowYList[r];
          let bestOption = null;
          let bestDensity = 0;
          let marksCount = 0;

          ['A', 'B', 'C', 'D'].forEach((opt, idx) => {
            const cx = (w * colStarts[c]) + (idx * w * bubbleSpacing);
            const density = sampleBubbleDensity(ctx, cx, cy, 6);
            if (density > 0.45) marksCount++;
            if (density > bestDensity) {
              bestDensity = density;
              bestOption = opt;
            }
          });

          if (marksCount > 1) {
            answers[qIndex] = 'MULTI';
          } else if (bestDensity > 0.45) {
            answers[qIndex] = bestOption;
          } else {
            answers[qIndex] = 'BLANK';
          }
          qIndex++;
        }
      }

      compileResults(recognizedName, answers, maxQ);
    }

    // 6. Universal Engine (Locked to Piece #1 Header)
    async function evaluateUniversal(ctx, w, h, dashes) {
      const nameCropY = Math.floor(h * 0.165);
      const nameCropH = Math.floor(h * 0.035);

      const nameCanvas = document.createElement('canvas');
      nameCanvas.width = Math.floor(w * 0.44);
      nameCanvas.height = nameCropH;
      const nCtx = nameCanvas.getContext('2d');
      nCtx.drawImage(ctx.canvas, Math.floor(w * 0.07), nameCropY, nameCanvas.width, nameCropH, 0, 0, nameCanvas.width, nameCropH);

      const nData = nCtx.getImageData(0, 0, nameCanvas.width, nameCropH);
      const d = nData.data;
      for (let i = 0; i < d.length; i += 4) {
        const v = (d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114) > 130 ? 255 : 0;
        d[i] = d[i + 1] = d[i + 2] = v;
      }
      nCtx.putImageData(nData, 0, 0);

      let recognizedName = "";
      try {
        const ocrRes = await Tesseract.recognize(nameCanvas, 'eng', {
          tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ '
        });
        recognizedName = ocrRes.data.text.trim().replace(/[^A-Z\s]/g, "");
      } catch (e) {
        console.warn("OCR Error:", e);
      }

      const answers = {};
      const colStarts = [0.12, 0.41, 0.70];
      const bubbleSpacing = 0.045;

      const rowYList = [];
      if (dashes && dashes.length >= 34) {
        for (let i = 0; i < 34; i++) rowYList.push(dashes[i].center);
      } else {
        const step = (h * 0.69) / 34;
        for (let i = 0; i < 34; i++) rowYList.push((h * 0.21) + (i * step));
      }

      const maxQ = Object.keys(masterKey).length > 0 ? Object.keys(masterKey).length : 100;

      let qIndex = 1;
      for (let c = 0; c < 3 && qIndex <= maxQ; c++) {
        for (let r = 0; r < rowYList.length && qIndex <= maxQ; r++) {
          const cy = rowYList[r];
          let bestOption = null;
          let bestDensity = 0;
          let marksCount = 0;

          ['A', 'B', 'C', 'D'].forEach((opt, idx) => {
            const cx = (w * colStarts[c]) + (idx * w * bubbleSpacing);
            const density = sampleBubbleDensity(ctx, cx, cy, 6);
            if (density > 0.45) marksCount++;
            if (density > bestDensity) {
              bestDensity = density;
              bestOption = opt;
            }
          });

          if (marksCount > 1) {
            answers[qIndex] = 'MULTI';
          } else if (bestDensity > 0.45) {
            answers[qIndex] = bestOption;
          } else {
            answers[qIndex] = 'BLANK';
          }
          qIndex++;
        }
      }

      compileResults(recognizedName, answers, maxQ);
    }

    // 7. Bubble Density Measurement Helper (Complete & Untruncated)
    function sampleBubbleDensity(ctx, cx, cy, radius) {
      try {
        const imgData = ctx.getImageData(Math.floor(cx - radius), Math.floor(cy - radius), radius * 2, radius * 2);
        const data = imgData.data;
        let darkPixels = 0;
        let totalPixels = 0;

        for (let i = 0; i < data.length; i += 4) {
          const gray = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
          if (gray < 110) darkPixels++;
          totalPixels++;
        }
        return totalPixels > 0 ? (darkPixels / totalPixels) : 0;
      } catch (e) {
        return 0;
      }
    }

    // 8. Result Compilation & Fuzzy Student Matcher
    function compileResults(rawName, answers, totalQuestions) {
      const locked = document.getElementById('lockedClass').value;
      const targetStudents = classRoster.filter(s => s.class === locked);

      // Levenshtein Fuzzy Matcher
      let matchedStudent = null;
      let highestSimilarity = 0;

      if (rawName && rawName.length > 2) {
        targetStudents.forEach(s => {
          const sim = stringSimilarity(rawName.toUpperCase(), s.name.toUpperCase());
          if (sim > highestSimilarity) {
            highestSimilarity = sim;
            matchedStudent = s;
          }
        });
      }

      // If similarity is below 40%, do not blindly assign
      if (highestSimilarity < 0.40) {
        matchedStudent = null;
      }

      // Calculate Scores
      let score = 0;
      let attempted = 0;
      let blank = 0;
      let multi = 0;

      for (let q = 1; q <= totalQuestions; q++) {
        const mark = answers[q];
        if (mark === 'BLANK') blank++;
        else if (mark === 'MULTI') multi++;
        else attempted++;

        if (masterKey[q] && masterKey[q] === mark) {
          score++;
        }
      }

      // Render Dropdown of Class Roster
      const selectBox = document.getElementById('resStudentSelect');
      selectBox.innerHTML = '';

      if (!matchedStudent) {
        const defOpt = document.createElement('option');
        defOpt.value = "";
        defOpt.innerText = `⚠️ OCR: "${rawName || 'No Name'}" - Tap to Pick Student`;
        selectBox.appendChild(defOpt);
      }

      targetStudents.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.name;
        opt.innerText = `${s.name} (Roll: ${s.roll})`;
        if (matchedStudent && matchedStudent.name === s.name) opt.selected = true;
        selectBox.appendChild(opt);
      });

      currentEvaluation = {
        class: locked,
        score: score,
        total: totalQuestions,
        answers: answers
      };

      document.getElementById('scoreBadge').innerText = `Score: ${score}/${totalQuestions}`;
      document.getElementById('resAttempted').innerText = attempted;
      document.getElementById('resBlank').innerText = blank;
      document.getElementById('resMulti').innerText = multi;

      document.getElementById('evalModal').classList.remove('hidden');
      if (navigator.vibrate) navigator.vibrate([60, 40, 60]);
    }

    // Levenshtein Similarity (0.0 to 1.0)
    function stringSimilarity(s1, s2) {
      let longer = s1;
      let shorter = s2;
      if (s1.length < s2.length) { longer = s2; shorter = s1; }
      const longerLength = longer.length;
      if (longerLength === 0) return 1.0;
      return (longerLength - editDistance(longer, shorter)) / parseFloat(longerLength);
    }

    function editDistance(s1, s2) {
      s1 = s1.toLowerCase();
      s2 = s2.toLowerCase();
      const costs = [];
      for (let i = 0; i <= s1.length; i++) {
        let lastValue = i;
        for (let j = 0; j <= s2.length; j++) {
          if (i === 0) costs[j] = j;
          else {
            if (j > 0) {
              let newValue = costs[j - 1];
              if (s1.charAt(i - 1) !== s2.charAt(j - 1))
                newValue = Math.min(Math.min(newValue, lastValue), costs[j]) + 1;
              costs[j - 1] = lastValue;
              lastValue = newValue;
            }
          }
        }
        if (i > 0) costs[s2.length] = lastValue;
      }
      return costs[s2.length];
    }

    function saveAndNext() {
      const selectBox = document.getElementById('resStudentSelect');
      const selectedName = selectBox.value;

      if (!selectedName) {
        alert("Please select the student name before saving.");
        return;
      }

      const locked = document.getElementById('lockedClass').value;
      const targetStudent = classRoster.find(s => s.class === locked && s.name === selectedName);

      currentEvaluation.name = selectedName;
      currentEvaluation.roll = targetStudent ? targetStudent.roll : "N/A";

      // Duplicate Check
      const existingIdx = scannedRecords.findIndex(r => r.class === locked && r.name === selectedName);
      if (existingIdx !== -1) {
        if (!confirm(`Notice: "${selectedName}" has already been scanned. Overwrite existing score?`)) {
          return;
        }
        scannedRecords[existingIdx] = currentEvaluation;
      } else {
        scannedRecords.push(currentEvaluation);
      }

      localStorage.setItem('dhk_scanned_scores', JSON.stringify(scannedRecords));
      closeModal();
      updateAttendanceAlert();
    }

    function closeModal() {
      document.getElementById('evalModal').classList.add('hidden');
      currentEvaluation = null;
    }

    function toggleUnscannedList() {
      const drawer = document.getElementById('unscannedDrawer');
      const container = document.getElementById('unscannedContainer');
      const locked = document.getElementById('lockedClass').value;

      if (drawer.classList.contains('hidden')) {
        const targetStudents = classRoster.filter(s => s.class === locked);
        const scannedNames = new Set(scannedRecords.filter(r => r.class === locked).map(r => r.name));
        const unscanned = targetStudents.filter(s => !scannedNames.has(s.name));

        container.innerHTML = unscanned.map(s => `
          <div class="flex justify-between items-center p-2 rounded bg-slate-700/50 border border-slate-600">
            <span class="font-bold text-white">${s.name}</span>
            <span class="text-slate-400">Roll: ${s.roll}</span>
          </div>
        `).join('');

        drawer.classList.remove('hidden');
      } else {
        drawer.classList.add('hidden');
      }
    }
  </script>
