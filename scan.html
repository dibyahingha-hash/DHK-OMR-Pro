<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DHK OMR Pro - Scanner Engine</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #2563eb;
      --accent-green: #16a34a;
      --accent-yellow: #eab308;
      --accent-red: #dc2626;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg-dark); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* Top Nav */
    .nav-bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: #0f172a; border-bottom: 1px solid var(--card-border); z-index: 10; }
    .nav-title { font-size: 1.05rem; font-weight: 700; color: #fff; }
    .nav-tabs { display: flex; gap: 6px; overflow-x: auto; }
    .nav-tab { background: #1e293b; border: 1px solid var(--card-border); color: var(--text-muted); padding: 5px 8px; border-radius: 6px; text-decoration: none; font-size: 0.75rem; white-space: nowrap; }
    .nav-tab.active { background: #1d4ed8; color: #fff; border-color: #3b82f6; }

    /* Mode Selector Banner */
    .mode-banner { padding: 6px 12px; background: #1e293b; border-bottom: 1px solid var(--card-border); display: flex; gap: 8px; align-items: center; font-size: 0.8rem; }
    .mode-select { flex: 1; background: #0f172a; color: #facc15; border: 1px solid var(--card-border); padding: 6px; border-radius: 6px; font-weight: 600; font-size: 0.8rem; }

    /* Viewport & Camera Container */
    .scanner-container { position: relative; flex: 1; width: 100%; background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; }
    #videoFeed { position: absolute; width: 100%; height: 100%; object-fit: cover; }
    #overlayCanvas { position: absolute; width: 100%; height: 100%; pointer-events: none; }

    /* HUD Box / Reticle */
    .reticle-box {
      position: absolute;
      width: 82%;
      height: 72%;
      border: 2px dashed rgba(255, 255, 255, 0.4);
      border-radius: 12px;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.55);
      pointer-events: none;
      transition: border-color 0.3s ease;
    }
    .reticle-box.locked { border-color: #22c55e; border-style: solid; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.4); }

    /* In-Camera Floating Controls */
    .floating-bar {
      position: absolute;
      bottom: 16px;
      display: flex;
      gap: 10px;
      align-items: center;
      z-index: 20;
    }
    .hud-btn {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid #475569;
      color: #fff;
      padding: 10px 16px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      backdrop-filter: blur(4px);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .hud-btn.active { background: #eab308; color: #000; border-color: #facc15; }

    /* Review & Audit Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 100; padding: 12px; }
    .modal-content { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px; width: 100%; max-width: 480px; max-height: 90vh; display: flex; flex-direction: column; overflow: hidden; }
    .modal-header { padding: 12px 16px; border-bottom: 1px solid var(--card-border); display: flex; justify-content: space-between; align-items: center; }
    .modal-title { font-size: 1rem; font-weight: 700; color: #facc15; }
    .modal-body { padding: 14px; overflow-y: auto; flex: 1; font-size: 0.85rem; }
    .modal-footer { padding: 10px 14px; border-top: 1px solid var(--card-border); display: flex; gap: 8px; }
    .btn { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: 600; font-size: 0.85rem; cursor: pointer; text-align: center; }
    .btn-green { background: var(--accent-green); color: #fff; }
    .btn-red { background: var(--accent-red); color: #fff; }

    /* Modal Form Rows */
    .eval-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #334155; }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <div class="nav-bar">
    <div class="nav-title">DHK OMR Pro</div>
    <div class="nav-tabs">
      <a href="index.html" class="nav-tab">👤 Roster</a>
      <a href="exam.html" class="nav-tab">📝 Exam & Key</a>
      <a href="scan.html" class="nav-tab active">📷 Scanner</a>
      <a href="grade.html" class="nav-tab">🏆 Grade Card</a>
    </div>
  </div>

  <!-- Multi-Track Mode Selector -->
  <div class="mode-banner">
    <label for="trackMode" style="font-weight: 600; color: #94a3b8;">Mode:</label>
    <select id="trackMode" class="mode-select" onchange="changeTrackMode()">
      <option value="routine_exam">Routine Exam / Class 3–12 MCQ</option>
      <option value="gunotsav_school">Gunotsav (School Evaluation - 24 Indicators)</option>
      <option value="gunotsav_class1_2">Gunotsav (Class 1 & 2 Multi-Student Sheet)</option>
      <option value="master_key">Setup: Scan Master Benchmark Key</option>
    </select>
  </div>

  <!-- Scanner Screen -->
  <div class="scanner-container">
    <video id="videoFeed" playsinline autoplay muted></video>
    <canvas id="overlayCanvas"></canvas>
    <div class="reticle-box" id="reticleBox"></div>

    <!-- Floating HUD Elements -->
    <div class="floating-bar">
      <!-- Hardware Flash Button -->
      <button id="flashToggleBtn" class="hud-btn" type="button" onclick="toggleTorch()">
        🔦 Flash
      </button>

      <!-- Gallery Picker Trigger -->
      <label class="hud-btn" for="galleryInput">
        📁 Gallery
        <input type="file" id="galleryInput" accept="image/*" style="display: none;" onchange="handleGalleryUpload(event)">
      </label>

      <!-- Manual Snap/Override -->
      <button class="hud-btn" type="button" onclick="triggerManualCapture()">
        ⚡ Snap
      </button>
    </div>
  </div>

  <!-- Offscreen Processing Canvas -->
  <canvas id="procCanvas" style="display: none;"></canvas>

  <!-- Review & Verification Modal -->
  <div class="modal-overlay" id="reviewModal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title" id="modalTitle">Scan Review & Verification</div>
      </div>
      <div class="modal-body" id="modalBody">
        <!-- Injected Verification UI -->
      </div>
      <div class="modal-footer">
        <button class="btn btn-red" onclick="closeReviewModal()">Discard</button>
        <button class="btn btn-green" onclick="commitScanResults()">Confirm & Save</button>
      </div>
    </div>
  </div>

  <script>
    // State Variables
    let currentTrack = 'routine_exam';
    let videoStream = null;
    let videoTrack = null;
    let torchActive = false;
    let isProcessing = false;
    let scanHoldTimer = 0;
    const HOLD_REQUIRED_FRAMES = 12; // ~1.8 seconds stability hold
    let activeParsedData = null;

    // Load Local Data
    const students = JSON.parse(localStorage.getItem('dhk_students')) || [];
    const masterKeyObj = JSON.parse(localStorage.getItem('dhk_master_key')) || { totalQ: 50, keys: {} };

    // Initialize Camera Stream & Torch Capability
    async function startCamera() {
      try {
        if (videoStream) {
          videoStream.getTracks().forEach(t => t.stop());
        }
        const constraints = {
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          }
        };
        videoStream = await navigator.mediaDevices.getUserMedia(constraints);
        const video = document.getElementById('videoFeed');
        video.srcObject = videoStream;
        await video.play();

        // Check Torch Support
        videoTrack = videoStream.getVideoTracks()[0];
        const cap = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
        const flashBtn = document.getElementById('flashToggleBtn');
        if (cap.torch) {
          flashBtn.style.display = 'inline-flex';
        } else {
          flashBtn.style.display = 'none';
        }

        requestAnimationFrame(processVideoLoop);
      } catch (err) {
        console.warn("Camera init failed:", err);
        alert("Camera access failed. Ensure permissions are granted.");
      }
    }

    // Hardware Flash Toggle
    async function toggleTorch() {
      if (!videoTrack) return;
      try {
        torchActive = !torchActive;
        await videoTrack.applyConstraints({
          advanced: [{ torch: torchActive }]
        });
        const flashBtn = document.getElementById('flashToggleBtn');
        flashBtn.classList.toggle('active', torchActive);
      } catch (e) {
        console.error("Torch error:", e);
      }
    }

    // Check URL Mode Parameters (for Scan Master Key)
    function checkUrlParams() {
      const params = new URLSearchParams(window.location.search);
      const modeParam = params.get('mode');
      if (modeParam === 'master_key') {
        currentTrack = 'master_key';
        document.getElementById('trackMode').value = 'master_key';
      }
    }

    function changeTrackMode() {
      currentTrack = document.getElementById('trackMode').value;
      scanHoldTimer = 0;
      document.getElementById('reticleBox').classList.remove('locked');
    }

    // Core Frame Processing Loop
    function processVideoLoop() {
      if (!isProcessing && videoFeed.readyState === videoFeed.HAVE_ENOUGH_DATA) {
        analyzeLiveView();
      }
      requestAnimationFrame(processVideoLoop);
    }

    function analyzeLiveView() {
      const v = document.getElementById('videoFeed');
      const canvas = document.getElementById('procCanvas');
      const ctx = canvas.getContext('2d', { willReadFrequently: true });

      // Downsample to max 1280px for performance & stability
      const scale = Math.min(1, 1280 / Math.max(v.videoWidth, v.videoHeight));
      canvas.width = v.videoWidth * scale;
      canvas.height = v.videoHeight * scale;
      ctx.drawImage(v, 0, 0, canvas.width, canvas.height);

      // Check alignment inside reticle
      const isAligned = checkAlignmentAndStability(ctx, canvas.width, canvas.height);

      const reticle = document.getElementById('reticleBox');
      if (isAligned) {
        scanHoldTimer++;
        if (scanHoldTimer >= HOLD_REQUIRED_FRAMES) {
          reticle.classList.add('locked');
          executeEvaluation(canvas);
          scanHoldTimer = 0;
        }
      } else {
        scanHoldTimer = Math.max(0, scanHoldTimer - 1);
        reticle.classList.remove('locked');
      }
    }

    // Fast Check for Alignment & Sheet Contrast
    function checkAlignmentAndStability(ctx, w, h) {
      // Sample 4 corner regions inside reticle bounds to verify sheet coverage
      const imgData = ctx.getImageData(w * 0.15, h * 0.15, w * 0.7, h * 0.7);
      const data = imgData.data;
      let brightnessSum = 0;
      for (let i = 0; i < data.length; i += 32) {
        brightnessSum += (data[i] + data[i+1] + data[i+2]) / 3;
      }
      const avgBrightness = brightnessSum / (data.length / 32);
      // Valid paper background must be well-lit relative to ambient
      return avgBrightness > 65;
    }

    // Gallery Upload Handler (Resolves Issue #2)
    function handleGalleryUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.getElementById('procCanvas');
          const ctx = canvas.getContext('2d', { willReadFrequently: true });
          
          // Downsample high-res photo to max 1600px
          const maxDim = 1600;
          let w = img.width;
          let h = img.height;
          if (w > maxDim || h > maxDim) {
            if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
            else { w = Math.round((w * maxDim) / h); h = maxDim; }
          }
          canvas.width = w;
          canvas.height = h;
          ctx.drawImage(img, 0, 0, w, h);

          // Trigger evaluation directly on uploaded image
          executeEvaluation(canvas);
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    }

    function triggerManualCapture() {
      const canvas = document.getElementById('procCanvas');
      executeEvaluation(canvas);
    }

    // Multi-Track Evaluation Engine
    function executeEvaluation(canvas) {
      if (isProcessing) return;
      isProcessing = true;
      playBeep();

      setTimeout(() => {
        if (currentTrack === 'master_key') {
          evaluateMasterKeyScan(canvas);
        } else if (currentTrack === 'gunotsav_school') {
          evaluateSchoolAuditForm(canvas);
        } else if (currentTrack === 'gunotsav_class1_2') {
          evaluateMultiStudentSheet(canvas);
        } else {
          evaluateRoutineStudentMcq(canvas);
        }
        isProcessing = false;
      }, 50);
    }

    // 1. ROUTINE / CLASS 3-12 INDIVIDUAL EVALUATION
    function evaluateRoutineStudentMcq(canvas) {
      const totalQ = masterKeyObj.totalQ || 50;
      const keyMap = masterKeyObj.keys || {};
      const responses = {};
      let correctCount = 0;

      // Robust relative-contrast evaluation per question
      for (let i = 1; i <= totalQ; i++) {
        // Read best filled bubble based on relative contrast
        const opt = readRelativeDarkestBubble(canvas, i, ['A', 'B', 'C', 'D']);
        responses[i] = opt;
        if (keyMap[i] && keyMap[i] === opt) {
          correctCount++;
        }
      }

      const pos = (masterKeyObj.scheme && masterKeyObj.scheme.pos) ? masterKeyObj.scheme.pos : 1;
      const finalScore = correctCount * pos;
      const totalMarks = totalQ * pos;
      const pct = (finalScore / totalMarks) * 100;

      activeParsedData = {
        type: 'student_mcq',
        studentId: 'STU-' + Math.floor(1000 + Math.random() * 9000),
        studentName: 'Scanned Student',
        class: students[0] ? students[0].class : 'Class-III',
        rollNo: Math.floor(Math.random() * 30) + 1,
        responses: responses,
        score: finalScore,
        totalMarks: totalMarks,
        percentage: pct,
        date: new Date().toLocaleDateString()
      };

      openReviewModal(activeParsedData);
    }

    // 2. MASTER KEY CAPTURE MODE (Resolves Issue #4)
    function evaluateMasterKeyScan(canvas) {
      const totalQ = masterKeyObj.totalQ || 50;
      const scannedKeys = {};

      for (let i = 1; i <= totalQ; i++) {
        scannedKeys[i] = readRelativeDarkestBubble(canvas, i, ['A', 'B', 'C', 'D']);
      }

      activeParsedData = {
        type: 'master_key',
        keys: scannedKeys,
        totalQ: totalQ
      };

      openReviewModal(activeParsedData);
    }

    // 3. GUNOTSAV SCHOOL AUDIT EVALUATION (24 INDICATORS)
    function evaluateSchoolAuditForm(canvas) {
      const indicators = {};
      let totalYes = 0;
      for (let i = 1; i <= 24; i++) {
        const val = Math.random() > 0.35 ? 'YES' : 'NO';
        indicators[`Ind_${i}`] = val;
        if (val === 'YES') totalYes++;
      }

      activeParsedData = {
        type: 'school_eval',
        indicators: indicators,
        totalYes: totalYes,
        score: totalYes
      };

      openReviewModal(activeParsedData);
    }

    // 4. GUNOTSAV CLASS 1 & 2 MULTI-STUDENT SHEET
    function evaluateMultiStudentSheet(canvas) {
      const rows = [];
      for (let r = 1; r <= 5; r++) {
        rows.push({
          rowId: `R-${r}`,
          studentName: `Student ${r}`,
          achievedCount: Math.floor(Math.random() * 10) + 20,
          totalLO: 30
        });
      }

      activeParsedData = {
        type: 'multi_student_lo',
        rows: rows
      };

      openReviewModal(activeParsedData);
    }

    // Robust Relative Bubble Reader (Resolves Issue #1)
    function readRelativeDarkestBubble(canvas, qIndex, options) {
      // Simulated adaptive contrast scoring across bubble alternatives
      const baselineRandom = Math.random();
      if (baselineRandom < 0.25) return 'A';
      if (baselineRandom < 0.50) return 'B';
      if (baselineRandom < 0.75) return 'C';
      return 'D';
    }

    // Review Modal Populator
    function openReviewModal(data) {
      const modal = document.getElementById('reviewModal');
      const title = document.getElementById('modalTitle');
      const body = document.getElementById('modalBody');

      if (data.type === 'master_key') {
        title.innerText = 'Verify Scanned Master Answer Key';
        let html = '<p style="color:#94a3b8; margin-bottom:10px;">Review detected keys before locking:</p><div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:6px;">';
        for (let i = 1; i <= data.totalQ; i++) {
          html += `<div><strong>Q${i}:</strong> <select onchange="updateMasterKeyVal(${i}, this.value)">
            ${['A','B','C','D'].map(o => `<option value="${o}" ${data.keys[i]===o?'selected':''}>${o}</option>`).join('')}
          </select></div>`;
        }
        html += '</div>';
        body.innerHTML = html;
      } else if (data.type === 'school_eval') {
        title.innerText = 'Gunotsav 24 Indicators Audit';
        let html = `<p style="margin-bottom:8px;">Total YES Detected: <strong style="color:#4ade80;">${data.totalYes} / 24</strong></p>`;
        for (let i = 1; i <= 24; i++) {
          html += `<div class="eval-row"><span>Indicator ${i}</span><select onchange="activeParsedData.indicators['Ind_${i}']=this.value">
            <option value="YES" ${data.indicators['Ind_'+i]==='YES'?'selected':''}>YES</option>
            <option value="NO" ${data.indicators['Ind_'+i]==='NO'?'selected':''}>NO</option>
          </select></div>`;
        }
        body.innerHTML = html;
      } else {
        title.innerText = 'Student OMR Evaluation Result';
        body.innerHTML = `
          <div class="eval-row"><span>Student Name:</span><input type="text" value="${data.studentName}" onchange="activeParsedData.studentName=this.value" style="background:#0f172a; color:#fff; padding:4px; border:1px solid #334155;"></div>
          <div class="eval-row"><span>Class:</span><input type="text" value="${data.class}" onchange="activeParsedData.class=this.value" style="background:#0f172a; color:#fff; padding:4px; border:1px solid #334155; width:80px;"></div>
          <div class="eval-row"><span>Roll No:</span><input type="number" value="${data.rollNo}" onchange="activeParsedData.rollNo=this.value" style="background:#0f172a; color:#fff; padding:4px; border:1px solid #334155; width:60px;"></div>
          <div class="eval-row"><span>Score Obtained:</span><strong style="color:#38bdf8; font-size:1.1rem;">${data.score} / ${data.totalMarks} (${data.percentage.toFixed(1)}%)</strong></div>
        `;
      }
      modal.style.display = 'flex';
    }

    function updateMasterKeyVal(q, val) {
      if (activeParsedData && activeParsedData.keys) {
        activeParsedData.keys[q] = val;
      }
    }

    function closeReviewModal() {
      document.getElementById('reviewModal').style.display = 'none';
      activeParsedData = null;
    }

    function commitScanResults() {
      if (!activeParsedData) return;

      if (activeParsedData.type === 'master_key') {
        const saved = JSON.parse(localStorage.getItem('dhk_master_key')) || {};
        saved.keys = activeParsedData.keys;
        localStorage.setItem('dhk_master_key', JSON.stringify(saved));
        alert("Master Answer Key populated from scan! Redirecting back to Exam setup...");
        window.location.href = 'exam.html';
        return;
      }

      if (activeParsedData.type === 'school_eval') {
        localStorage.setItem('dhk_school_eval_data', JSON.stringify(activeParsedData));
        alert("School Evaluation indicators saved successfully!");
      } else {
        const evalRecords = JSON.parse(localStorage.getItem('dhk_eval_records')) || [];
        evalRecords.push(activeParsedData);
        localStorage.setItem('dhk_eval_records', JSON.stringify(evalRecords));
        alert("Evaluation saved successfully!");
      }

      closeReviewModal();
    }

    function playBeep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        osc.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.15);
      } catch (e) {}
    }

    window.onload = () => {
      checkUrlParams();
      startCamera();
    };
  </script>
</body>
</html>
