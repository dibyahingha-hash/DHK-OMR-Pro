<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>DHK OMR - School Evaluation (24 Indicators)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .scan-guide {
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.65);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans select-none overflow-x-hidden">

  <!-- TOP HEADER -->
  <header class="bg-slate-900 border-b border-slate-800 p-2.5 z-30 sticky top-0 shadow-lg">
    <div class="flex items-center justify-between gap-2 max-w-lg mx-auto">
      <div class="flex items-center gap-2">
        <a href="index.html" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition">
          <i data-lucide="arrow-left" class="w-4 h-4"></i>
        </a>
        <div>
          <h1 class="text-xs font-black text-white tracking-wider uppercase">School Evaluation</h1>
          <div id="schoolScoreSummary" class="text-[11px] font-medium flex items-center gap-1 text-amber-400">
            <i data-lucide="award" class="w-3 h-3"></i> <span>24 Indicators (10% Weight)</span>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-1.5">
        <button id="torchBtn" onclick="toggleTorch()" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700">
          <i data-lucide="zap-off" id="torchIcon" class="w-4 h-4"></i>
        </button>
        <button onclick="openFormDrawer()" class="px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold flex items-center gap-1 transition">
          <i data-lucide="edit-3" class="w-3.5 h-3.5"></i>
          <span>Manual Form</span>
        </button>
      </div>
    </div>
  </header>

  <!-- LIVE SUMMARY BANNER -->
  <div class="bg-slate-900/90 border-b border-slate-800 px-4 py-2 z-20">
    <div class="max-w-lg mx-auto flex items-center justify-between text-xs">
      <div>
        <span class="text-slate-400 text-[10px] uppercase block font-semibold">Total Evaluation Score</span>
        <span id="displayScore" class="text-emerald-400 font-black text-base font-mono">0 / 24</span>
      </div>
      <div class="text-right">
        <span class="text-slate-400 text-[10px] uppercase block font-semibold">Institutional Grade (10%)</span>
        <span id="displayGrade" class="text-amber-400 font-black text-base">Pending</span>
      </div>
    </div>
  </div>

  <!-- VIEWFINDER: Explicit container height prevents collapsing on mobile -->
  <main class="relative w-full h-[58vh] bg-black flex items-center justify-center overflow-hidden">
    <video id="videoFeed" playsinline autoplay muted class="absolute inset-0 w-full h-full object-cover"></video>
    <canvas id="procCanvas" class="hidden"></canvas>

    <!-- Visual Target Framing -->
    <div class="relative z-10 w-[88%] h-[88%] border-2 border-amber-400/90 rounded-2xl scan-guide pointer-events-none flex flex-col justify-between p-2.5">
      <div class="flex justify-between items-center text-[10px] font-mono text-amber-200 bg-slate-950/80 px-2 py-1 rounded">
        <span>INSTITUTIONAL CARD ──►</span>
        <span class="text-amber-300 font-bold uppercase">24 INDICATORS</span>
      </div>

      <div class="w-full border-b-2 border-dashed border-amber-400/80 text-right pr-1">
        <span class="text-[9px] font-bold text-amber-300 bg-slate-950/80 px-1.5 py-0.5 rounded">DOMAIN 1 TO 4</span>
      </div>

      <div class="text-[10px] font-medium text-center text-slate-200 bg-slate-950/80 py-1 rounded">
        Fit full 24-indicator checklist inside guide lines
      </div>
    </div>
  </main>

  <!-- ACTION FOOTER -->
  <footer class="bg-slate-900 border-t border-slate-800 p-3 z-30 sticky bottom-0 shadow-2xl">
    <div class="max-w-lg mx-auto flex items-center justify-between gap-2.5">
      <button onclick="resetIndicators()" class="px-3.5 py-3 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold border border-slate-700 transition">
        Reset
      </button>
      <button onclick="triggerSchoolScan()" id="scanActionBtn" class="flex-1 flex items-center justify-center gap-2 bg-amber-600 hover:bg-amber-500 active:scale-95 text-white font-bold py-3 rounded-xl shadow-lg transition text-sm">
        <i data-lucide="scan-line" class="w-5 h-5"></i>
        <span>Scan Checklist</span>
      </button>
      <button onclick="saveAndReturn()" class="px-4 py-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold shadow-lg transition">
        Save & Done
      </button>
    </div>
  </footer>

  <!-- FULL 24-INDICATOR INTERACTIVE FORM DRAWER -->
  <div id="formDrawer" class="hidden fixed inset-0 z-50 bg-black/85 flex items-end justify-center">
    <div class="bg-slate-900 border-t border-slate-800 w-full max-w-lg rounded-t-2xl p-4 space-y-3 max-h-[85vh] flex flex-col shadow-2xl">
      <div class="flex justify-between items-center border-b border-slate-800 pb-2">
        <div>
          <h3 class="font-black text-white text-xs uppercase tracking-wider">Gunotsav 24 Indicators Checklist</h3>
          <span class="text-[11px] text-slate-400">Tap to toggle (0 or 1 point per indicator)</span>
        </div>
        <button onclick="closeFormDrawer()" class="p-1.5 text-slate-400 hover:text-white rounded-lg bg-slate-800">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- 4 DOMAINS ACCORDION CONTAINER -->
      <div id="indicatorsList" class="flex-1 overflow-y-auto space-y-2 pr-1 text-xs">
        <!-- Rendered dynamically -->
      </div>

      <div class="pt-2 border-t border-slate-800 flex gap-2">
        <button onclick="setAllIndicators(1)" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold py-2 rounded-xl text-xs">
          Select All (24/24)
        </button>
        <button onclick="closeFormDrawer()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 rounded-xl text-xs">
          Confirm Scores
        </button>
      </div>
    </div>
  </div>

  <script>
    let videoStream = null;
    let videoTrack = null;
    let torchActive = false;

    // Official Gunotsav 24-Indicator breakdown across 4 domains
    const domains = [
      {
        title: "Domain I: Learning & Teaching (7 Items)",
        items: [
          "1. Lesson plan prepared & followed",
          "2. Effective TLM utilization in classroom",
          "3. Continuous assessment register maintained",
          "4. Remedial classes for slow learners",
          "5. Student reading corner active",
          "6. Activity-based learning environment",
          "7. Class display boards up to date"
        ]
      },
      {
        title: "Domain II: Infrastructure & Resources (6 Items)",
        items: [
          "8. Safe drinking water available",
          "9. Functional separate toilets (Boys/Girls)",
          "10. Electricity & working fans/lights",
          "11. Library books issued to students",
          "12. Kitchen shed hygiene & MDM clean",
          "13. Barrier-free access / ramp for CWSN"
        ]
      },
      {
        title: "Domain III: Equity, Inclusion & Safety (6 Items)",
        items: [
          "14. Child protection policy displayed",
          "15. First-aid kit equipped & accessible",
          "16. Disaster management plan active",
          "17. Equal opportunity across all genders",
          "18. Special support provided for CWSN",
          "19. Clean campus & waste management"
        ]
      },
      {
        title: "Domain IV: Governance & Community (5 Items)",
        items: [
          "20. SMC monthly meetings recorded",
          "21. School Development Plan (SDP) prepared",
          "22. 80%+ student attendance maintained",
          "23. Active parent-teacher interactions",
          "24. Shiksha Setu daily uploads regular"
        ]
      }
    ];

    let indicatorScores = new Array(24).fill(0);

    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      initCamera();
      loadSavedIndicators();
      renderIndicatorList();
    });

    async function initCamera() {
      try {
        videoStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }
        });
        document.getElementById('videoFeed').srcObject = videoStream;
        videoTrack = videoStream.getVideoTracks()[0];
      } catch (err) {
        alert("Camera error: " + err.message);
      }
    }

    async function toggleTorch() {
      if (!videoTrack) return;
      const caps = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
      if (!caps.torch) {
        alert("Flashlight not supported.");
        return;
      }
      try {
        torchActive = !torchActive;
        await videoTrack.applyConstraints({ advanced: [{ torch: torchActive }] });
        const icon = document.getElementById('torchIcon');
        const btn = document.getElementById('torchBtn');
        if (torchActive) {
          icon.setAttribute('data-lucide', 'zap');
          btn.classList.add('bg-amber-500', 'text-slate-950', 'border-amber-400');
        } else {
          icon.setAttribute('data-lucide', 'zap-off');
          btn.classList.remove('bg-amber-500', 'text-slate-950', 'border-amber-400');
        }
        lucide.createIcons();
      } catch (e) {
        console.error(e);
      }
    }

    function loadSavedIndicators() {
      const stored = localStorage.getItem('dhk_school_indicators');
      if (stored) {
        try {
          const parsed = JSON.parse(stored);
          if (Array.isArray(parsed) && parsed.length === 24) {
            indicatorScores = parsed;
          } else if (parsed.scores && Array.isArray(parsed.scores)) {
            indicatorScores = parsed.scores;
          }
        } catch (e) {
          console.error(e);
        }
      }
      updateScoreUI();
    }

    function renderIndicatorList() {
      const container = document.getElementById('indicatorsList');
      container.innerHTML = "";

      let overallIdx = 0;
      domains.forEach((dom) => {
        const section = document.createElement('div');
        section.className = "space-y-1.5 pt-2";

        const title = document.createElement('h4');
        title.className = "text-[11px] font-bold text-amber-400 uppercase tracking-wider pb-1 border-b border-slate-800";
        title.innerText = dom.title;
        section.appendChild(title);

        dom.items.forEach((itemText) => {
          const itemIdx = overallIdx;
          const isChecked = indicatorScores[itemIdx] === 1;

          const row = document.createElement('div');
          row.className = `flex items-center justify-between p-2 rounded-xl border transition cursor-pointer ${
            isChecked ? 'bg-indigo-950/60 border-indigo-500' : 'bg-slate-950 border-slate-800 hover:border-slate-700'
          }`;
          row.id = `indicator_row_${itemIdx}`;
          row.onclick = () => toggleIndicator(itemIdx);

          row.innerHTML = `
            <span class="text-slate-200 font-medium">${itemText}</span>
            <span class="w-6 h-6 rounded-lg flex items-center justify-center font-bold text-xs ${
              isChecked ? 'bg-indigo-600 text-white' : 'bg-slate-900 text-slate-500 border border-slate-700'
            }">
              ${isChecked ? '1' : '0'}
            </span>
          `;

          section.appendChild(row);
          overallIdx++;
        });

        container.appendChild(section);
      });
    }

    function toggleIndicator(idx) {
      indicatorScores[idx] = indicatorScores[idx] === 1 ? 0 : 1;
      updateRowUI(idx);
      updateScoreUI();
      saveToStorage();
    }

    function updateRowUI(idx) {
      const row = document.getElementById(`indicator_row_${idx}`);
      if (!row) return;
      const isChecked = indicatorScores[idx] === 1;
      row.className = `flex items-center justify-between p-2 rounded-xl border transition cursor-pointer ${
        isChecked ? 'bg-indigo-950/60 border-indigo-500' : 'bg-slate-950 border-slate-800 hover:border-slate-700'
      }`;
      const badge = row.querySelector('span:last-child');
      badge.className = `w-6 h-6 rounded-lg flex items-center justify-center font-bold text-xs ${
        isChecked ? 'bg-indigo-600 text-white' : 'bg-slate-900 text-slate-500 border border-slate-700'
      }`;
      badge.innerText = isChecked ? '1' : '0';
    }

    function setAllIndicators(val) {
      indicatorScores = new Array(24).fill(val);
      for (let i = 0; i < 24; i++) updateRowUI(i);
      updateScoreUI();
      saveToStorage();
    }

    function resetIndicators() {
      if (confirm("Reset all 24 indicators to 0?")) {
        setAllIndicators(0);
      }
    }

    function updateScoreUI() {
      const total = indicatorScores.reduce((a, b) => a + b, 0);
      const percentage = (total / 24) * 100;

      let grade = "D";
      let colorClass = "text-rose-400";
      if (percentage >= 85) { grade = "A+"; colorClass = "text-emerald-400"; }
      else if (percentage >= 70) { grade = "A"; colorClass = "text-indigo-400"; }
      else if (percentage >= 55) { grade = "B"; colorClass = "text-amber-400"; }
      else if (percentage >= 40) { grade = "C"; colorClass = "text-orange-400"; }

      document.getElementById('displayScore').innerText = `${total} / 24`;
      const gradeElem = document.getElementById('displayGrade');
      gradeElem.innerText = total > 0 ? `${grade} (${percentage.toFixed(1)}%)` : "Pending";
      gradeElem.className = `${colorClass} font-black text-base`;
    }

    function saveToStorage() {
      const total = indicatorScores.reduce((a, b) => a + b, 0);
      const percentage = (total / 24) * 100;
      const payload = {
        scores: indicatorScores,
        rawTotal: total,
        maxScore: 24,
        percentage: percentage,
        institutionalWeight: 10,
        weightedScore: (percentage * 0.10)
      };
      localStorage.setItem('dhk_school_indicators', JSON.stringify(payload));
    }

    async function triggerSchoolScan() {
      const video = document.getElementById('videoFeed');
      const canvas = document.getElementById('procCanvas');
      canvas.width = video.videoWidth || 1280;
      canvas.height = video.videoHeight || 720;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      // Automated bubble row sampling across the 24 indicator boxes
      const h = canvas.height;
      const w = canvas.width;
      const rowStep = (h * 0.70) / 24;
      const startY = h * 0.18;
      const markColX = w * 0.78; // Ticked box position on form

      for (let i = 0; i < 24; i++) {
        const cy = startY + (i * rowStep);
        const density = sampleBoxDensity(ctx, markColX, cy, 8);
        indicatorScores[i] = density > 0.32 ? 1 : 0;
        updateRowUI(i);
      }

      updateScoreUI();
      saveToStorage();
      openFormDrawer();
    }

    function sampleBoxDensity(ctx, cx, cy, radius) {
      try {
        const imgData = ctx.getImageData(Math.floor(cx - radius), Math.floor(cy - radius), radius * 2, radius * 2);
        const data = imgData.data;
        let darkPixels = 0;
        let total = 0;

        for (let i = 0; i < data.length; i += 4) {
          const gray = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
          if (gray < 110) darkPixels++;
          total++;
        }
        return total > 0 ? (darkPixels / total) : 0;
      } catch (e) {
        return 0;
      }
    }

    function openFormDrawer() {
      document.getElementById('formDrawer').classList.remove('hidden');
    }

    function closeFormDrawer() {
      document.getElementById('formDrawer').classList.add('hidden');
    }

    function saveAndReturn() {
      saveToStorage();
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
