<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DHK OMR Pro • Grade Card</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root {
      --bg: #121721; --card: #1e2635; --header: #1a2230;
      --blue: #296bb2; --green: #2e8556; --orange: #d9731a; --red: #c53030; --gold: #ecc94b;
      --text: #f0f4f8; --sub: #a0aec0; --border: #2d3748;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 50px; }

    header { background: var(--header); padding: 12px 14px; border-bottom: 1px solid var(--border); }
    .app-name { font-size: 16px; font-weight: bold; margin-bottom: 10px; display: flex; justify-content: space-between; }
    .nav-links { display: flex; gap: 6px; overflow-x: auto; }
    .nav-btn {
      flex: 1; text-align: center; padding: 8px 10px; border-radius: 6px;
      font-size: 12px; font-weight: bold; text-decoration: none;
      background: var(--card); color: var(--sub); border: 1px solid var(--border); white-space: nowrap;
    }
    .nav-btn.active { background: var(--blue); color: #fff; border-color: var(--blue); }

    .container { padding: 14px; max-width: 680px; margin: 0 auto; }
    .card { background: var(--card); border-radius: 8px; padding: 14px; margin-bottom: 14px; border: 1px solid var(--border); }
    .card h3 { font-size: 15px; margin-bottom: 10px; color: var(--gold); }

    .btn {
      width: 100%; padding: 11px 12px; border-radius: 8px; border: none;
      font-weight: bold; font-size: 13px; color: #fff; cursor: pointer; text-align: center; margin-bottom: 8px;
    }
    .btn-green { background: var(--green); }
    .btn-blue { background: var(--blue); }
    .btn-gray { background: #4a5568; }

    .score-banner {
      background: linear-gradient(135deg, #1a273a, #16202e);
      border: 1px solid #2d3748; border-radius: 8px; padding: 16px;
      display: flex; justify-content: space-around; align-items: center; margin-bottom: 14px;
    }
    .sb-item { text-align: center; }
    .sb-num { font-size: 24px; font-weight: bold; margin-bottom: 2px; }
    .sb-lbl { font-size: 11px; color: var(--sub); text-transform: uppercase; }

    .grade-badge {
      display: inline-block; padding: 6px 16px; border-radius: 6px;
      font-size: 20px; font-weight: 900; background: #22543d; color: #9ae6b4; border: 1px solid #38a169;
    }

    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
    th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border); }
    th { background: var(--header); color: var(--sub); font-size: 11px; text-transform: uppercase; }
    tr:hover { background: rgba(255, 255, 255, 0.02); }

    .form-group { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .form-group label { font-size: 13px; color: var(--sub); }
    .form-group input {
      width: 80px; padding: 6px 8px; background: var(--header);
      border: 1px solid var(--border); border-radius: 6px; color: #fff; font-size: 13px; text-align: center;
    }

    @media print {
      body * { visibility: hidden; }
      #printableGradeReport, #printableGradeReport * { visibility: visible; }
      #printableGradeReport {
        position: absolute; left: 0; top: 0; width: 100%;
        color: #000 !important; background: #fff !important; padding: 20px;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="app-name">
      <span>DHK OMR Pro</span>
      <span style="font-size: 12px; color: #68d391;">Grade Card</span>
    </div>
    <div class="nav-links">
      <a href="index.html" class="nav-btn">👥 Roster</a>
      <a href="exam.html" class="nav-btn">📝 Exam & Key</a>
      <a href="scan.html" class="nav-btn">📷 Scanner</a>
      <a href="grade.html" class="nav-btn active">🏆 Grade Card</a>
    </div>
  </header>

  <div class="container">
    <!-- OVERALL PERFORMANCE BANNER -->
    <div class="score-banner">
      <div class="sb-item">
        <div class="sb-num" id="bannerEvaluatedCount" style="color: #63b3ed;">0 / 0</div>
        <div class="sb-lbl">Students Evaluated</div>
      </div>
      <div class="sb-item">
        <div class="sb-num" id="bannerCompositePct" style="color: #68d391;">0%</div>
        <div class="sb-lbl">School Average</div>
      </div>
      <div class="sb-item">
        <div class="grade-badge" id="bannerSchoolGrade">N/A</div>
        <div class="sb-lbl" style="margin-top: 4px;">Institutional Grade</div>
      </div>
    </div>

    <!-- WEIGHTAGE CONFIGURATION -->
    <div class="card">
      <h3>1. Composite Weightage Settings</h3>
      <div class="form-group">
        <label>Scholastic Evaluation Weight (%):</label>
        <input type="number" id="weightScholastic" value="90" min="0" max="100" onchange="calculateOverallInstitutionalScore()">
      </div>
      <div class="form-group">
        <label>School Evaluation (24 Indicators) Weight (%):</label>
        <input type="number" id="weightSchoolEval" value="10" min="0" max="100" onchange="calculateOverallInstitutionalScore()">
      </div>
    </div>

    <!-- CLASS-WISE BREAKDOWN TABLE -->
    <div class="card">
      <h3>2. Class-Wise Scholastic Summary</h3>
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>Class</th>
              <th>Enrolled</th>
              <th>Evaluated</th>
              <th>Avg Score</th>
              <th>Class Grade</th>
            </tr>
          </thead>
          <tbody id="classSummaryTableBody"></tbody>
        </table>
      </div>
    </div>

    <!-- ACTIONS -->
    <div class="card">
      <h3>3. Export & Reporting</h3>
      <button class="btn btn-green" onclick="exportReportToExcel()">📊 Export Complete Results (.xlsx)</button>
      <button class="btn btn-blue" onclick="printOfficialReport()">🖨️ Print School Grade Card</button>
    </div>
  </div>

  <!-- PRINT CONTAINER -->
  <div id="printableGradeReport" style="display: none;"></div>

  <script>
    let students = JSON.parse(localStorage.getItem('dhk_students') || '[]');
    let schoolEval = JSON.parse(localStorage.getItem('dhk_school_eval_data') || '{}');

    function getLetterGrade(pct) {
      if (pct >= 85) return { grade: 'A+', color: '#22543d', text: '#9ae6b4' };
      if (pct >= 70) return { grade: 'A', color: '#2c5282', text: '#bee3f8' };
      if (pct >= 55) return { grade: 'B', color: '#744210', text: '#fefcbf' };
      if (pct >= 40) return { grade: 'C', color: '#7b341e', text: '#feebc8' };
      return { grade: 'D', color: '#742a2a', text: '#fed7d7' };
    }

    function calculateOverallInstitutionalScore() {
      const wScholastic = parseFloat(document.getElementById('weightScholastic').value) || 90;
      const wSchool = parseFloat(document.getElementById('weightSchoolEval').value) || 10;

      const totalStudents = students.length;
      const evaluated = students.filter(s => s.evaluated);
      const evalCount = evaluated.length;

      document.getElementById('bannerEvaluatedCount').innerText = `${evalCount} / ${totalStudents}`;

      let scholasticAvg = 0;
      if (evalCount > 0) {
        const sum = evaluated.reduce((acc, s) => acc + (parseFloat(s.score) || 0), 0);
        scholasticAvg = sum / evalCount;
      }

      // School evaluation score (default 80% baseline if not fully scored)
      let schoolEvalScore = typeof schoolEval.score === 'number' ? schoolEval.score : 80;

      const totalWeight = wScholastic + wSchool;
      const compositeScore = totalWeight > 0 
        ? Math.round(((scholasticAvg * wScholastic) + (schoolEvalScore * wSchool)) / totalWeight) 
        : 0;

      document.getElementById('bannerCompositePct').innerText = `${compositeScore}%`;

      const badge = document.getElementById('bannerSchoolGrade');
      if (evalCount === 0) {
        badge.innerText = 'Pending';
        badge.style.background = '#2d3748';
        badge.style.color = '#a0aec0';
        badge.style.borderColor = '#4a5568';
      } else {
        const gradeInfo = getLetterGrade(compositeScore);
        badge.innerText = gradeInfo.grade;
        badge.style.background = gradeInfo.color;
        badge.style.color = gradeInfo.text;
      }

      renderClassSummaryTable();
    }

    function renderClassSummaryTable() {
      const tbody = document.getElementById('classSummaryTableBody');
      tbody.innerHTML = '';

      const allClasses = [...new Set(students.map(s => s.class_level))].sort();

      if (allClasses.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--sub); padding: 16px;">No student records found in roster.</td></tr>`;
        return;
      }

      allClasses.forEach(cls => {
        const inClass = students.filter(s => s.class_level === cls);
        const evalInClass = inClass.filter(s => s.evaluated);

        let avg = 0;
        if (evalInClass.length > 0) {
          avg = Math.round(evalInClass.reduce((a, b) => a + (parseFloat(b.score) || 0), 0) / evalInClass.length);
        }

        const gr = evalInClass.length > 0 ? getLetterGrade(avg).grade : '-';

        tbody.innerHTML += `
          <tr>
            <td><b>${cls}</b></td>
            <td>${inClass.length}</td>
            <td>${evalInClass.length}</td>
            <td><b>${evalInClass.length > 0 ? avg + '%' : 'Pending'}</b></td>
            <td><span style="font-weight: bold;">${gr}</span></td>
          </tr>
        `;
      });
    }

    function exportReportToExcel() {
      if (students.length === 0) return alert("No students available to export.");

      const exportRows = students.map((s, idx) => ({
        "SL No": idx + 1,
        "Student Name": s.name,
        "Class": s.class_level,
        "Section": s.section || 'A',
        "Student ID / Code": s.unique_id,
        "Evaluated": s.evaluated ? "YES" : "NO",
        "MCQ Marks": s.mcq_marks || 0,
        "Subjective/Skill Marks": s.subj_marks || 0,
        "Total Marks Earned": s.total_marks || (s.mcq_marks + s.subj_marks) || 0,
        "Max Marks": s.max_marks || 76,
        "Percentage": s.evaluated ? `${s.score}%` : "Pending",
        "Grade": s.evaluated ? getLetterGrade(s.score).grade : "Pending"
      }));

      const ws = XLSX.utils.json_to_sheet(exportRows);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "School Evaluation Report");
      XLSX.writeFile(wb, "DHK_OMR_Assessment_Report.xlsx");
    }

    function printOfficialReport() {
      const container = document.getElementById('printableGradeReport');
      const schoolPct = document.getElementById('bannerCompositePct').innerText;
      const schoolGrade = document.getElementById('bannerSchoolGrade').innerText;

      let studentRows = '';
      students.forEach((s, i) => {
        studentRows += `
          <tr>
            <td style="border: 1px solid #000; padding: 6px;">${i + 1}</td>
            <td style="border: 1px solid #000; padding: 6px;"><b>${s.name}</b></td>
            <td style="border: 1px solid #000; padding: 6px;">${s.class_level}</td>
            <td style="border: 1px solid #000; padding: 6px;">${s.unique_id}</td>
            <td style="border: 1px solid #000; padding: 6px;">${s.evaluated ? s.total_marks || (s.mcq_marks + s.subj_marks) : '-'}</td>
            <td style="border: 1px solid #000; padding: 6px;">${s.evaluated ? s.score + '%' : 'Pending'}</td>
            <td style="border: 1px solid #000; padding: 6px;">${s.evaluated ? getLetterGrade(s.score).grade : '-'}</td>
          </tr>
        `;
      });

      container.innerHTML = `
        <div style="font-family: sans-serif; padding: 10px;">
          <div style="text-align: center; border-bottom: 2px solid #000; padding-bottom: 12px; margin-bottom: 16px;">
            <h2 style="margin: 0; text-transform: uppercase;">DHK OMR PRO • INSTITUTIONAL ASSESSMENT REPORT</h2>
            <div style="font-size: 13px; margin-top: 6px;"><b>Composite School Score:</b> ${schoolPct} | <b>Final Grade:</b> ${schoolGrade}</div>
          </div>

          <table style="width: 100%; border-collapse: collapse; font-size: 12px;">
            <thead>
              <tr style="background: #eee;">
                <th style="border: 1px solid #000; padding: 6px;">#</th>
                <th style="border: 1px solid #000; padding: 6px;">Student Name</th>
                <th style="border: 1px solid #000; padding: 6px;">Class</th>
                <th style="border: 1px solid #000; padding: 6px;">Student ID</th>
                <th style="border: 1px solid #000; padding: 6px;">Marks</th>
                <th style="border: 1px solid #000; padding: 6px;">%</th>
                <th style="border: 1px solid #000; padding: 6px;">Grade</th>
              </tr>
            </thead>
            <tbody>${studentRows}</tbody>
          </table>
        </div>
      `;

      container.style.display = 'block';
      window.print();
      container.style.display = 'none';
    }

    calculateOverallInstitutionalScore();
  </script>
</body>
</html>
